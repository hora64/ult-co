<!DOCTYPE html>
<html lang="en">
<head>

    <script type="importmap">

        "imports": {
            "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
        }
    }
    </script>

<body>

        import { SettingsApp } from './assets/js/SettingsApp.js';
