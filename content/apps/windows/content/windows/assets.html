<script type="module">
    import AssetManager from '/content/common/utils/assetManager.js?v=1.2';

    const fileSizeLimitMB = 99;
    let currentDownloadPage = 1;
    const downloadsPerPage = 5;
    let currentFilterPage = 1;
    const filtersPerPage = 5;

    // --- Combobox Functions ---
    /**
     * Shows the combobox options dropdown.
     * @param {string} optionsId - The ID of the options container element.
     */
    function showComboBoxOptions(optionsId) {
        document.getElementById(optionsId).style.display = 'block';
    }

    /**
     * Hides the combobox options dropdown after a short delay.
     * @param {string} optionsId - The ID of the options container element.
     */
    function hideComboBoxOptions(optionsId) {
        setTimeout(() => {
            const options = document.getElementById(optionsId);
            if (options) {
                options.style.display = 'none';
            }
        }, 200); // Delay to allow click event on option to register
    }

    /**
     * Toggles the visibility of the combobox options dropdown.
     * @param {string} optionsId - The ID of the options container element.
     */
    function toggleComboBox(optionsId) {
        const options = document.getElementById(optionsId);
        options.style.display = options.style.display === 'none' ? 'block' : 'none';
    }

    /**
     * Filters the options in a combobox based on user input.
     * @param {string} inputId - The ID of the input element.
     * @param {string} optionsId - The ID of the options container element.
     */
    function filterComboBox(inputId, optionsId) {
        const input = document.getElementById(inputId);
        const filter = input.value.toUpperCase();
        const optionsContainer = document.getElementById(optionsId);
        const options = optionsContainer.getElementsByTagName('li');
        for (let i = 0; i < options.length; i++) {
            const txtValue = options[i].textContent || options[i].innerText;
            if (txtValue.toUpperCase().indexOf(filter) > -1) {
                options[i].style.display = "";
            } else {
                options[i].style.display = "none";
            }
        }
    }

    /**
     * Clears the search input of a combobox and resets the filter.
     * @param {string} inputId - The ID of the input element.
     */
    function clearSearch(inputId) {
        const input = document.getElementById(inputId);
        input.value = '';
        const optionsId = input.getAttribute('aria-owns');
        filterComboBox(inputId, optionsId);
        const clearButton = input.nextElementSibling;
        if (clearButton && clearButton.classList.contains('clear-search-btn')) {
            clearButton.style.display = 'none';
        }
    }

    window.showComboBoxOptions = showComboBoxOptions;
    window.hideComboBoxOptions = hideComboBoxOptions;
    window.toggleComboBox = toggleComboBox;
    window.filterComboBox = filterComboBox;
    window.clearSearch = clearSearch;


    // --- Debounce ---
    /**
     * Creates a debounced function that delays invoking func until after wait milliseconds have elapsed since the last time the debounced function was invoked.
     * @param {Function} func - The function to debounce.
     * @param {number} delay - The number of milliseconds to delay.
     * @returns {Function} The new debounced function.
     */
    function debounce(func, delay) {
        let timeout;
        return function (...args) {
            const context = this;
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(context, args), delay);
        };
    }

    // --- UI Rendering ---
    /**
     * Renders the entire UI based on the current state.
     * @param {object} state - The current state from the AssetManager.
     */
    function renderUI(state) {
        renderAssetList(state);
        renderPaginationControls(state);
        renderSelectedDownloads(state);
        renderSelectedFilters(state);
        updateAssetCount(state);
        updateViewButtons(state);
        updateSort(state);
        updateSliders(state);
        updateSearchTerm(state);
        populateComboBoxes(state);
        updateAssetsPerPage(state);
        updateFilterVisibility();
    }

    /**
     * Renders the list of assets.
     * @param {object} state - The current state, containing paginatedItems, view, and selectedItems.
     */
    function renderAssetList({ paginatedItems, view, selectedItems }) {
        const container = document.getElementById('assetListContainer');
        container.className = `asset-list-container has-scrollbar ${view}-view`;
        container.innerHTML = '';

        if (paginatedItems.length === 0) {
            container.innerHTML = '<div class="no-results">No assets match your criteria.</div>';
            return;
        }

        const fragment = document.createDocumentFragment();
        paginatedItems.forEach(asset => {
            const assetElement = createAssetElement(asset, view, selectedItems);
            fragment.appendChild(assetElement);
        });
        container.appendChild(fragment);
    }

    /**
     * Creates an HTML element for a single asset.
     * @param {object} asset - The asset object.
     * @param {string} view - The current view ('grid' or 'list').
     * @param {Array} downloadArray - The array of currently selected items for download.
     * @returns {HTMLElement} The created asset element.
     */
    function createAssetElement(asset, view, downloadArray) {
        const isList = view === 'list';
        const assetElement = document.createElement(isList ? 'fieldset' : 'div');
        assetElement.className = `asset ${view}-view-item`;
        assetElement.dataset.id = asset.id;

        if (isList) {
            const legend = document.createElement('legend');
            legend.textContent = asset.name;
            assetElement.appendChild(legend);
        }

        const isSelected = downloadArray.some(d => d.id === asset.id);

        // Thumbnail
        const loader = document.createElement('img');
        loader.src = 'https://i.gifer.com/origin/34/34338d26023e5515f6cc8969aa027b7e.gif';
        loader.style.width = '32px';
        assetElement.appendChild(loader);

        const thumbnail = document.createElement('img');
        thumbnail.src = asset.source?.thumbnailUrl || ''; // Safely access thumbnailUrl
        thumbnail.className = 'asset-thumbnail';
        thumbnail.style.width = '100px';
        thumbnail.loading = 'lazy';
        thumbnail.style.display = 'none';
        thumbnail.onload = () => { loader.remove(); thumbnail.style.display = 'block'; };
        thumbnail.onerror = () => {
            loader.remove();
            thumbnail.style.display = 'none'; // Hide if there's an error or no source
            /* you could replace this with a placeholder image if you have one */
        };
        assetElement.appendChild(thumbnail);

        // Bundled items for zip files
        if (asset.type === 'zip' && asset.bundledItems) {
            const bundledContainer = document.createElement('div');
            bundledContainer.className = 'bundled-items-container';
            let bundledHtml = '<ul>';
            asset.bundledItems.forEach(item => {
                bundledHtml += `<li>${item.name}</li>`;
            });
            bundledHtml += '</ul>';
            bundledContainer.innerHTML = bundledHtml;
            assetElement.appendChild(bundledContainer);
        }

        // File Name
        if (!isList) {
            const fileName = document.createElement('div');
            fileName.className = 'file-name';
            fileName.textContent = asset.name;
            assetElement.appendChild(fileName);
        }

        // Actions
        const actionsContainer = document.createElement('div');
        actionsContainer.className = 'asset-actions';

        const buttonRow = document.createElement('div');
        buttonRow.className = 'button-row';
        buttonRow.innerHTML = `
            <button title="Show asset details" data-action="info">Info</button>
            <button title="Open preview in new tab" data-action="preview">Preview</button>
            <button title="Copy download link" data-action="copy-link">Copy Link</button>
        `;
        actionsContainer.appendChild(buttonRow);

        const downloadContainer = document.createElement('div');
        downloadContainer.className = 'download-container';
        const downloadId = `download-${asset.id}`;
        downloadContainer.innerHTML = `
            <input type="checkbox" id="${downloadId}" ${isSelected ? 'checked' : ''} data-action="toggle-download">
            <label for="${downloadId}">Download</label>
        `;
        actionsContainer.appendChild(downloadContainer);

        assetElement.appendChild(actionsContainer);

        // Event delegation for actions
        assetElement.addEventListener('click', (e) => {
            const action = e.target.dataset.action;
            if (!action) return;

            const item = {
                uniqueID: asset.id,
                downloadLink: asset.source?.downloadUrl,
                fileName: asset.name,
                fileType: asset.fileDetails?.mimeType.split('/')[1], // e.g., 'mp4' from 'video/mp4'
                fileSizeMB: (asset.fileDetails?.sizeBytes / (1024 * 1024)),
            };

            switch (action) {
                case 'info':
                    showAssetInfo(asset);
                    break;
                case 'preview':
                    if (asset.source?.previewUrl) {
                        window.open(asset.source.previewUrl, '_blank');
                    }
                    break;
                case 'copy-link':
                    if (asset.source?.downloadUrl) {
                        copyToClipboard(asset.source.downloadUrl, asset.name);
                    }
                    break;
                case 'toggle-download':
                    window.assetManager.toggleDownload(item, e.shiftKey);
                    break;
            }
        });

        return assetElement;
    }

    /**
     * Renders the pagination controls for the asset list.
     * @param {object} state - The current state, containing filteredItemCount, currentPage, and itemsPerPage.
     */
    function renderPaginationControls({ filteredItemCount, currentPage, itemsPerPage }) {
        const container = document.getElementById('paginationControls');
        const pageControlsContainer = document.getElementById('assetPageControls');
        const totalPages = Math.ceil(filteredItemCount / itemsPerPage);

        // Clear existing page links
        pageControlsContainer.innerHTML = '';

        if (totalPages <= 1) return;

        const fragment = document.createDocumentFragment();

        const createButton = (text, page, enabled = true, isCurrent = false) => {
            const button = document.createElement('button');
            button.textContent = text;
            button.disabled = !enabled;
            button.className = 'page-link';
            if (isCurrent) button.classList.add('active');
            button.onclick = () => window.assetManager.setPage(page);
            return button;
        };

        fragment.appendChild(createButton('<<', 1, currentPage > 1));
        fragment.appendChild(createButton('<', currentPage - 1, currentPage > 1));

        const pageInfo = document.createElement('span');
        pageInfo.className = 'page-info';
        pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
        pageInfo.style.margin = "0 10px";
        fragment.appendChild(pageInfo);

        fragment.appendChild(createButton('>', currentPage + 1, currentPage < totalPages));
        fragment.appendChild(createButton('>>', totalPages, currentPage < totalPages));

        pageControlsContainer.appendChild(fragment);
    }

    /**
     * Renders the selected filter tags.
     * @param {object} state - The current state, containing the active filters.
     */
    function renderSelectedFilters({ filters }) {
        const container = document.getElementById('selectedFilters');
        container.innerHTML = '';
        container.style.display = 'flex';
        container.style.flexDirection = 'column';
        container.style.gap = '5px';

        const startIndex = (currentFilterPage - 1) * filtersPerPage;
        const endIndex = startIndex + filtersPerPage;
        const filtersToDisplay = filters.slice(startIndex, endIndex);

        if (filters.length === 0) {
            container.innerHTML = '<p>No filters selected.</p>';
        } else {
            filtersToDisplay.forEach(filter => {
                const filterTag = document.createElement('div');
                filterTag.className = 'filter-item';
                filterTag.textContent = filter.value;

                const removeButton = document.createElement('button');
                removeButton.textContent = 'X';
                removeButton.onclick = () => window.assetManager.removeFilter(filter.value, filter.type);
                filterTag.appendChild(removeButton);

                container.appendChild(filterTag);
            });
        }
        renderFilterPagination(filters.length);
    }

    /**
     * Renders the pagination for the selected filters list.
     * @param {number} totalFilters - The total number of active filters.
     */
    function renderFilterPagination(totalFilters) {
        const paginationContainer = document.getElementById('filterPaginationControls');
        paginationContainer.innerHTML = '';
        const totalPages = Math.ceil(totalFilters / filtersPerPage);
        if (totalPages <= 1) return;

        const createButton = (text, page, enabled = true) => {
            const button = document.createElement('button');
            button.textContent = text;
            button.disabled = !enabled;
            button.onclick = () => {
                currentFilterPage = page;
                renderUI(window.assetManager.getState());
            };
            return button;
        };

        paginationContainer.appendChild(createButton('<<', 1, currentFilterPage > 1));
        paginationContainer.appendChild(createButton('<', currentFilterPage - 1, currentFilterPage > 1));
        const pageInfo = document.createElement('span');
        pageInfo.textContent = ` ${currentFilterPage}/${totalPages} `;
        paginationContainer.appendChild(pageInfo);
        paginationContainer.appendChild(createButton('>', currentFilterPage + 1, currentFilterPage < totalPages));
        paginationContainer.appendChild(createButton('>>', totalPages, currentFilterPage < totalPages));
    }

    /**
     * Renders the list of items selected for download.
     * @param {object} state - The current state, containing the selectedItems.
     */
    function renderSelectedDownloads({ selectedItems }) {
        const container = document.getElementById('selectedDownloadsContainer');
        container.innerHTML = '';

        const startIndex = (currentDownloadPage - 1) * downloadsPerPage;
        const endIndex = startIndex + downloadsPerPage;
        const downloadsToDisplay = selectedItems.slice(startIndex, endIndex);

        if (selectedItems.length === 0) {
            container.innerHTML = '<p>No items selected.</p>';
        } else {
            downloadsToDisplay.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'download-item';
                itemDiv.innerHTML = `
                    <span title="${item.name}.${item.type}">${item.name}.${item.type}</span>
                    <button data-id="${item.id}">X</button>
                `;
                itemDiv.querySelector('button').onclick = () => {
                    window.assetManager.toggleDownload({ uniqueID: item.id });
                };
                container.appendChild(itemDiv);
            });
        }
        renderDownloadPagination(selectedItems.length);
    }

    /**
     * Renders the pagination for the downloads list.
     * @param {number} totalDownloads - The total number of items selected for download.
     */
    function renderDownloadPagination(totalDownloads) {
        const paginationContainer = document.getElementById('downloadPaginationControls');
        paginationContainer.innerHTML = '';
        paginationContainer.style.flexWrap = 'wrap';
        const totalPages = Math.ceil(totalDownloads / downloadsPerPage);
        if (totalPages <= 1) return;

        const createButton = (text, page, enabled = true) => {
            const button = document.createElement('button');
            button.textContent = text;
            button.disabled = !enabled;
            button.onclick = () => {
                currentDownloadPage = page;
                renderUI(window.assetManager.getState());
            };
            return button;
        };

        paginationContainer.appendChild(createButton('<<', 1, currentDownloadPage > 1));
        paginationContainer.appendChild(createButton('<', currentDownloadPage - 1, currentDownloadPage > 1));
        const pageInfo = document.createElement('span');
        pageInfo.textContent = ` ${currentDownloadPage}/${totalPages} `;
        paginationContainer.appendChild(pageInfo);
        paginationContainer.appendChild(createButton('>', currentDownloadPage + 1, currentDownloadPage < totalPages));
        paginationContainer.appendChild(createButton('>>', totalPages, currentDownloadPage < totalPages));
    }

    /**
     * Updates the asset count display.
     * @param {object} state - The current state, containing filteredItemCount and totalItemCount.
     */
    function updateAssetCount({ filteredItemCount, totalItemCount }) {
        const el = document.getElementById('assetCount');
        if (el) {
            el.textContent = `Showing ${filteredItemCount} of ${totalItemCount} assets`;
        }
    }

    /**
     * Updates the view buttons (Grid/List) to reflect the current view.
     * @param {object} state - The current state, containing the view.
     */
    function updateViewButtons({ view }) {
        document.getElementById('gridViewBtn').classList.toggle('active', view === 'grid');
        document.getElementById('listViewBtn').classList.toggle('active', view === 'list');
    }

    /**
     * Updates the sort dropdown to reflect the current sort order.
     * @param {object} state - The current state, containing the sort order.
     */
    function updateSort({ sort }) {
        document.getElementById('sortAssets').value = sort;
    }

    /**
     * Updates the range sliders to reflect the current filter values.
     * @param {object} state - The current state, containing the slider values.
     */
    function updateSliders({ sliders }) {
        // This function needs to be implemented to set the slider values from state
        document.getElementById('videoLengthValue').value = sliders.videoLength || 0;
        document.getElementById('videoLengthRange').value = sliders.videoLength || 0;
        document.getElementById('widthValue').value = sliders.width || 0;
        document.getElementById('widthRange').value = sliders.width || 0;
        document.getElementById('heightValue').value = sliders.height || 0;
        document.getElementById('heightRange').value = sliders.height || 0;
        document.getElementById('fpsValue').value = sliders.fps || 0;
        document.getElementById('fpsRange').value = sliders.fps || 0;
        document.getElementById('sizeValue').value = sliders.size || 0;
        document.getElementById('sizeRange').value = sliders.size || 0;
    }

    /**
     * Updates the search input with the current search term.
     * @param {object} state - The current state, containing the searchTerm.
     */
    function updateSearchTerm({ searchTerm }) {
        const searchInput = document.getElementById('fileNameSearchInput');
        if (searchInput.value !== searchTerm) {
            searchInput.value = searchTerm;
        }
    }

    /**
     * Populates the tag and file type comboboxes with options from all assets.
     * @param {object} state - The current state, containing allItems.
     */
    function populateComboBoxes({ allItems }) {
        const tagOptions = new Set();
        const typeOptions = new Set();
        allItems.forEach(asset => {
            if (asset.tags) asset.tags.forEach(tag => tagOptions.add(tag));
            if (asset.type) typeOptions.add(asset.type);
        });

        _populateComboBox('tagComboBoxOptions', Array.from(tagOptions).sort(), 'tag');
        _populateComboBox('fileTypeComboBoxOptions', Array.from(typeOptions).sort(), 'type');

        // Add blur event listeners to hide combobox options
        document.getElementById('tagComboBoxInput').addEventListener('blur', () => hideComboBoxOptions('tagComboBoxOptions'));
        document.getElementById('fileTypeComboBoxInput').addEventListener('blur', () => hideComboBoxOptions('fileTypeComboBoxOptions'));
    }

    /**
     * Helper function to populate a single combobox.
     * @param {string} comboBoxId - The ID of the combobox options container.
     * @param {Array<string>} options - The array of options to populate.
     * @param {string} type - The filter type ('tag' or 'type').
     * @private
     */
    function _populateComboBox(comboBoxId, options, type) {
        const comboBoxOptions = document.getElementById(comboBoxId);
        comboBoxOptions.innerHTML = '';
        options.forEach(option => {
            const listItem = document.createElement('li');
            listItem.role = 'option';
            listItem.textContent = option;
            listItem.onclick = () => {
                window.assetManager.addFilter(option, type);
                const inputId = comboBoxId.replace('Options', 'Input');
                clearSearch(inputId);
                hideComboBoxOptions(comboBoxId);
            };
            comboBoxOptions.appendChild(listItem);
        });
    }

    /**
     * Updates the "assets per page" dropdown.
     * @param {object} state - The current state, containing itemsPerPage.
     */
    function updateAssetsPerPage({ itemsPerPage }) {
        document.getElementById('assetsPerPage').value = itemsPerPage;
    }

    /**
     * Shows or hides filters based on the types of assets available.
     */
    function updateFilterVisibility() {
        const capabilities = window.assetManager.getAssetCapabilities();
        document.getElementById('videoLengthSlider').style.display = capabilities.hasVideo ? '' : 'none';
        document.getElementById('fpsSlider').style.display = capabilities.hasVideo ? '' : 'none';
    }

    // --- UI Helpers & Event Handlers ---
    /**
     * Sets up all the event listeners for the UI.
     * @param {AssetManager} manager - The instance of the AssetManager.
     */
    function setupEventListeners(manager) {
        const debouncedSliderUpdate = debounce(() => {
            const sliderValues = {
                videoLength: parseFloat(document.getElementById('videoLengthRange').value) || 0,
                width: parseFloat(document.getElementById('widthRange').value) || 0,
                height: parseFloat(document.getElementById('heightRange').value) || 0,
                fps: parseFloat(document.getElementById('fpsRange').value) || 0,
                size: parseFloat(document.getElementById('sizeRange').value) || 0
            };
            manager.setSliders(sliderValues);
        }, 300);

        const debouncedSearch = debounce((term) => manager.setSearchTerm(term), 300);

        document.getElementById('fileNameSearchInput').addEventListener('input', (e) => {
            debouncedSearch(e.target.value);
        });

        // Show clear button on input
        ['tagComboBoxInput', 'fileTypeComboBoxInput'].forEach(id => {
            const input = document.getElementById(id);
            const clearButton = input.nextElementSibling; // Assumes clear button is the next sibling
            input.addEventListener('input', () => {
                if (clearButton && clearButton.classList.contains('clear-search-btn')) {
                    clearButton.style.display = input.value ? 'block' : 'none';
                }
            });
        });

        document.getElementById('sortAssets').addEventListener('change', (e) => manager.setSort(e.target.value));
        document.getElementById('gridViewBtn').addEventListener('click', () => manager.setView('grid'));
        document.getElementById('listViewBtn').addEventListener('click', () => manager.setView('list'));

        document.getElementById('assetsPerPage').addEventListener('change', (e) => {
            manager.setItemsPerPage(e.target.value);
        });

        document.querySelector('.range-slider-container').addEventListener('input', (e) => {
            if (e.target.type === 'range' || e.target.type === 'text') {
                const isRange = e.target.type === 'range';
                const baseId = isRange ? e.target.id.replace('Range', '') : e.target.id.replace('Value', '');
                const rangeEl = document.getElementById(`${baseId}Range`);
                const valueEl = document.getElementById(`${baseId}Value`);

                if (isRange) {
                    valueEl.value = e.target.value;
                } else {
                    rangeEl.value = e.target.value;
                }
                debouncedSliderUpdate();
            }
        });

        document.getElementById('clearFiltersBtn').addEventListener('click', () => manager.clearAllFilters());
        document.getElementById('downloadSelectedBtn').addEventListener('click', downloadSelected);
        document.getElementById('unselectAllDownloadsBtn').addEventListener('click', () => manager.unselectAllDownloads());
        document.getElementById('selectAllFilteredBtn').addEventListener('click', () => manager.selectAllFiltered(true));
        document.getElementById('selectPageBtn').addEventListener('click', () => selectPageOrAll(true, false));
        document.getElementById('unselectPageBtn').addEventListener('click', () => selectPageOrAll(false, false));
        document.getElementById('exportDownloadsBtn').addEventListener('click', exportDownloadList);

        // Accessible Tabs
        const tabs = document.querySelectorAll('[role="tab"]');
        const tabPanels = document.querySelectorAll('[role="tabpanel"]');

        tabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                // Deactivate all tabs and hide all panels
                tabs.forEach(t => t.setAttribute('aria-selected', 'false'));
                tabPanels.forEach(p => p.hidden = true);

                // Activate the clicked tab and show its panel
                tab.setAttribute('aria-selected', 'true');
                const panelId = tab.getAttribute('aria-controls');
                document.getElementById(panelId).hidden = false;
            });
        });
    }

    /**
     * Selects or unselects all assets on the current page or all filtered assets.
     * @param {boolean} select - True to select, false to unselect.
     * @param {boolean} isAll - True to toggle all filtered assets, false to toggle only the current page.
     */
    function selectPageOrAll(select, isAll) {
        const state = window.assetManager.getState();
        const assetsToToggle = isAll ? state.filteredItems : state.paginatedItems;

        assetsToToggle.forEach(asset => {
            const item = {
                uniqueID: asset.id,
                downloadLink: asset.source.downloadUrl,
                fileName: asset.name,
                fileType: asset.fileDetails.mimeType.split('/')[1],
                fileSizeMB: (asset.fileDetails.sizeBytes / (1024 * 1024)),
            };
            const isSelected = state.selectedItems.some(d => d.id === item.uniqueID);
            if ((select && !isSelected) || (!select && isSelected)) {
                window.assetManager.toggleDownload(item);
            }
        });
    }

    /**
     * Initiates the download of selected items.
     * @async
     */
    function downloadSelected() {
        const { selectedItems } = window.assetManager.getState();
        // ... (same download logic as before)
    }

    /**
     * Shows a modal with detailed information about an asset.
     * @param {object} asset - The asset to display info for.
     */
    function showAssetInfo(asset) {
        const modal = document.getElementById('assetInfoModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        modalTitle.textContent = `Info: ${asset.name}`;

        let detailsHtml = '<ul>';
        detailsHtml += `<li><strong>ID:</strong> ${asset.id}</li>`;
        detailsHtml += `<li><strong>Description:</strong> ${asset.description || 'N/A'}</li>`;
        detailsHtml += `<li><strong>Size:</strong> ${(asset.fileDetails.sizeBytes / (1024 * 1024)).toFixed(2)} MB</li>`;
        if (asset.mediaProperties?.dimensions) {
            detailsHtml += `<li><strong>Dimensions:</strong> ${asset.mediaProperties.dimensions.width}x${asset.mediaProperties.dimensions.height}</li>`;
        }
        if (asset.mediaProperties?.durationSeconds) {
            detailsHtml += `<li><strong>Duration:</strong> ${asset.mediaProperties.durationSeconds}s</li>`;
        }
        if (asset.mediaProperties?.frameRate) {
            detailsHtml += `<li><strong>Frame Rate:</strong> ${asset.mediaProperties.frameRate} fps</li>`;
        }
        if (asset.usageRights?.license) {
            detailsHtml += `<li><strong>License:</strong> ${asset.usageRights.license}</li>`;
        }
        detailsHtml += '</ul>';
        modalBody.innerHTML = detailsHtml;

        modal.style.display = 'block';
    }

    /**
     * Copies text to the clipboard.
     * @param {string} text - The text to copy.
     * @param {string} assetName - The name of the asset, for the confirmation message.
     */
    function copyToClipboard(text, assetName) {
        // ... (same clipboard logic as before)
    }

    /**
     * Exports the list of selected downloads as a text file.
     */
    function exportDownloadList() {
        const { selectedItems } = window.assetManager.getState();
        if (selectedItems.length === 0) {
            alert('No files selected for download.');
            return;
        }

        const listContent = selectedItems.map(item => `${item.name}.${item.type}\n${item.source.downloadUrl}`).join('\n\n');
        const blob = new Blob([listContent], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'download-list.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    /**
     * Shows a modal with potential duplicate assets.
     */
    function showDuplicates() {
        const duplicates = window.assetManager.findDuplicates();
        const modalBody = document.getElementById('modalBody');
        const modalTitle = document.getElementById('modalTitle');

        modalTitle.textContent = 'Potential Duplicates';
        if (duplicates.length === 0) {
            modalBody.innerHTML = '<p>No potential duplicates found.</p>';
        } else {
            let html = '<ul>';
            duplicates.forEach(group => {
                html += `<li><strong>${group[0].name} (${(group[0].fileDetails.sizeBytes / (1024 * 1024)).toFixed(2)} MB)</strong>`;
                html += '<ul>';
                group.forEach(asset => {
                    html += `<li>ID: ${asset.id}</li>`;
                });
                html += '</ul></li>';
            });
            html += '</ul>';
            modalBody.innerHTML = html;
        }
        document.getElementById('assetInfoModal').style.display = 'block';
    }

    // --- Initialization ---
    /**
     * Initializes the application.
     * @async
     */
    async function initializeApp() {
        window.assetManager = new AssetManager('/content/common/data/assets.json', renderUI);
        setupEventListeners(window.assetManager);
        await window.assetManager.initialize();
        console.log("test");
        // Make window resizable/draggable etc.
        $(".window").draggable({ handle: ".title-bar" }).resizable({ handles: "n, e, s, w, ne, se, sw, nw" });

        // Close modal logic
        const modal = document.getElementById('assetInfoModal');
        document.querySelector('.close-modal').onclick = () => modal.style.display = "none";
        window.onclick = (event) => {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        };
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeApp);
    } else {
        initializeApp();
    }

</script>
