<div class="window color glass active" id="contestPage" style="width: 450px; height: 418px;">
    <div class="title-bar">
        <div class="title-bar-text">Editor League Season 2</div>
        <div class="title-bar-controls">
            <button aria-label="Close" data-action="close-window"></button>
        </div>
    </div>
    <div class="window-body has-space has-scrollbar" style="width: 423px; height: 348px; overflow: auto">
        <!-- Content sections for dynamic tab loading -->
        <section class="tabs" style="max-width: 601px">
            <menu role="tablist" aria-label="contestPageTabs">
                <button role="tab" aria-controls="info-content" id="tab-btn-editorleagues2-info" aria-selected="true" data-content-id="info-content" data-url="content/windows/contests/editorLeague/editorLeagueS2-info.html">Info/Rules</button>
                <button role="tab" aria-controls="round1-content" id="tab-btn-editorleagues2-round1" data-content-id="round1-content" data-url="content/windows/contests/editorLeague/round1.html">Round #1</button>
                <button role="tab" aria-controls="round2-content" id="tab-btn-editorleagues2-round2" data-content-id="round2-content" data-url="content/windows/contests/editorLeague/round2.html">Round #2</button>
                <button role="tab" aria-controls="round3-content" id="tab-btn-editorleagues2-round3" data-content-id="round3-content" data-url="content/windows/contests/editorLeague/round3.html">Round #3</button>
                <button role="tab" aria-controls="round4-content" id="tab-btn-editorleagues2-round4" data-content-id="round4-content" data-url="content/windows/contests/editorLeague/round4.html" disabled>Round #4</button>
                <button role="tab" aria-controls="round5-content" id="tab-btn-editorleagues2-round5" data-content-id="round5-content" data-url="content/windows/contests/editorLeague/round5.html" disabled>Round #5</button>
            </menu>
            <div id="info-content" class="tab-content"></div>
            <div id="round1-content" class="tab-content"></div>
            <div id="round2-content" class="tab-content"></div>
            <div id="round3-content" class="tab-content"></div>
            <div id="round4-content" class="tab-content"></div>
            <div id="round5-content" class="tab-content"></div>
        </section>
    </div>
    <div class="status-bar" style="width: 435px;">
        <p class="status-bar-field">Round #2 Deadline</p>
        <p class="status-bar-field">July 31st, 2024 3pm EST</p>
        <div id="countdown"></div>
    </div>
</div>
<script>
    $(document).ready(function () {
        // Load initial content for contestPage
        $("#info-content").load("content/windows/contests/editorLeague/editorLeagueS2-info.html");

        // Start the countdown
        startCountdown({
            dom: "countdown",
            end: new Date("July 31, 2024 15:00:00").getTime()
        });
    });
</script>
