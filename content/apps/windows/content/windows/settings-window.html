<!-- Direct content without HTML, HEAD, or BODY tags, ready for dynamic loading -->
<script src="/content/common/libs/jquery/jquery.js"></script>
<script src="/content/common/libs/jquery/jquery-ui.js"></script>
<div class="window color glass active" id="settingsWindow" style="width: 322px; height: 299px;">
    <div class="title-bar">
        <div class="title-bar-text">Website Customization</div>
        <div class="title-bar-controls">
            <button aria-label="Close" data-action="close-window"></button>
        </div>
    </div>
    <div class="window-body has-space has-scrollbar" style="width: 295px; height: 250px; overflow: auto">
        <!-- Content sections for dynamic tab loading -->
        <section class="tabs" style="max-width: 279px">
            <menu role="tablist" aria-label="settingsTabs">
                <button role="tab" aria-controls="image-icon-settings-content" id="tab-btn-image-icon" aria-selected="true" data-content-id="image-icon-settings-content" data-url="content/windows/settings-window/image-icon-settings.html">Image &amp; Icon Settings</button>
                <button role="tab" aria-controls="sound-settings-content" id="tab-btn-sound" data-content-id="sound-settings-content" data-url="content/windows/settings-window/sound-settings.html">Sound</button>
                <button role="tab" aria-controls="window-color-settings-content" id="tab-btn-window-color" data-content-id="window-color-settings-content" data-url="content/windows/settings-window/window-color-settings.html">Window Color</button>
                <button role="tab" aria-controls="mouse-settings-content" id="tab-btn-mouse-settings" data-content-id="mouse-settings-content" data-url="content/windows/settings-window/mouse-settings.html" disabled>Cursor Settings</button>
            </menu>
            <div id="window-color-settings-content" class="tab-content"></div>
            <div id="image-icon-settings-content" class="tab-content"></div>
            <div id="mouse-settings-content" class="tab-content"></div>
            <div id="sound-settings-content" class="tab-content"></div>
        </section>
    </div>
</div>
<script>
$(document).ready(function() {
    // Load initial content
    $("#image-icon-settings-content").load("content/windows/settings-window/image-icon-settings.html");
});
</script>
