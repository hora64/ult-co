        /**
         * A base class for creating UI components. Provides a helper for creating DOM elements.
         */
        class UIComponent {
            constructor() {
                this.element = null;
            }

            /**
             * Creates a new DOM element with specified tag, class, and inner HTML.
             * @param {string} tag - The HTML tag name (e.g., 'div', 'button').
             * @param {string} className - The CSS class name(s) to apply.
             * @param {string} [innerHTML=''] - The inner HTML content of the element.
             * @returns {HTMLElement} The created DOM element.
             */
            createElement(tag, className, innerHTML = '') {
                const el = document.createElement(tag);
                if (className) el.className = className;
                if (innerHTML) el.innerHTML = innerHTML;
                return el;
            }
        }

        /**
         * A custom input field rendered on a canvas.
         * It handles text input, focus, blur, and cursor blinking.
         */
        class CanvasInput extends UIComponent {
            /**
             * @param {object} options - Options for the CanvasInput.
             * @param {string} [options.value=''] - Initial value of the input.
             * @param {string} [options.placeholder=''] - Placeholder text.
             * @param {function} options.onUpdate - Callback function when the input value changes.
             * @param {AnnouncementsApp} options.appInstance - The main app instance for sound playback.
             */
            constructor({
                value = '',
                placeholder = '',
                onUpdate,
                appInstance
            }) {
                super();
                this.app = appInstance; // Store app instance
                this.element = this.createElement('div', 'canvas-input-wrapper');
                this.canvas = this.createElement('canvas');
                this.element.appendChild(this.canvas);
                this.ctx = this.canvas.getContext('2d');
                this.ctx.imageSmoothingEnabled = false; // Disable image smoothing for pixelation
                this.value = value;
                this.placeholder = placeholder;
                this.onUpdate = onUpdate;
                this.isFocused = false;
                this.cursorVisible = false;
                this.element.tabIndex = 0; // Make it focusable

                // Event listeners for input interaction
                this.element.addEventListener('focus', this.handleFocus.bind(this));
                this.element.addEventListener('blur', this.handleBlur.bind(this));
                this.element.addEventListener('keydown', this.handleKeyDown.bind(this));
                this.cursorInterval = null; // Interval for cursor blinking
                this.resize(); // Initial resize and draw
            }

            /**
             * Resizes the internal canvas to match the wrapper element's dimensions.
             */
            resize() {
                const rect = this.element.getBoundingClientRect();
                if (rect.width === 0) return; // Avoid division by zero if element is not rendered
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
                this.draw();
            }

            /**
             * Draws the input field on the canvas, including background, text, and cursor.
             */
            draw() {
                const ctx = this.ctx;
                const {
                    width,
                    height
                } = this.canvas;
                ctx.clearRect(0, 0, width, height);

                // Draw background with rounded corners and subtle shadow
                ctx.save(); // Save context state before applying shadow

                ctx.shadowColor = 'rgba(0, 0, 0, 0.2)'; // Subtle shadow
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 2;

                ctx.fillStyle = 'rgba(0,0,0,0.1)'; // Background color
                ctx.beginPath();
                ctx.roundRect(0, 0, width, height, 4); // Apply border-radius directly
                ctx.fill();

                ctx.restore(); // Restore context state to remove shadow for text

                // Text rendering
                const textX = 10;
                const textY = height / 2;
                if (this.value) {
                    this.app._drawTextOnCanvas(ctx, this.value, textX, textY, '14px "Rodin", sans-serif', 'black', 'left', 'middle');
                } else {
                    this.app._drawTextOnCanvas(ctx, this.placeholder, textX, textY, '14px "Rodin", sans-serif', 'rgba(0,0,0,0.5)', 'left', 'middle');
                }

                // Cursor rendering
                if (this.isFocused && this.cursorVisible) {
                    // Temporarily set font to measure text width accurately for cursor position
                    ctx.font = '14px "Rodin", sans-serif';
                    const textWidth = ctx.measureText(this.value).width;
                    ctx.fillStyle = 'black';
                    ctx.fillRect(textX + textWidth + 1, textY - 8, 1, 16); // Draw a blinking vertical line
                }
            }

            /**
             * Handles focus event on the input, starts cursor blinking.
             */
            handleFocus() {
                if (this.app.sounds.inputFocus) this.app.sounds.inputFocus.play(); // Play sound on focus (if available)
                this.isFocused = true;
                if (this.cursorInterval) clearInterval(this.cursorInterval);
                this.cursorVisible = true;
                this.cursorInterval = setInterval(() => {
                    this.cursorVisible = !this.cursorVisible;
                    this.draw();
                }, 500); // Cursor blinks every 500ms
                this.draw();
            }

            /**
             * Handles blur event on the input, stops cursor blinking.
             */
            handleBlur() {
                if (this.app.sounds.inputBlur) this.app.sounds.inputBlur.play(); // Play sound on blur (if available)
                this.isFocused = false;
                if (this.cursorInterval) clearInterval(this.cursorInterval);
                this.cursorInterval = null;
                this.cursorVisible = false;
                this.draw();
            }

            /**
             * Handles keyboard input for text entry.
             * @param {KeyboardEvent} e - The keyboard event.
             */
            handleKeyDown(e) {
                if (e.key === 'Backspace') {
                    this.value = this.value.slice(0, -1);
                    if (this.app.sounds.typing) this.app.sounds.typing.play('s' + Math.floor(Math.random() * 3 + 1)); // Play typing sound (if available)
                } else if (e.key.length === 1 && !e.metaKey && !e.ctrlKey) { // Allow single character input, exclude meta/ctrl keys
                    this.value += e.key;
                    if (this.app.sounds.typing) this.app.sounds.typing.play('s' + Math.floor(Math.random() * 3 + 1)); // Play typing sound (if available)
                } else if (e.key === "Enter") {
                    this.element.blur(); // Blur on Enter key
                } else {
                    return; // Don't prevent default for other keys like arrows, etc.
                }
                e.preventDefault(); // Prevent default browser behavior for handled keys
                this.onUpdate(this.value); // Notify parent component of value change
                this.draw(); // Redraw input field
            }

            /**
             * Sets the value of the input field.
             * @param {string} newValue - The new value to set.
             */
            setValue(newValue) {
                this.value = newValue;
                this.draw();
            }

            /**
             * Sets the placeholder text of the input field.
             * @param {string} newPlaceholder - The new placeholder text.
             */
            setPlaceholder(newPlaceholder) {
                this.placeholder = newPlaceholder;
                this.draw();
            }
        }

        class TopScreen extends UIComponent {
            /**

            constructor(appInstance) {
                super();
                this.app = appInstance;
                this.element = this.createElement('div', 'top-screen');

                this.articleImageElement = this.createElement('img', 'article-image');
                this.element.appendChild(this.articleImageElement);
            }

            /**
             * Displays the article image on the top screen.
             * @param {string} imageUrl - The URL of the image to display.
             */
            showArticleImage(imageUrl) {
                this.articleImageElement.src = imageUrl;
                this.articleImageElement.style.opacity = '1';
            }
        }

        /**
         * Manages the bottom screen, which contains the article view and the contest form view.
         * This class is responsible for rendering content on canvases,
         * handling user interactions, and managing various UI elements.
         */
        class BottomScreen extends UIComponent {
            /**
             * @param {object} options - Options for the BottomScreen.
             * @param {function} options.onShare - Callback function for share button click.
             * @param {function} options.onCloseArticle - Callback function for close article button click.
             * @param {function} options.onAcceptArticle - Callback function for accept article button click.
             * @param {object} options.sounds - Object containing Howler.js sound instances.
             * @param {object} options.sprites - Object containing Image instances for button icons.
             * @param {AnnouncementsApp} options.appInstance - The main app instance.
             */
            constructor({
                onShare,
                onCloseArticle,
                onAcceptArticle,
                sounds,
                sprites,
                appInstance
            }) {
                super();
                this.app = appInstance;
                this.element = this.createElement('div', 'bottom-screen');

                // Callbacks & State
                this.onShare = onShare;
                this.onCloseArticle = onCloseArticle;
                this.onAcceptArticle = onAcceptArticle;
                this.sounds = sounds;
                this.sprites = sprites;

                // --- DOM Structure ---
                this.articleView = this.createElement('div', 'article-view view');
                this.contestFormView = this.createElement('div', 'contest-form-view view');

                // Wrapper for the scrollable canvas content and its HTML overlay (for article view)
                this.scrollableCanvasWrapper = this.createElement('div', 'scrollable-canvas-wrapper');
                this.htmlOverlay = this.createElement('div', 'article-html-overlay'); // Overlay for HTML elements like iframes (YouTube embeds)
                this.scrollableCanvasWrapper.appendChild(this.htmlOverlay);

                // Append both views to the bottom screen. Only one will be active at a time.
                this.element.appendChild(this.articleView);
                this.element.appendChild(this.contestFormView);

                // Contest Form specific elements
                this.formCanvas = this.createElement('canvas', 'form-canvas');
                this.formOverlay = this.createElement('div', 'form-html-overlay'); // Overlay for HTML inputs in the form
                this.contestFormView.appendChild(this.formCanvas);
                this.contestFormView.appendChild(this.formOverlay);

                this.formCtx = this.formCanvas.getContext('2d');
                this.formCtx.imageSmoothingEnabled = false;

                // Form state
                this.formData = {
                    leaderName: '',
                    leaderDiscord: '',
                    member1Name: '',
                    member2Name: '',
                    sub1Name: '',
                    sub2Name: '',
                    emblemImage: null,
                    emblemColor: '#FF0000' // Default color
                };
                this.canvasInputs = {}; // Store CanvasInput instances
                this.currentFormNavTab = 'rules'; // Default active form tab
                this.currentTeamInfoSubSection = 'leader'; // Default active team info sub-section
                this.currentEmblemSubSection = 'icons'; // Default active emblem sub-section
                this.formValidationMessage = ''; // Message for form validation errors

                // 24 Colors for the emblem customization
                this.colors = [
                    '#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#00FFFF', '#FF00FF', '#C0C0C0', '#808080',
                    '#800000', '#808000', '#008000', '#800080', '#008080', '#000080', '#FFA500', '#A52A2A',
                    '#DA70D6', '#FFC0CB', '#ADD8E6', '#90EE90', '#FFD700', '#DDA0DD', '#F5DEB3', '#D2B48C'
                ];

                // Add click listener for the form canvas
                this.formCanvas.addEventListener('click', this.handleFormCanvasClick.bind(this));
            }

            /**
             * Draws the article content onto the canvas, applying all formatting.
             * @param {string} text - The raw markdown-like text content of the article.
             */
            async drawArticleContent(text) {
                // Clear existing hyperlinks and checkboxes before redrawing
                this.app.hyperlinks = [];
                this.app.checkboxes = [];

                // Remove previous click listener to prevent multiple bindings
                if (this._articleClickListener) {
                    this.articleContentCanvas.removeEventListener('click', this._articleClickListener);
                }
                // Add a new click listener for interactive elements on the canvas
                this._articleClickListener = (e) => this.handleArticleCanvasClick(e);
                this.articleContentCanvas.addEventListener('click', this._articleClickListener);

                // Parse the article content into structured blocks
                const contentBlocks = this.app._parseArticleContent(text || "");
                // Preload all images found in the content blocks
                await this.app.imageManager.loadImagesFromBlocks(contentBlocks);

                const ctx = this.articleContentCanvas.getContext('2d');
                const containerRect = this.scrollableCanvasWrapper.getBoundingClientRect();
                const horizontalPadding = 10; // Padding for the article content
                const verticalPadding = 10; // Padding for the article content
                const drawAreaWidth = this.app.articleContentTextWidth - (horizontalPadding * 2); // Adjust draw area for padding

                // Calculate total height needed for the content
                let totalMeasuredHeight = verticalPadding; // Start with top padding
                for (const block of contentBlocks) {
                    totalMeasuredHeight += this.app._measureBlockHeight(ctx, block, drawAreaWidth) + (this.app.cssVars.blockSpacing || 10);
                }
                totalMeasuredHeight += verticalPadding; // Add bottom padding

                // Set canvas dimensions
                this.articleContentCanvas.width = containerRect.width;
                this.articleContentCanvas.height = Math.max(this.scrollableCanvasWrapper.clientHeight, totalMeasuredHeight);
                this.articleContentCanvas.style.height = `${this.articleContentCanvas.height}px`; // Apply height to CSS for scrolling

                // Clear the canvas
                ctx.clearRect(0, 0, this.articleContentCanvas.width, this.articleContentCanvas.height);

                // Draw the smooth background on the canvas
                ctx.fillStyle = '#FDFDFD'; // Solid white background
                ctx.fillRect(0, 0, this.articleContentCanvas.width, this.articleContentCanvas.height);

                // Draw each content block
                let currentY = verticalPadding; // Start drawing content after top padding
                ctx.textBaseline = 'top'; // Ensure text baseline is consistent
                for (const block of contentBlocks) {
                    // Pass `this.app` explicitly to `_drawFormattedBlock` if it's not already bound
                    const blockHeight = this.app._drawFormattedBlock(ctx, this.htmlOverlay, block, horizontalPadding, currentY, drawAreaWidth);
                    currentY += blockHeight + (this.app.cssVars.blockSpacing || 10);
                }

                // Update the custom scrollbar
                this.articleScrollbar.update();
                // Check scroll position after drawing to enable/disable accept button
                this.updateAcceptButtonState();
            }

            /**
             * Sets the current view mode of the bottom screen.
             * @param {'article'|'contestForm'} mode - The view mode to set.
             * @param {object} data - Data required for the view (e.g., article object).
             */
            setView(mode, data = {}) {
                // Hide all views first
                this.articleView.classList.remove('active');
                this.contestFormView.classList.remove('active');

                // Hide all HTML inputs/elements in the form overlay when switching views
                this.formOverlay.innerHTML = '';
                // Clear canvas inputs to prevent stale references
                this.canvasInputs = {};


                if (mode === 'article') {
                    this.articleView.classList.add('active');
                    this.renderArticleView(data.article);
                } else if (mode === 'contestForm') {
                    this.contestFormView.classList.add('active');
                    this.renderContestFormView(); // Render the form when activated
                }
            }

            /**
             * Creates a canvas-rendered button with custom styling and effects.
             * @param {object} options - Button creation options.
             * @param {string} [options.text] - Text to display on the button.
             * @param {HTMLImageElement} [options.sprite] - Image sprite to display on the button.
             * @param {number} options.width - Width of the button canvas.
             * @param {number} options.height - Height of the button canvas.
             * @param {string} [options.textColor='black'] - Color of the button text.
             * @param {CanvasTextBaseline} [options.textBaseline='middle'] - Text baseline for rendering.
             * @param {CanvasTextAlign} [options.textAlign='center'] - Text alignment for rendering.
             * @param {string} [options.font='16px "Rodin", sans-serif'] - Font style for the text.
             * @param {function} [options.onClick] - Click event handler.
             * @param {string} [options.className='canvas-button'] - CSS class for the button element.
             * @param {string} [options.backgroundColor] - Base background color.
             * @param {string} [options.activeBackgroundColor] - Background color when active/pressed.
             * @param {number|number[]} [options.borderRadius=6] - Border radius (can be single value or array for each corner).
             * @param {string} [options.pulseColor=null] - Color for the pulse effect on click.
             * @param {object} [options.shadowOffset] - Shadow properties.
             * @returns {HTMLButtonElement} The created button element.
             */
            _createCanvasButton({
                text,
                sprite,
                width,
                height,
                textColor = 'black',
                textBaseline = 'middle',
                textAlign = 'center',
                font = '16px "Rodin", sans-serif',
                onClick,
                className = 'canvas-button',
                backgroundColor,
                activeBackgroundColor,
                borderRadius = 6,
                pulseColor = null,
                shadowOffset = {
                    x: 0,
                    y: 2,
                    blur: 4,
                    color: 'rgba(0,0,0,0.2)'
                }
            }) {
                const button = this.createElement('button', className);
                const canvas = this.createElement('canvas');
                button.appendChild(canvas);
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = false; // Disable anti-aliasing for pixel-perfect rendering

                let pulseStartTime = 0;
                let isPulsing = false;
                let animationFrameId = null;
                let isHovered = false;
                let isPressed = false; // State for pressed effect

                const finalTextColor = textColor;

                // Method to update button text dynamically
                button.updateText = (newText) => {
                    text = newText;
                    draw();
                };

                // Starts the pulse animation
                const startPulse = () => {
                    isPulsing = true;
                    pulseStartTime = performance.now();
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    animationFrameId = requestAnimationFrame(animatePulse);
                };

                // Animation loop for the pulse effect
                const animatePulse = (currentTime) => {
                    if (!isPulsing) return;
                    const elapsed = currentTime - pulseStartTime;
                    const duration = 500; // Pulse animation duration
                    const progress = elapsed / duration;
                    if (progress < 1) {
                        draw(progress); // Redraw with current pulse progress
                        animationFrameId = requestAnimationFrame(animatePulse);
                    } else {
                        isPulsing = false;
                        animationFrameId = null;
                        draw(); // Final redraw without pulse
                    }
                };

                // Main drawing function for the button canvas
                const draw = (pulseProgress = 0) => {
                    ctx.clearRect(0, 0, width, height);
                    const isActive = button.classList.contains('active');
                    const isDisabled = button.disabled;

                    let currentBgColor;
                    let currentShadowOffset = { ...shadowOffset
                    };

                    // Determine background color based on button state
                    if (isDisabled) {
                        currentBgColor = '#d1d5db'; // Tailwind gray-300
                        currentShadowOffset = {
                            x: 0,
                            y: 0,
                            blur: 0,
                            color: 'transparent'
                        }; // No shadow when disabled
                    } else if (isPressed) {
                        currentBgColor = activeBackgroundColor || this.app.cssVars['--ds-accent-blue-dark']; // Darker for pressed
                        currentShadowOffset = {
                            x: 0,
                            y: 0,
                            blur: 0,
                            color: 'transparent'
                        }; // No shadow when pressed
                    } else if (isActive) {
                        currentBgColor = activeBackgroundColor || this.app.cssVars['--ds-accent-blue'];
                    } else if (isHovered && !className.includes('share-button')) {
                        currentBgColor = '#E6D5B0'; // Hover color for general buttons
                    } else {
                        // Default background colors
                        currentBgColor = '#F0EAD6';
                    }

                    // Apply specific background colors for back and accept buttons
                    if (className.includes('back-button')) {
                        if (isDisabled) currentBgColor = 'rgba(128, 128, 128, 0.5)';
                        else currentBgColor = isPressed ? '#A72B38' : (isActive ? '#A72B38' : '#DC3545'); // Red tones
                    } else if (className.includes('accept-button')) {
                        if (isDisabled) currentBgColor = 'rgba(128, 128, 128, 0.5)';
                        else currentBgColor = isPressed ? '#1F7A34' : (isActive ? '#1F7A34' : '#28A745'); // Green tones
                    } else if (className.includes('form-nav-button')) {
                        // Form navigation buttons
                        if (isDisabled) {
                            currentBgColor = '#d1d5db'; // gray-300 for disabled
                        } else if (isActive) {
                            currentBgColor = '#f97316'; // orange-500 for selected
                        } else if (isHovered) {
                            currentBgColor = '#fde68a'; // yellow-300 for hover
                        } else {
                            currentBgColor = '#fef08a'; // yellow-200 for unselected
                        }
                    } else if (className.includes('form-sub-tab-button')) {
                        // Form sub-tab buttons
                        if (isActive) {
                            currentBgColor = '#fcd34d'; // yellow-400 for active
                        } else if (isHovered) {
                            currentBgColor = '#fde68a'; // yellow-300 for hover
                        } else {
                            currentBgColor = '#fef08a'; // yellow-200 for unselected
                        }
                    } else if (className.includes('form-submit-button')) {
                        // Form submit button
                        if (isDisabled) currentBgColor = 'rgba(128, 128, 128, 0.5)';
                        else currentBgColor = isPressed ? '#16a34a' : (isHovered ? '#22c55e' : '#28a745'); // Green tones
                    }


                    // Draw button background with shadow
                    ctx.save();
                    ctx.shadowColor = currentShadowOffset.color;
                    ctx.shadowBlur = currentShadowOffset.blur;
                    ctx.shadowOffsetX = currentShadowOffset.x;
                    ctx.shadowOffsetY = currentShadowOffset.y;

                    if (!(currentBgColor.startsWith('rgba') && currentBgColor.endsWith(',0)'))) {
                        ctx.fillStyle = currentBgColor;
                        ctx.beginPath();
                        // Handle borderRadius array for ctx.roundRect (top-left, top-right, bottom-right, bottom-left)
                        const radii = Array.isArray(borderRadius) ? {
                            topLeft: borderRadius[0],
                            topRight: borderRadius[1],
                            bottomRight: borderRadius[2],
                            bottomLeft: borderRadius[3]
                        } : borderRadius;
                        ctx.roundRect(0, 0, width, height, radii);
                        ctx.fill();
                    }
                    ctx.restore();

                    // Draw highlight gradient
                    ctx.save();
                    ctx.beginPath();
                    const highlightRadii = Array.isArray(borderRadius) ? {
                        topLeft: borderRadius[0],
                        topRight: borderRadius[1],
                        bottomRight: borderRadius[2],
                        bottomLeft: borderRadius[3]
                    } : borderRadius;
                    ctx.roundRect(0, 0, width, height, highlightRadii);
                    ctx.clip(); // Clip to the rounded rectangle shape
                    const highlightGradient = ctx.createLinearGradient(0, 0, 0, height);
                    highlightGradient.addColorStop(0, `rgba(255, 255, 255, 0.15)`);
                    highlightGradient.addColorStop(1, `rgba(255, 255, 255, 0)`);
                    ctx.fillStyle = highlightGradient;
                    ctx.fillRect(0, 0, width, height);
                    ctx.restore();

                    // Draw subtle inner shadow gradient
                    ctx.save();
                    ctx.beginPath();
                    const shadowRadii = Array.isArray(borderRadius) ? {
                        topLeft: borderRadius[0],
                        topRight: borderRadius[1],
                        bottomRight: borderRadius[2],
                        bottomLeft: borderRadius[3]
                    } : borderRadius;
                    ctx.roundRect(0, 0, width, height, shadowRadii);
                    ctx.clip();
                    const shadowGradient = ctx.createLinearGradient(0, 0, 0, height);
                    shadowGradient.addColorStop(0, `rgba(0, 0, 0, 0)`);
                    shadowGradient.addColorStop(1, `rgba(0, 0, 0, 0.1)`);
                    ctx.fillStyle = shadowGradient;
                    ctx.fillRect(0, 0, width, height);
                    ctx.restore();

                    // Apply glow effect for share button on hover
                    if (className.includes('share-button') && isHovered && !isDisabled) {
                        ctx.shadowColor = 'rgba(13, 110, 253, 0.8)';
                        ctx.shadowBlur = 15;
                    } else {
                        ctx.shadowColor = 'transparent';
                        ctx.shadowBlur = 0;
                        ctx.shadowOffsetY = 0;
                    }

                    // Draw pulse effect
                    if (isPulsing && pulseColor && !isDisabled) {
                        const radius = pulseProgress * (Math.min(width, height) / 2 * 1.5);
                        const opacity = 0.5 * (1 - pulseProgress);
                        const r = parseInt(pulseColor.slice(1, 3), 16);
                        const g = parseInt(pulseColor.slice(3, 5), 16);
                        const b = parseInt(pulseColor.slice(5, 7), 16);
                        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${opacity})`;
                        ctx.beginPath();
                        ctx.arc(width / 2, height / 2, radius, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Draw sprite (icon)
                    if (sprite) {
                        const spriteSize = 20; // Fixed size for sprite
                        ctx.drawImage(sprite, (width - spriteSize) / 2, (height - spriteSize) / 2, spriteSize, spriteSize);
                    }
                    // Draw text
                    if (text) {
                        this.app._drawTextOnCanvas(ctx, text, width / 2, height / 2, font, finalTextColor, textAlign, textBaseline);
                    }
                    // Reset shadow properties after drawing button content
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                };

                // Observe changes in button class or disabled attribute to trigger redraw
                const observer = new MutationObserver((mutationsList) => {
                    for (const mutation of mutationsList) {
                        if (mutation.type === 'attributes' && (mutation.attributeName === 'class' || mutation.attributeName === 'disabled')) {
                            draw();
                        }
                    }
                });
                observer.observe(button, {
                    attributes: true
                });

                // Event listeners for hover and press effects
                button.addEventListener('mouseenter', () => {
                    if (button.disabled) return;
                    isHovered = true;
                    this.app.sounds.hover.play(); // Play hover sound
                    draw();
                });
                button.addEventListener('mouseleave', () => {
                    isHovered = false;
                    isPressed = false; // Ensure pressed state is reset if mouse leaves while pressed
                    draw();
                });
                button.addEventListener('mousedown', () => {
                    if (button.disabled) return;
                    isPressed = true;
                    draw();
                });
                button.addEventListener('mouseup', () => {
                    if (button.disabled) return;
                    isPressed = false;
                    draw();
                });

                // Click event listener
                if (onClick) {
                    button.addEventListener('click', (e) => {
                        if (button.disabled) return;
                        if (pulseColor) startPulse(); // Start pulse animation if defined
                        onClick(e);
                    });
                }
                // Redraw button once sprite is loaded or immediately if already loaded
                if (sprite && !sprite.complete) sprite.onload = draw;
                else draw();
                return button;
            }

            /**
             * Handles clicks on the article content canvas, specifically for hyperlinks.
             * @param {MouseEvent} e - The click event.
             */
            handleArticleCanvasClick(e) {
                const canvas = this.articleContentCanvas;
                const rect = canvas.getBoundingClientRect();
                const scrollOffset = this.scrollableCanvasWrapper.scrollTop;
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top + scrollOffset;

                // Find if a link was clicked
                const clickedLink = this.app.hyperlinks.find(link => {
                    return x >= link.rect.x && x <= link.rect.x + link.rect.width && y >= link.rect.y && y <= link.rect.y + link.rect.height;
                });

                if (clickedLink) {
                    const url = clickedLink.url;
                    // Handle YouTube video links by opening them in a new window
                    if (url.startsWith('youtube:')) {
                        const videoId = url.substring(8);
                        window.parent.postMessage({
                            type: 'open-url',
                            url: `https://www.youtube.com/watch?v=${videoId}`
                        }, '*');
                    } else {
                        // For other links, open the URL in a new window
                        window.parent.postMessage({
                            type: 'open-url',
                            url: url
                        }, '*');
                    }
                }
            }

            /**
             * Renders the full article view, including header, content, and footer.
             * @param {object} article - The article object to render.
             */
            async renderArticleView(article) {
                // Clear any previous HTML elements from the overlay
                this.htmlOverlay.innerHTML = '';
                // Clear all children of the articleView to prevent lingering elements
                this.articleView.innerHTML = '';

                // Remove the old canvas if it exists in the DOM to prevent duplicates
                if (this.articleContentCanvas && this.articleContentCanvas.parentNode === this.scrollableCanvasWrapper) {
                    this.scrollableCanvasWrapper.removeChild(this.articleContentCanvas);
                }
                // Recreate and append the article content canvas.
                this.articleContentCanvas = this.createElement('canvas', 'article-content-canvas');
                this.scrollableCanvasWrapper.insertBefore(this.articleContentCanvas, this.htmlOverlay);
                // Initialize the custom scrollbar for the article content
                this.articleScrollbar = new Scrollbar(this.scrollableCanvasWrapper, this); // Pass 'this' (BottomScreen instance)

                // Add scroll event listener to update the accept button state
                this.scrollableCanvasWrapper.addEventListener('scroll', this.updateAcceptButtonState.bind(this));

                if (!article) return; // Exit if no article is provided

                // --- Article Header ---
                const header = this.createElement('div', 'article-header-content');

                // Create and draw on a new canvas for the header background
                const headerBackgroundCanvas = this.createElement('canvas', 'header-background-canvas');
                headerBackgroundCanvas.width = 320; // Match header width
                headerBackgroundCanvas.height = 90; // Match header height
                const headerBackgroundCtx = headerBackgroundCanvas.getContext('2d');
                headerBackgroundCtx.imageSmoothingEnabled = false;

                // Draw the light background for the header
                headerBackgroundCtx.fillStyle = '#E8D8C0'; // Solid color
                headerBackgroundCtx.save();
                // Apply shadow to the header background
                headerBackgroundCtx.shadowColor = 'rgba(0,0,0,0.1)';
                headerBackgroundCtx.shadowBlur = 5;
                headerBackgroundCtx.shadowOffsetX = 0;
                headerBackgroundCtx.shadowOffsetY = 2;
                headerBackgroundCtx.beginPath();
                // Rounded corners for the bottom of the header
                headerBackgroundCtx.roundRect(0, 0, headerBackgroundCanvas.width, headerBackgroundCanvas.height, {
                    topLeft: 0,
                    topRight: 0,
                    bottomRight: 6,
                    bottomLeft: 6
                });
                headerBackgroundCtx.fill();
                headerBackgroundCtx.restore();

                // Draw a subtle border-bottom for separation
                headerBackgroundCtx.strokeStyle = 'rgba(0,0,0,0.1)';
                headerBackgroundCtx.lineWidth = 1;
                headerBackgroundCtx.beginPath();
                headerBackgroundCtx.moveTo(0, headerBackgroundCanvas.height - 0.5);
                headerBackgroundCtx.lineTo(headerBackgroundCanvas.width, headerBackgroundCanvas.height - 0.5);
                headerBackgroundCtx.stroke();

                header.prepend(headerBackgroundCanvas); // Add background canvas behind content

                const titleWrapper = this.createElement('div', 'article-title-wrapper');
                const articleTitleCanvas = this.createElement('canvas', 'article-title-h1');
                articleTitleCanvas.width = this.app.articleTitleTextWidth;
                articleTitleCanvas.height = 48; // Fixed height for title canvas
                const articleTitleCtx = articleTitleCanvas.getContext('2d');
                articleTitleCtx.imageSmoothingEnabled = false;

                // Adjust font size for the title to fit within the canvas
                let titleFont = 'bold 20px "Rodin", sans-serif';
                const maxTitleWidth = articleTitleCanvas.width;
                const initialMaxTitleHeight = 48;
                let finalFont = titleFont;
                const measurer = new TextCanvasMeasurer();
                let measuredTitleHeight = measurer.estimateWrappedTextHeight(article.title, finalFont, maxTitleWidth, this.app.articleTitleLineSpacingFactor);
                if (measuredTitleHeight > initialMaxTitleHeight) {
                    finalFont = 'bold 16px "Rodin", sans-serif';
                    measuredTitleHeight = measurer.estimateWrappedTextHeight(article.title, finalFont, maxTitleWidth, this.app.articleTitleLineSpacingFactor);
                    if (measuredTitleHeight > initialMaxTitleHeight) {
                        finalFont = 'bold 14px "Rodin", sans-serif';
                        measuredTitleHeight = measurer.estimateWrappedTextHeight(article.title, finalFont, maxTitleWidth, this.app.articleTitleLineSpacingFactor);
                    }
                }

                articleTitleCtx.clearRect(0, 0, articleTitleCanvas.width, articleTitleCanvas.height);
                // Center the title vertically
                let textY = (articleTitleCanvas.height - measuredTitleHeight) / 2;
                this.app._drawTextOnCanvas(articleTitleCtx, article.title, 0, textY, finalFont, 'black', 'left', 'top', maxTitleWidth, this.app.articleTitleLineSpacingFactor);

                // Share button
                this.shareButton = this._createCanvasButton({
                    sprite: this.sprites.share, // Share icon
                    width: 24,
                    height: 24,
                    onClick: () => this.onShare(),
                    className: 'share-button',
                    backgroundColor: 'rgba(0,0,0,0)', // Transparent background
                    activeBackgroundColor: 'rgba(0,0,0,0)',
                    pulseColor: this.app.cssVars['--ds-accent-blue'],
                    borderRadius: 6,
                    shadowOffset: {
                        x: 0,
                        y: 0,
                        blur: 0,
                        color: 'transparent'
                    } // No shadow
                });

                // Article metadata (author, publisher, date)
                const articleMetaCanvas = this.createElement('canvas', 'article-meta-canvas');
                articleMetaCanvas.width = 290;
                articleMetaCanvas.height = 20;
                const articleMetaCtx = articleMetaCanvas.getContext('2d');
                articleMetaCtx.imageSmoothingEnabled = false;

                // Format date and time based on user's timezone
                const articleDateTime = this.app.userTimeZone ? luxon.DateTime.fromISO(article.date).setZone(this.app.userTimeZone) : luxon.DateTime.fromISO(article.date);
                const formattedDate = articleDateTime.toFormat('MM/dd/yy');
                const formattedTime = articleDateTime.toLocaleString(luxon.DateTime.TIME_SIMPLE);
                const timeZoneAbbr = articleDateTime.toFormat('ZZZZ');

                let metaTextParts = [];
                if (article.author && article.author.trim() !== '') {
                    metaTextParts.push(this.app.t('byAuthor', {
                        author: article.author
                    }));
                }
                if (article.publisher && article.publisher.trim() !== '') {
                    metaTextParts.push(article.publisher);

            /**
             * Draws the main navigation bar for the contest form (Rules, Team Info, Emblems, Submit).
             */
            _drawFormNavBar() {
                const ctx = this.formCtx;
                const canvas = this.formCanvas;

                const navButtonsData = [{
                    id: 'rules',
                    icon: 'ðŸ“œ',
                    text: this.app.t('contestForm.rules')
                }, {
                    id: 'teamInfo',
                    icon: 'ðŸ‘¥',
                    text: this.app.t('contestForm.teamInfo')
                }, {
                    id: 'emblems',
                    icon: 'ðŸŽ¨',
                    text: this.app.t('contestForm.emblems')
                }, {
                    id: 'submit',
                    icon: 'âœ…',
                    text: this.app.t('contestForm.submit')
                }, ];

                const totalButtons = navButtonsData.length;
                const buttonContentWidth = 45; // Thinner button width
                const buttonSpacing = 15; // Increased spacing between buttons
                const roundedRadius = 6; // Equivalent to rounded-md (0.375rem * 16px/rem = 6px)
                const borderWidth = 1; // Equivalent to border-1
                const activeBorderWidth = 2; // Equivalent to border-2

                // Calculate total width of all buttons and their internal spacing
                const totalButtonsAndSpacingWidth = (totalButtons * buttonContentWidth) + ((totalButtons - 1) * buttonSpacing);

                // Calculate the starting X position to center the group of buttons
                const startX = (canvas.width - totalButtonsAndSpacingWidth) / 2;
                const navBarY = canvas.height - 45; // Position at the bottom, 45px height

                // Draw the grey background for the entire canvas
                ctx.fillStyle = '#d1d5db'; // Tailwind gray-300
                ctx.fillRect(0, navBarY, canvas.width, 45); // Fill the entire nav bar area

                navButtonsData.forEach((button, index) => {
                    const x = startX + index * (buttonContentWidth + buttonSpacing);
                    const y = navBarY;
                    const width = buttonContentWidth;
                    const height = 45; // Height of the nav bar buttons

                    const isActive = (button.id === this.currentFormNavTab);

                    // Determine if the button should be disabled based on linear progression
                    let isDisabled = false;
                    const tabOrder = ['rules', 'teamInfo', 'emblems', 'submit'];
                    const currentTabIndex = tabOrder.indexOf(this.currentFormNavTab);
                    const buttonTabIndex = tabOrder.indexOf(button.id);

                    if (buttonTabIndex > currentTabIndex) {
                        // If trying to go to a future tab, check if current tab is valid
                        isDisabled = !this._validateFormTab(this.currentFormNavTab, true); // Pass true to only validate without showing message
                    }


                    // Determine corner radii for each button (rounded top, flat bottom)
                    let currentRadius = {
                        tl: roundedRadius,
                        tr: roundedRadius,
                        br: 0,
                        bl: 0
                    };
                    if (index === 0) { // First button - flat left top and bottom
                        currentRadius.bl = 0;
                        currentRadius.tl = 0;
                    }
                    if (index === totalButtons - 1) { // Last button - flat right top and bottom
                        currentRadius.br = 0;
                        currentRadius.tr = 0;
                    }

                    // Draw button background
                    let bgColor;
                    if (isDisabled) {
                        bgColor = '#d1d5db'; // gray-300 for disabled
                    } else if (isActive) {
                        bgColor = '#f97316'; // orange-500 for selected
                    } else {
                        bgColor = '#fef08a'; // yellow-200 for unselected
                    }
                    ctx.fillStyle = bgColor;
                    this._roundRectPath(ctx, x, y, width, height, currentRadius);
                    ctx.fill();

                    // Draw button border
                    ctx.strokeStyle = '#f97316'; // orange-500
                    ctx.lineWidth = (isActive && !isDisabled) ? activeBorderWidth : borderWidth;
                    this._roundRectPath(ctx, x, y, width, height, currentRadius);
                    ctx.stroke();

                    // Draw shadow (simplified simulation)
                    ctx.save();
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.05)';
                    ctx.shadowBlur = 4;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 2;
                    this._roundRectPath(ctx, x, y, width, height, currentRadius);
                    ctx.fill(); // Fill again to apply shadow
                    ctx.restore();

                    // Draw bottom border for active tab (on top of existing border)
                    if (isActive && !isDisabled) {
                        ctx.fillStyle = 'white';
                        ctx.fillRect(x, height - activeBorderWidth, width, activeBorderWidth);
                    }

                    // Draw icon (black)
                    ctx.font = '20px "Rodin", sans-serif'; // Larger font for icon
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = isDisabled ? '#808080' : 'black'; // Grey icon for disabled, black otherwise
                    ctx.fillText(button.icon, x + width / 2, height / 2);

                    // Draw right-pointing arrow in the gap
                    if (index < totalButtons - 1) { // Don't draw arrow after the last button
                        ctx.strokeStyle = 'white';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        // Position arrow in the middle of the gap
                        const arrowX = x + width + (buttonSpacing / 2);
                        const arrowY = height / 2;
                        ctx.moveTo(arrowX - 4, arrowY - 4);
                        ctx.lineTo(arrowX, arrowY);
                        ctx.lineTo(arrowX - 4, arrowY + 4);
                        ctx.stroke();
                    }

                    // Store button regions for click detection
                    this.app.hyperlinks.push({
                        rect: {
                            x: x,
                            y: y,
                            width: width,
                            height: height
                        },
                        id: button.id, // Store button ID for click handling
                        type: 'form-nav-button',
                        isDisabled: isDisabled // Store disabled state
                    });
                });
            }

            /**

            _drawFormContent() {
                const ctx = this.formCtx;

            /**
             * Draws the Rules section content. This now displays the hardcoded article content.
             * @param {CanvasRenderingContext2D} ctx - The canvas context for drawing.
             * @param {HTMLElement} formOverlay - The HTML overlay for dynamic elements.
             * @param {number} x - X position for content.
             * @param {number} y - Y position for content.
             * @param {number} width - Width of the content area.
             * @param {number} height - Height of the content area.
             */
            async _drawRulesSection(ctx, formOverlay, x, y, width, height) {
                // Create a scrollable wrapper for the article content within the form
                const scrollableRulesWrapper = this.createElement('div', 'scrollable-rules-wrapper');
                scrollableRulesWrapper.style.position = 'absolute';
                scrollableRulesWrapper.style.left = `${x}px`;
                scrollableRulesWrapper.style.top = `${y}px`;
                scrollableRulesWrapper.style.width = `${width}px`;
                scrollableRulesWrapper.style.height = `${height}px`;
                scrollableRulesWrapper.style.overflowY = 'auto'; // Enable scrolling for rules content
                scrollableRulesWrapper.style.scrollbarWidth = 'none'; // Hide Firefox scrollbar
                scrollableRulesWrapper.style.webkitOverflowScrolling = 'touch'; // Smooth scrolling on iOS

                // Hide Webkit scrollbar
                scrollableRulesWrapper.style.setProperty('-webkit-scrollbar', 'none', 'important');

                const rulesContentCanvas = this.createElement('canvas', 'rules-content-canvas');
                rulesContentCanvas.width = width;
                rulesContentCanvas.height = height; // Initial height, will be adjusted
                const rulesCtx = rulesContentCanvas.getContext('2d');
                rulesCtx.imageSmoothingEnabled = false;

                scrollableRulesWrapper.appendChild(rulesContentCanvas);
                formOverlay.appendChild(scrollableRulesWrapper);

                // Re-parse and draw the hardcoded article content into the rules canvas
                const contentBlocks = this.app._parseArticleContent(hardcodedArticle.content || "");
                await this.app.imageManager.loadImagesFromBlocks(contentBlocks);

                let totalMeasuredHeight = 0;
                const horizontalPadding = 0; // No extra padding here, already handled by x/y/width
                const verticalPadding = 0;
                const drawAreaWidth = width;

                for (const block of contentBlocks) {
                    // Pass `this.app` explicitly to `_drawFormattedBlock` if it's not already bound
                    totalMeasuredHeight += this.app._measureBlockHeight(rulesCtx, block, drawAreaWidth) + (this.app.cssVars.blockSpacing || 10);
                }

                rulesContentCanvas.height = Math.max(height, totalMeasuredHeight); // Adjust canvas height
                rulesContentCanvas.style.height = `${rulesContentCanvas.height}px`;

                rulesCtx.clearRect(0, 0, rulesContentCanvas.width, rulesContentCanvas.height);
                rulesCtx.fillStyle = '#FFF'; // White background for the rules content
                rulesCtx.fillRect(0, 0, rulesContentCanvas.width, rulesContentCanvas.height);

                let currentY = 0;
                rulesCtx.textBaseline = 'top';
                for (const block of contentBlocks) {
                    const blockHeight = this.app._drawFormattedBlock(rulesCtx, formOverlay, block, horizontalPadding, currentY, drawAreaWidth);
                    currentY += blockHeight + (this.app.cssVars.blockSpacing || 10);
                }

                // Add a custom scrollbar for the rules content
                const rulesScrollbar = new Scrollbar(scrollableRulesWrapper, this.app); // Pass 'this.app'
                formOverlay.appendChild(rulesScrollbar.element);
            }

            /**
             * Draws the color grid for emblem customization.
             */
            _drawColorGrid(ctx, x, y, width) {
                const colorButtonSize = 28;
                const gap = 4;
                const cols = 8;
                const rows = Math.ceil(this.colors.length / cols);

                let currentY = y;
                for (let r = 0; r < rows; r++) {
                    let currentX = x;
                    for (let c = 0; c < cols; c++) {
                        const index = r * cols + c;
                        if (index < this.colors.length) {
                            const color = this.colors[index];
                            const isSelected = (color === this.formData.emblemColor);

                            // Draw color square
                            ctx.fillStyle = color;
                            ctx.fillRect(currentX, currentY, colorButtonSize, colorButtonSize);

                            // Draw border
                            ctx.strokeStyle = isSelected ? '#3b82f6' : '#d1d5db'; // blue-500 for selected, gray-300 otherwise
                            ctx.lineWidth = isSelected ? 2 : 1;
                            ctx.strokeRect(currentX, currentY, colorButtonSize, colorButtonSize);

                            // Store click region for color selection
                            this.app.hyperlinks.push({
                                rect: {
                                    x: currentX,
                                    y: currentY,
                                    width: colorButtonSize,
                                    height: colorButtonSize
                                },
                                id: color,
                                type: 'color-button'
                            });
                        }
                        currentX += colorButtonSize + gap;
                    }
                    currentY += colorButtonSize + gap;
                }
            }

            /**
             * Handles clicks on the form canvas, specifically for form navigation and color buttons.
             * @param {MouseEvent} e - The click event.
             */
            handleFormCanvasClick(e) {
                const canvas = this.formCanvas;
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Check for form navigation button clicks
                const clickedNavButton = this.app.hyperlinks.find(link =>
                    link.type === 'form-nav-button' &&
                    x >= link.rect.x && x <= link.rect.x + link.rect.width &&
                    y >= link.rect.y && y <= link.rect.y + link.rect.height
                );

                if (clickedNavButton) {
                    if (clickedNavButton.isDisabled) {
                        // If button is disabled, show validation message and prevent navigation
                        this._validateFormTab(this.currentFormNavTab); // This will display the message
                        return;
                    }
                    // Validate current tab before switching
                    if (this._validateFormTab(this.currentFormNavTab)) {
                        this.currentFormNavTab = clickedNavButton.id;
                        this.formValidationMessage = ''; // Clear message on successful tab switch
                        this._drawFormContent();
                        this._drawFormNavBar(); // Redraw nav bar to update active state
                    }
                    return;
                }

                // Check for form sub-tab button clicks
                const clickedSubTabButton = this.app.hyperlinks.find(link =>
                    link.type === 'form-sub-tab-button' &&
                    x >= link.rect.x && x <= link.rect.x + link.rect.width &&
                    y >= link.rect.y && y <= link.rect.y + link.rect.height
                );

                if (clickedSubTabButton) {
                    if (this.currentFormNavTab === 'teamInfo') {
                        this.currentTeamInfoSubSection = clickedSubTabButton.id;
                    } else if (this.currentFormNavTab === 'emblems') {
                        this.currentEmblemSubSection = clickedSubTabButton.id;
                    }
                    this.formValidationMessage = '';
                    this._drawFormContent();
                    return;
                }

                // Check for color button clicks
                const clickedColorButton = this.app.hyperlinks.find(link =>
                    link.type === 'color-button' &&
                    x >= link.rect.x && x <= link.rect.x + link.rect.width &&
                    y >= link.rect.y && y <= link.rect.y + link.rect.height
                );

                if (clickedColorButton) {
                    this.formData.emblemColor = clickedColorButton.id;
                    this.formValidationMessage = '';
                    this._drawFormContent(); // Redraw to update selected color visual
                    return;
                }

                // Check for submit button click
                const clickedSubmitButton = this.app.hyperlinks.find(link =>
                    link.type === 'form-submit-button' &&
                    x >= link.rect.x && x <= link.rect.x + link.rect.width &&
                    y >= link.rect.y && y <= link.rect.y + link.rect.height
                );

                if (clickedSubmitButton) {
                    this._handleSubmitForm();
                    return;
                }

                // Handle clicks on CanvasInput elements to focus them
                for (const key in this.canvasInputs) {
                    const input = this.canvasInputs[key];
                    const inputRect = input.element.getBoundingClientRect();
                    const formOverlayRect = this.formOverlay.getBoundingClientRect();

                    // Adjust click coordinates relative to the CanvasInput's position within the formOverlay
                    const inputX = e.clientX - formOverlayRect.left;
                    const inputY = e.clientY - formOverlayRect.top;

                    if (inputX >= inputRect.left - formOverlayRect.left &&
                        inputX <= inputRect.right - formOverlayRect.left &&
                        inputY >= inputRect.top - formOverlayRect.top &&
                        inputY <= inputRect.bottom - formOverlayRect.top) {
                        input.element.focus();
                        return;
                    }
                }
            }


            /**
             * Draws sub-tab buttons for form sections.
             */
            _drawFormSubTabButtons(ctx, x, y, width, height, buttonsData, activeId, onClickCallback) {
                const buttonHeight = height / buttonsData.length - (buttonsData.length - 1); // Distribute height evenly
                const buttonSpacing = 1; // Small spacing between sub-tabs

                buttonsData.forEach((button, index) => {
                    const btnX = x;
                    const btnY = y + index * (buttonHeight + buttonSpacing);
                    const isActive = (button.id === activeId);

                    // Determine border radii (rounded only on the right side)
                    const radii = {
                        tl: 0,
                        tr: 6,
                        br: 6,
                        bl: 0
                    };

                    // Draw button background
                    ctx.fillStyle = isActive ? '#fcd34d' : '#fef08a'; // Active: yellow-400, Inactive: yellow-200
                    this._roundRectPath(ctx, btnX, btnY, width, buttonHeight, radii);
                    ctx.fill();

                    // Draw button border
                    ctx.strokeStyle = isActive ? '#f97316' : '#f97316'; // orange-500
                    ctx.lineWidth = isActive ? 2 : 1;
                    this._roundRectPath(ctx, btnX, btnY, width, buttonHeight, radii);
                    ctx.stroke();

                    // Draw right border (orange-500) for active sub-tab
                    if (isActive) {
                        ctx.strokeStyle = '#f97316';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(btnX + width - 1, btnY);
                        ctx.lineTo(btnX + width - 1, btnY + buttonHeight);
                        ctx.stroke();
                    }


                    // Draw icon (black)
                    ctx.font = '16px "Rodin", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = 'black';
                    ctx.fillText(button.icon, btnX + width / 2, btnY + buttonHeight / 2);

                    // Store button regions for click detection
                    this.app.hyperlinks.push({
                        rect: {
                            x: btnX,
                            y: btnY,
                            width: width,
                            height: buttonHeight
                        },
                        id: button.id,
                        type: 'form-sub-tab-button',
                        onClick: onClickCallback

                });

            _validateFormTab(tabId, silent = false) {
