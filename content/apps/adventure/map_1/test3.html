            /**
             * Draws a rounded rectangle path on the given canvas context.
             * @param {CanvasRenderingContext2D} ctx - The canvas rendering context.
             * @param {number} x - The X coordinate of the top-left corner.
             * @param {number} y - The Y coordinate of the top-left corner.
             * @param {number} width - The width of the rectangle.
             * @param {number} height - The height of the rectangle.
             * @param {number|object} radius - The border radius. Can be a single number or an object {tl, tr, br, bl}.
             */
            _roundRectPath(ctx, x, y, width, height, radius) {
                if (typeof radius === 'number') {
                    radius = {
                        tl: radius,
                        tr: radius,
                        br: radius,
                        bl: radius
                    };
                } else {
                    const defaultRadius = 0;
                    radius = radius || {};
                    radius.tl = radius.tl !== undefined ? radius.tl : defaultRadius;
                    radius.tr = radius.tr !== undefined ? radius.tr : defaultRadius;
                    radius.br = radius.br !== undefined ? radius.br : defaultRadius;
                    radius.bl = radius.bl !== undefined ? radius.bl : defaultRadius;
                }

                ctx.beginPath();
                ctx.moveTo(x + radius.tl, y);
                ctx.lineTo(x + width - radius.tr, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius.tr);
                ctx.lineTo(x + width, y + height - radius.br);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius.br, y + height);
                ctx.lineTo(x + radius.bl, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius.bl);
                ctx.lineTo(x, y + radius.tl);
                ctx.quadraticCurveTo(x, y, x + radius.tl, y);
                ctx.closePath();
            }

            /**
             * Loads an image from a data URL and returns a Promise that resolves with the Image object.
             * Used for loading procedural canvas backgrounds as images.
             * @param {string} dataUrl - The data URL of the image.
             * @returns {Promise<HTMLImageElement|null>} A promise that resolves with the Image object or null if loading fails.
             */
            async _loadPaperPattern(dataUrl) {
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = dataUrl;
                });
            }
        }

        /**
         * Implements a custom scrollbar for a given scrollable container.
         * Renders the scrollbar visually on a canvas and handles drag interactions.
         */
        class Scrollbar {
            /**
             * @param {HTMLElement} scrollableContainer - The DOM element to attach the scrollbar to.
             * @param {AnnouncementsApp} appInstance - The main app instance for sound playback.
             */
            constructor(scrollableContainer, appInstance) {
                this.container = scrollableContainer;
                this.app = appInstance;
                this.element = document.createElement('canvas');
                this.element.className = 'custom-scrollbar';
                this.ctx = this.element.getContext('2d');
                this.ctx.imageSmoothingEnabled = false; // For crisp lines
                this.isDragging = false;
                this.startY = 0;
                this.startScrollTop = 0;
                this.lastScrollTop = this.container.scrollTop; // Track last scroll position for sound
                this.scrollSoundTimeout = null; // Debounce for scroll sound

                // Mouse event listeners for desktop dragging
                this.element.addEventListener('mousedown', this.onThumbMouseDown.bind(this));
                document.addEventListener('mousemove', this.onThumbMouseMove.bind(this));
                document.addEventListener('mouseup', this.onThumbMouseUp.bind(this));

                // Touch event listeners for mobile dragging
                this.element.addEventListener('touchstart', this.onThumbTouchStart.bind(this), {
                    passive: false
                });
                document.addEventListener('touchmove', this.onThumbTouchMove.bind(this), {
                    passive: false
                });
                document.addEventListener('touchend', this.onThumbTouchEnd.bind(this));

                // Listen for container's scroll events to update scrollbar position
                this.container.addEventListener('scroll', () => this.update());
                // Listen for window resize to adjust scrollbar dimensions
                window.addEventListener('resize', () => this.update());

                // Observe changes in the container's children or attributes to update scrollbar
                const observer = new MutationObserver(() => this.update());
                observer.observe(this.container, {
                    childList: true,
                    subtree: true,
                    characterData: true,
                    attributes: true
                });

                this.update(); // Initial update to draw the scrollbar
            }

            /**
             * Handles mouse down event on the scrollbar thumb.
             * Initiates dragging.
             * @param {MouseEvent} e - The mouse event.
             */
            onThumbMouseDown(e) {
                this.isDragging = true;
                this.startY = e.clientY;
                this.startScrollTop = this.container.scrollTop;
                this.element.style.cursor = 'grabbing';
            }

            /**
             * Handles mouse move event while dragging the scrollbar thumb.
             * Updates the container's scroll position.
             * @param {MouseEvent} e - The mouse event.
             */
            onThumbMouseMove(e) {
                if (!this.isDragging) return;
                e.preventDefault(); // Prevent default browser scrolling
                const dy = e.clientY - this.startY;
                const scrollRatio = this.container.scrollHeight / this.container.clientHeight;
                this.container.scrollTop = this.startScrollTop + (dy * scrollRatio);
            }

            /**
             * Handles mouse up event, ending the scrollbar dragging.
             */
            onThumbMouseUp() {
                this.isDragging = false;
                this.element.style.cursor = 'grab';
            }

            /**
             * Handles touch start event on the scrollbar thumb.
             * Initiates dragging for touch devices.
             * @param {TouchEvent} e - The touch event.
             */
            onThumbTouchStart(e) {
                this.isDragging = true;
                this.startY = e.touches[0].clientY;
                this.startScrollTop = this.container.scrollTop;
                this.element.style.cursor = 'grabbing';
                e.preventDefault(); // Prevent default browser scrolling
            }

            /**
             * Handles touch move event while dragging the scrollbar thumb on touch devices.
             * Updates the container's scroll position.
             * @param {TouchEvent} e - The touch event.
             */
            onThumbTouchMove(e) {
                if (!this.isDragging) return;
                e.preventDefault(); // Prevent default browser scrolling
                const dy = e.touches[0].clientY - this.startY;
                const scrollRatio = this.container.scrollHeight / this.container.clientHeight;
                this.container.scrollTop = this.startScrollTop + (dy * scrollRatio);
            }

            /**
             * Handles touch end event, ending the scrollbar dragging for touch devices.
             */
            onThumbTouchEnd() {
                this.isDragging = false;
                this.element.style.cursor = 'grab';
            }

            /**
             * Draws the scrollbar track and thumb on the canvas.
             * @param {number} viewHeight - The visible height of the scrollable area.
             * @param {number} contentHeight - The total scrollable height of the content.
             * @param {number} thumbHeight - The calculated height of the scrollbar thumb.
             * @param {number} thumbY - The Y position of the scrollbar thumb.
             */
            drawScrollbar(viewHeight, contentHeight, thumbHeight, thumbY) {
                const canvas = this.element;
                const ctx = this.ctx;
                const trackWidth = 8; // Width of the scrollbar track
                const thumbWidth = 6; // Width of the scrollbar thumb
                const borderRadius = 3; // Border radius for the thumb

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw scrollbar track
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(canvas.width - trackWidth, 0, trackWidth, canvas.height);

                // Draw scrollbar thumb
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                const thumbX = canvas.width - trackWidth + (trackWidth - thumbWidth) / 2;

                // Draw rounded rectangle for the thumb using arcTo for smooth corners
                ctx.moveTo(thumbX + borderRadius, thumbY);
                ctx.lineTo(thumbX + thumbWidth - borderRadius, thumbY);
                ctx.arcTo(thumbX + thumbWidth, thumbY, thumbX + thumbWidth, thumbY + borderRadius, borderRadius);
                ctx.lineTo(thumbX + thumbWidth, thumbY + thumbHeight - borderRadius);
                ctx.arcTo(thumbX + thumbWidth, thumbY + thumbHeight, thumbX + thumbWidth - borderRadius, thumbY + thumbHeight, borderRadius);
                ctx.lineTo(thumbX + borderRadius, thumbY + thumbHeight);
                ctx.arcTo(thumbX, thumbY + thumbHeight, thumbX, thumbY + thumbHeight - borderRadius, borderRadius);
                ctx.lineTo(thumbX, thumbY + borderRadius);
                ctx.arcTo(thumbX, thumbY, thumbX + borderRadius, thumbY, borderRadius);
                ctx.closePath();
                ctx.fill();
            }

            /**
             * Updates the scrollbar's position and visibility based on the container's scroll state.
             * Plays a scroll sound with debouncing.
             */
            update() {
                requestAnimationFrame(() => {
                    const viewHeight = this.container.clientHeight;
                    const contentHeight = this.container.scrollHeight;
                    this.element.height = viewHeight;
                    this.element.width = 14; // Fixed width for the scrollbar canvas
                    // Hide scrollbar if content is not scrollable
                    this.element.style.visibility = contentHeight > viewHeight ? 'visible' : 'hidden';

                    // Position the scrollbar canvas correctly within its parent
                    this.element.style.position = 'absolute';
                    this.element.style.top = '0px';
                    this.element.style.bottom = '0px';
                    this.element.style.right = '0px';

                    // Calculate thumb height and position
                    const thumbHeight = Math.max(20, viewHeight * (viewHeight / contentHeight));
                    const scrollPercentage = contentHeight > viewHeight ? this.container.scrollTop / (contentHeight - viewHeight) : 0;
                    const thumbY = scrollPercentage * (viewHeight - thumbHeight);

                    // Play scroll sound if scrolling and not currently debounced
                    const newScrollTop = this.container.scrollTop;
                    if (this.app && this.app.sounds.scroll && this.lastScrollTop !== undefined && newScrollTop !== this.lastScrollTop) {
                        if (!this.scrollSoundTimeout) {
                            // this.app.sounds.scroll.play(); // Commented out as the sound asset is missing
                            this.scrollSoundTimeout = setTimeout(() => {
                                this.scrollSoundTimeout = null;
                            }, 100); // Debounce for 100ms
                        }
                    }
                    this.lastScrollTop = newScrollTop;

                    this.drawScrollbar(viewHeight, contentHeight, thumbHeight, thumbY);
                });
            }
        }

        /**
         * Helper class to measure text width and height on a temporary canvas context.
         * Uses a singleton pattern to avoid creating multiple canvases.
         */
        class TextCanvasMeasurer {
            constructor() {
                if (!TextCanvasMeasurer.instance) {
                    this._canvas = document.createElement('canvas');
                    this._ctx = this._canvas.getContext('2d');
                    this._ctx.imageSmoothingEnabled = false; // Disable anti-aliasing for accurate pixel measurements
                    TextCanvasMeasurer.instance = this;
                }
                return TextCanvasMeasurer.instance;
            }

            /**
             * Measures the width of a given text with a specific font.
             * @param {string} text - The text to measure.
             * @param {string} font - The font style string (e.g., '14px "Rodin", sans-serif').
             * @returns {TextMetrics} The TextMetrics object.
             */
            measureText(text, font) {
                this._ctx.font = font;
                return this._ctx.measureText(text);
            }

            /**
             * Estimates the total height required to wrap text within a given maximum width.
             * @param {string} text - The text to measure.
             * @param {string} font - The font style string.
             * @param {number} maxWidth - The maximum width for text wrapping. Use Infinity for no wrapping.
             * @param {number} [lineSpacingFactor=1.0] - Multiplier for line height.
             * @returns {number} The estimated total height in pixels.
             */
            estimateWrappedTextHeight(text, font, maxWidth, lineSpacingFactor = 1.0) {
                this._ctx.font = font;
                const tempMetrics = this._ctx.measureText('M'); // Measure a single character to get approximate line height
                const actualLineHeight = (tempMetrics.actualBoundingBoxAscent || 0) + (tempMetrics.actualBoundingBoxDescent || 0);

                if (maxWidth === Infinity) {
                    return actualLineHeight * lineSpacingFactor;
                }

                const words = text.split(' ');
                let line = '';
                let totalHeight = 0;
                for (let n = 0; n < words.length; n++) {
                    let testLine = line + (n > 0 ? ' ' : '') + words[n];
                    let metrics = this._ctx.measureText(testLine);
                    let testWidth = metrics.width;

                    if (testWidth > maxWidth && line.length > 0) {
                        totalHeight += actualLineHeight * lineSpacingFactor;
                        line = words[n];
                    } else {
                        line = testLine;
                    }
                }
                totalHeight += actualLineHeight * lineSpacingFactor; // Add height for the last line
                return totalHeight;
            }
        }

        /**
         * Manages loading and caching of images to prevent redundant fetches.
         */
        class ImageManager {
            constructor() {
                this.cache = new Map(); // Cache to store loaded images
            }

            /**
             * Loads an image and caches it. Returns a Promise that resolves with the Image object.
             * @param {string} url - The URL of the image.
             * @returns {Promise<HTMLImageElement|null>} A promise that resolves with the Image object or null if loading fails.
             */
            loadImage(url) {
                if (this.cache.has(url)) {
                    return Promise.resolve(this.cache.get(url));
                }
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous"; // Required for loading images from other origins onto canvas
                    img.onload = () => {
                        this.cache.set(url, img);
                        resolve(img);
                    };
                    img.onerror = () => {
                        console.error(`Failed to load image: ${url}`);
                        this.cache.set(url, null); // Cache null to avoid retrying failed images
                        resolve(null);
                    };
                    img.src = url;
                });
            }

            /**
             * Retrieves a cached image.
             * @param {string} url - The URL of the image.
             * @returns {HTMLImageElement|null} The cached Image object or null if not found.
             */
            getImage(url) {
                return this.cache.get(url) || null;
            }

            /**
             * Loads all images referenced within a list of content blocks.
             * @param {Array<object>} blocks - An array of parsed content blocks.
             * @returns {Promise<void>} A promise that resolves when all images are attempted to be loaded.
             */
            async loadImagesFromBlocks(blocks) {
                const mediaUrls = new Set();
                blocks.forEach(block => {
                    if (block.type === 'image') {
                        mediaUrls.add(block.url);
                    } else if (block.type === 'embed' && block.service === 'youtube') {
                        // Use YouTube thumbnail for embeds
                        mediaUrls.add(`https://img.youtube.com/vi/${block.id}/0.jpg`);
                    }
                });
                const promises = Array.from(mediaUrls).map(url => this.loadImage(url));
                await Promise.all(promises); // Wait for all images to attempt loading
            }
        }

            /**
             * Translates a given key using the loaded translation data.
             * Supports nested keys (e.g., 'footer.exit') and replacements.
             * @param {string} key - The translation key.
             * @param {object} [replacements={}] - An object of placeholders and their values.
             * @returns {string} The translated string.
             */
            t(key, replacements = {}) {
                const keys = key.split('.');
                let value = this.translations;
                for (const k of keys) {
                    value = value ? value[k] : undefined;
                }
                let str = value || key; // Fallback to key if translation not found
                for (const placeholder in replacements) {
                    str = str.replace(`{${placeholder}}`, replacements[placeholder]);
                }
                return str;
            }

            /**
             * Applies the current audio settings (volume, mute, background music playback)
             * to the Howler.js sound instances.
             */
            _applyAudioSettings() {
                Howler.mute(this.audioSettings.mute);
                const sfxVolume = 1.0 * this.audioSettings.volumeMultiplier.sfx;
                const musicVolume = 0.2 * this.audioSettings.volumeMultiplier.music;

                // Update volume for each sound if it exists
                if (this.sounds.hover) this.sounds.hover.volume(1.0 * sfxVolume);
                if (this.sounds.shareConfirm) this.sounds.shareConfirm.volume(0.8 * sfxVolume);
                if (this.sounds.appLaunch) this.sounds.appLaunch.volume(0.7 * sfxVolume);
                if (this.sounds.appExit) this.sounds.appExit.volume(0.7 * sfxVolume);
                if (this.sounds.typing) this.sounds.typing.volume(0.5 * sfxVolume);
                if (this.sounds.inputFocus) this.sounds.inputFocus.volume(0.7 * sfxVolume);
                if (this.sounds.inputBlur) this.sounds.inputBlur.volume(0.7 * sfxVolume);


                // Manage background music playback
                if (this.audioSettings.backgroundAudio) {
                    Howler.autoSuspend = false; // Prevent audio from suspending when tab is in background
                    if (this.sounds.music && !this.sounds.music.playing()) {
                        this.sounds.music.play();
                    }
                    if (this.sounds.music) this.sounds.music.volume(musicVolume);
                } else {
                    Howler.autoSuspend = true; // Allow audio to suspend
                    if (this.sounds.music && this.sounds.music.playing()) {
                        this.sounds.music.pause();
                    }
                }
            }

            /**
             * Parses a text string for inline formatting (bold, italic, links, images, etc.)
             * and returns an array of token objects, each with text content and style properties.
             * @param {string} text - The input text string.
             * @returns {Array<object>} An array of parsed tokens.
             */
            _parseInlineFormatting(text) {
                const tokens = [];
                // Regex to capture various inline formatting patterns
                const regex = /(?<image>!\[[^\]]*?\]\([^)]+?\))|(?<link>\[[^\]]*?\]\([^)]+?\)|\<a\s+href="[^"]+"\>[^<]+\<\/a\>)|(?<youtube>@\[youtube\]\([^)]+?\))|(?<bold>\*\*.*?\*\*)|(?<italic>\*.*?\*)|(?<underline>__.*?__)|(?<strike>~~.*?~~)|(?<sup>\^.*?\^)|(?<sub>~.*?~)|(?<color>\{color:(#[0-9a-fA-F]{6}|[a-zA-Z]+)\|.*?\})/g;

                let lastIndex = 0;
                let match;
                while ((match = regex.exec(text)) !== null) {
                    // Add plain text before the matched token
                    if (match.index > lastIndex) {
                        tokens.push({
                            text: text.substring(lastIndex, match.index),
                            style: {}
                        });
                    }

                    const groups = match.groups;
                    let token;

                    // Determine token type and extract content/style
                    if (groups.bold) token = {
                        text: groups.bold.slice(2, -2),
                        style: {
                            bold: true
                        }
                    };
                    else if (groups.italic) token = {
                        text: groups.italic.slice(1, -1),
                        style: {
                            italic: true
                        }
                    };
                    else if (groups.underline) token = {
                        text: groups.underline.slice(2, -2),
                        style: {
                            underline: true
                        }
                    };
                    else if (groups.strike) token = {
                        text: groups.strike.slice(2, -2),
                        style: {
                            strikethrough: true
                        }
                    };
                    else if (groups.sup) token = {
                        text: groups.sup.slice(1, -1),
                        style: {
                            script: 'super'
                        }
                    };
                    else if (groups.sub) token = {
                        text: groups.sub.slice(1, -1),
                        style: {
                            script: 'sub'
                        }
                    };
                    else if (groups.color) {
                        const colorContent = groups.color.slice(7, -1); // Remove '{color:' and '}'
                        const separatorIndex = colorContent.indexOf('|');
                        if (separatorIndex !== -1) {
                            const color = colorContent.substring(0, separatorIndex);
                            const content = colorContent.substring(separatorIndex + 1);
                            token = {
                                text: content,
                                style: {
                                    color
                                }
                            };
                        }
                    } else if (groups.youtube) {
                        const [, videoId] = /@\[youtube\]\((.*?)\)/.exec(groups.youtube) || [];
                        if (videoId) token = {
                            text: '',
                            style: {
                                youtube: videoId
                            }
                        };
                    } else if (groups.image) {
                        const [, alt, url] = /!\[(.*?)\]\((.*?)\)/.exec(groups.image) || [];
                        if (url) token = {
                            text: '',
                            style: {
                                image: url,
                                alt
                            }
                        };
                    } else if (groups.link) {
                        const [, text, url] = /\[(.*?)\]\((.*?)\)/.exec(groups.link) || [];
                        if (text) token = {
                            text,
                            style: {
                                link: true,
                                url
                            }
                        };
                    }
                    if (token) tokens.push(token);
                    lastIndex = regex.lastIndex; // Update last index for next iteration
                }
                // Add any remaining plain text after the last matched token
                if (lastIndex < text.length) {
                    tokens.push({
                        text: text.substring(lastIndex),
                        style: {}
                    });
                }
                return tokens;
            }

            /**
             * Renders inline formatted text onto a canvas context.
             * This function handles text wrapping, styles (bold, italic, color, etc.),
             * and also tracks clickable link areas.
             * @param {CanvasRenderingContext2D} ctx - The canvas rendering context.
             * @param {Array<object>} tokens - An array of parsed text tokens.
             * @param {number} x - The starting X coordinate for rendering.
             * @param {number} y - The starting Y coordinate for rendering.
             * @param {string} baseFont - The base font style string.
             * @param {string} baseColor - The base text color.
             * @param {number} maxWidth - The maximum width for text wrapping.
             * @param {number} lineSpacingFactor - Multiplier for line height.
             * @param {boolean} [measureOnly=false] - If true, only measures height without drawing.
             * @returns {{height: number, links: Array<object>}} The total height used and an array of link rectangles.
             */
            _renderInlineFormattedText(ctx, tokens, x, y, baseFont, baseColor, maxWidth, lineSpacingFactor, measureOnly = false) {
                ctx.save();
                let currentX = x;
                let currentY = y;
                const baseFontSize = parseInt(baseFont);
                const fontFamily = baseFont.substring(baseFont.indexOf('px') + 3).trim();
                const measurer = new TextCanvasMeasurer();
                const fontMetrics = measurer.measureText("M", baseFont);
                const baseLineHeight = (fontMetrics.actualBoundingBoxAscent || baseFontSize) + (fontMetrics.actualBoundingBoxDescent || 2);
                const lineHeight = baseLineHeight * lineSpacingFactor;
                let totalHeight = (tokens.length > 0 && tokens.some(t => t.text || t.style.image || t.style.youtube)) ? lineHeight : 0;
                const links = []; // Array to store clickable link regions
                ctx.textBaseline = 'top';

                // Helper function to apply font and color styles based on token properties
                const applyStyle = (style) => {
                    let fontStyle = style.italic ? 'italic ' : '';
                    fontStyle += style.bold ? 'bold ' : '';
                    let fontSize = baseFontSize;
                    let yOffset = 0; // Vertical offset for superscript/subscript

                    if (style.script) {
                        fontSize = Math.floor(baseFontSize * 0.8); // Smaller font for scripts
                        yOffset = style.script === 'super' ? -fontSize * 0.4 : (baseFontSize - fontSize) * 0.7; // Adjust Y offset
                    }
                    ctx.font = `${fontStyle}${fontSize}px ${fontFamily}`;
                    ctx.fillStyle = style.color || (style.link ? this.cssVars['--ds-accent-blue'] : baseColor); // Apply custom color or link color
                    return yOffset;
                };

                for (const token of tokens) {
                    const mediaUrl = token.style.image || (token.style.youtube ? `https://img.youtube.com/vi/${token.style.youtube}/0.jpg` : null);

                    // Handle image or YouTube embed tokens
                    if (mediaUrl) {
                        const img = this.imageManager.getImage(mediaUrl);
                        if (img && img.complete) {
                            const aspectRatio = img.height / img.width;
                            const drawWidth = Math.min(img.width, maxWidth);
                            const drawHeight = drawWidth * aspectRatio;

                            // If image doesn't fit on current line, move to next line
                            if (currentX > x) {
                                currentX = x;
                                currentY += lineHeight;
                                totalHeight += lineHeight;
                            }

                            if (!measureOnly) {
                                ctx.drawImage(img, currentX, currentY, drawWidth, drawHeight);
                                // Draw play button overlay for YouTube embeds
                                if (token.style.youtube) {
                                    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                                    ctx.beginPath();
                                    ctx.arc(currentX + drawWidth / 2, currentY + drawHeight / 2, 30, 0, Math.PI * 2);
                                    ctx.fill();
                                    ctx.fillStyle = 'white';
                                    ctx.beginPath();
                                    ctx.moveTo(currentX + drawWidth / 2 - 10, currentY + drawHeight / 2 - 15);
                                    ctx.lineTo(currentX + drawWidth / 2 + 15, currentY + drawHeight / 2);
                                    ctx.lineTo(currentX + drawWidth / 2 - 10, currentY + drawHeight / 2 + 15);
                                    ctx.closePath();
                                    ctx.fill();
                                    // Store link information for click detection
                                    links.push({
                                        rect: {
                                            x: currentX,
                                            y: currentY,
                                            width: drawWidth,
                                            height: drawHeight
                                        },
                                        url: `youtube:${token.style.youtube}`
                                    });
                                } else if (token.style.image) {
                                    // Store image link information
                                    links.push({
                                        rect: {
                                            x: currentX,
                                            y: currentY,
                                            width: drawWidth,
                                            height: drawHeight
                                        },
                                        url: token.style.image
                                    });
                                }
                            }
                            currentY += drawHeight; // Advance Y for next content
                            totalHeight += drawHeight - lineHeight; // Adjust total height
                        }
                        continue; // Skip to next token
                    }

                    // Handle text tokens
                    const words = token.text.split(/(\s+)/); // Split by spaces, keeping spaces as tokens
                    for (const word of words) {
                        if (word === '') continue;
                        const yOffset = applyStyle(token.style); // Apply styles and get Y offset for scripts
                        const wordWidth = ctx.measureText(word).width;

                        // Check for text wrapping
                        if (currentX > x && currentX + wordWidth > x + maxWidth && word.trim() !== '') {
                            currentX = x; // Move to next line
                            currentY += lineHeight;
                            totalHeight += lineHeight;
                        }

                        if (!measureOnly) {
                            // Draw text
                            if (token.style.bold) {
                                // Simulate bold by stroking text slightly
                                ctx.lineWidth = 1;
                                ctx.strokeStyle = ctx.fillStyle;
                                ctx.strokeText(word, currentX, currentY + yOffset);
                            }
                            ctx.fillText(word, currentX, currentY + yOffset);

                            const textY = currentY + yOffset;
                            const wordTrimmedWidth = ctx.measureText(word.trim()).width;

                            // Draw underlines or strikethroughs
                            if (token.style.underline || token.style.link) {
                                ctx.fillRect(currentX, textY + baseFontSize * 1.1, wordTrimmedWidth, 1);
                            }
                            if (token.style.strikethrough) {
                                ctx.fillRect(currentX, textY + baseFontSize * 0.6, wordTrimmedWidth, 1);
                            }
                            // Store link information for clickable areas
                            if (token.style.link) {
                                links.push({
                                    rect: {
                                        x: currentX,
                                        y: currentY,
                                        width: wordTrimmedWidth,
                                        height: lineHeight
                                    },
                                    url: token.style.url
                                });
                            }
                        }
                        currentX += wordWidth; // Advance X for next word
                    }
                }
                ctx.restore();
                return {
                    height: totalHeight,
                    links
                };
            }

            /**
             * Estimates the height of a given text block with specific font and width constraints.
             * This is a wrapper around TextCanvasMeasurer.
             * @param {string} font - The font style string.
             * @param {string} [text=''] - The text content.
             * @param {number} [maxWidth=Infinity] - The maximum width for text wrapping.
             * @param {number} [lineSpacingFactorToUse=this.lineSpacingFactor] - Multiplier for line height.
             * @returns {number} The estimated height.
             */
            _estimateTextHeight(font, text = '', maxWidth = Infinity, lineSpacingFactorToUse = this.lineSpacingFactor) {
                const measurer = new TextCanvasMeasurer();
                return measurer.estimateWrappedTextHeight(text, font, maxWidth, lineSpacingFactorToUse);
            }

            /**
             * Draws text on a canvas context, handling line wrapping.
             * @param {CanvasRenderingContext2D} ctx - The canvas rendering context.
             * @param {string} text - The text to draw.
             * @param {number} x - The X coordinate.
             * @param {number} y - The Y coordinate.
             * @param {string} font - The font style string.
             * @param {string} color - The text color.
             * @param {CanvasTextAlign} [textAlign='left'] - Text alignment.
             * @param {CanvasTextBaseline} [textBaseline='alphabetic'] - Text baseline.
             * @param {number} [maxWidth=Infinity] - Maximum width for text wrapping.
             * @param {number} [lineSpacingFactorToUse=this.lineSpacingFactor] - Multiplier for line height.
             * @returns {number} The total height used to draw the text.
             */
            _drawTextOnCanvas(ctx, text, x, y, font, color, textAlign = 'left', textBaseline = 'alphabetic', maxWidth = Infinity, lineSpacingFactorToUse = this.lineSpacingFactor) {
                if (!ctx) {
                    console.error("Canvas rendering context is null. Cannot draw text.");
                    return 0;
                }
                ctx.save();
                ctx.font = font;
                ctx.fillStyle = color !== undefined && color !== null ? color : 'black';
                ctx.textAlign = textAlign;
                ctx.textBaseline = textBaseline;

                // Create a temporary canvas context to measure text metrics accurately
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.font = font;
                const tempMetrics = tempCtx.measureText('M');
                const actualLineHeight = (tempMetrics.actualBoundingBoxAscent || 0) + (tempMetrics.actualBoundingBoxDescent || 0);

                if (maxWidth === Infinity) {
                    // No wrapping needed
                    ctx.fillText(text, x, y);
                    ctx.restore();
                    return actualLineHeight * lineSpacingFactorToUse;
                } else {
                    // Text wrapping logic
                    const words = text.split(' ');
                    let line = '';
                    let currentY = y;
                    let totalHeightUsed = 0;

                    for (let n = 0; n < words.length; n++) {
                        let testLine = line + (n > 0 ? ' ' : '') + words[n];
                        let metrics = ctx.measureText(testLine);
                        let testWidth = metrics.width;

                        if (testWidth > maxWidth && line.length > 0) {
                            // If adding the next word exceeds max width, draw current line and start new
                            ctx.fillText(line, x, currentY);
                            totalHeightUsed += actualLineHeight * lineSpacingFactorToUse;
                            currentY += actualLineHeight * lineSpacingFactorToUse;
                            line = words[n];
                        } else {
                            line = testLine;
                        }
                    }
                    // Draw the last line
                    ctx.fillText(line, x, currentY);
                    totalHeightUsed += actualLineHeight * lineSpacingFactorToUse;
                    ctx.restore();
                    return totalHeightUsed;
                }
            }

            /**
             * Displays an app-wide error message on a dedicated canvas.
             * Plays an error sound.
             * @param {string} message - The message to display.
             */
            _showAppError(message) {
                const ctx = this.errorCtx;
                const canvas = this.errorCanvas;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw error message background with shadow
                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 4;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.beginPath();
                ctx.roundRect(0, 0, canvas.width, canvas.height, 8);
                ctx.fill();
                ctx.restore();

                this._drawTextOnCanvas(ctx, message, canvas.width / 2, canvas.height / 2, '16px "Rodin", sans-serif', 'red', 'center', 'middle');
                this.errorCanvas.style.display = 'block'; // Show the error canvas
                clearTimeout(this.errorTimer);
                // Hide the error message after 5 seconds
                this.errorTimer = setTimeout(() => {
                    this.errorCanvas.style.display = 'none';
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }, 5000);
            }

          -webkit-font-smoothing: none; /* Disable font smoothing for crisp pixel art look */
        }

        /* Main app container */
        .ds-container {
          width: 400px; /* Fixed width for the app container */
          height: 480px; /* Fixed height for the app container */
          background: black;
          user-select: none;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          align-items: center;
          position: relative;
          box-shadow: 0 10px 30px rgba(0,0,0,0.3); /* Subtle shadow for depth */
        }

        /* Top screen for article image */
        .top-screen {
            width: 400px;
            height: 240px;
            background: transparent;
            flex-shrink: 0; /* Prevent shrinking */
            position: relative;
            overflow: hidden;
        }

        /* Article image styling */
        .article-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cover the area without distortion */
            transition: opacity 0.4s ease-in-out; /* Smooth fade-in */
        }

        /* Bottom screen for article content */
        .bottom-screen {
          width: 320px; /* Fixed width for the content area */
          height: 240px;
          background: #F0EAD6; /* Solid color background */
          position: relative;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding-top: 8px; /* Padding at the top */
          box-sizing: border-box;
        }
        
        /* General view styling for transitions */
        .view {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateY(15px); /* Initial offset for slide-in effect */
            pointer-events: none; /* Disable interaction when not active */
        }

        .view.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0); /* Slide into view */
            pointer-events: auto; /* Enable interaction when active */
        }

        /* Specific styling for the article view */
        .article-view {
            background: #F5F5DC; /* Solid color background */
        }

        /* Contest Form View */
        .contest-form-view {
            background: #F5F5DC; /* Solid color background */
            position: relative; /* For absolute positioning of overlaid HTML elements */
        }

        .form-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Below HTML overlay */
        }

        .form-html-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Default to none, enable for inputs */
            z-index: 10; /* Above canvas */
        }

        .form-html-overlay > .canvas-input-wrapper {
            pointer-events: auto; /* Enable interaction for canvas inputs */
            font-family: 'Rodin', sans-serif;
            box-sizing: border-box; /* Include padding and border in element's total width/height */
            /* Tailwind classes for canvas input */
            padding: 4px; /* p-1 */
            border: 1px solid #d1d5db; /* border-gray-300 */
            border-radius: 4px; /* rounded-md */
            font-size: 12px; /* text-xs */
            outline: none; /* focus:outline-none */
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); /* shadow-sm */
            /* focus:ring-1 focus:ring-orange-400 handled by canvas drawing */
        }

        .form-html-overlay > input[type="file"] {
            pointer-events: auto; /* Enable interaction for file input */
            font-family: 'Rodin', sans-serif;
            box-sizing: border-box;
            /* Tailwind classes for file input */
            padding: 4px; /* p-1 */
            border: 1px solid #d1d5db; /* border-gray-300 */
            border-radius: 4px; /* rounded-md */
            font-size: 12px; /* text-xs */
            outline: none; /* focus:outline-none */
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); /* shadow-sm */
        }

        /* Article header content container */
        .article-header-content {
            padding: 10px 0;
            flex-shrink: 0;
            width: 320px;
            height: 90px;
            box-sizing: border-box;
            position: relative; /* Needed for absolute positioning of header background canvas */
            overflow: hidden; /* Hide overflow from canvas drawing */
        }
        /* Header background canvas positioned behind content */
        .article-header-content canvas.header-background-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Place behind other content */
        }

        /* Wrapper for scrollable article content and scrollbar */
        .article-body-wrapper {
            flex-grow: 1; /* Allows it to take available vertical space */
            display: flex; /* Use flexbox to lay out content and scrollbar side-by-side */
            position: relative; /* Needed for absolute positioning of scrollbar */
            overflow: hidden; /* Hide overflow to manage scrolling with custom scrollbar */
            width: 300px; /* Adjusted width to fit 280px content + 14px scrollbar + 6px gap */
            margin: 0 auto; /* Center the body wrapper */
        }

        /* Container for the article content canvas, enabling custom scrolling */
        .scrollable-canvas-wrapper {
            flex-grow: 1;
            overflow-y: auto; /* Enable native scrolling, which our custom scrollbar will track */
            scrollbar-width: none; /* Hide Firefox scrollbar */
            height: 110px; /* Reduced height to make room for header and footer */
            position: relative;
            width: 280px; /* Set explicit width for content to align with scrollbar */
        }
        /* Hide Webkit scrollbar */
        .scrollable-canvas-wrapper::-webkit-scrollbar {
            display: none;
        }

        /* Styling for the article content canvas */
        .article-content-canvas {
            display: block;
            height: auto; /* Height will be set by JS based on content */
            width: 280px; /* Set explicit width for content */
            margin: 0 auto;
            cursor: pointer; /* Indicate clickable areas */
        }

        /* Overlay for HTML elements (like iframes) within the article content */
        .article-html-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* By default, clicks pass through to canvas */
            z-index: 10;
        }
        /* Make iframes interactive */
        .article-html-overlay > iframe {
            pointer-events: auto; /* Enable interaction for iframes */
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* Article title and share button wrapper */
        .article-title-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 10px;
        }

        /* Article title canvas */
        .article-title-h1 {
            display: block;
            flex-grow: 1;
            line-height: 0; /* Important for canvas text rendering */
            width: 256px; /* Fixed width for title text */
        }

        /* Article meta information canvas */
        .article-meta-canvas {
            display: block;
            margin: 0 10px;
            width: 290px;
            height: 20px;
        }

        /* App-wide error display */
        .app-error-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 25px;
            z-index: 1000;
            font-family: "Rodin", sans-serif;
            font-size: 16px;
            text-align: center;
            display: none; /* Hidden by default */
        }

        /* Reset all button styles for custom canvas rendering */
        button {
            all: unset;
        }

        /* Base styling for canvas-rendered buttons */
        .canvas-button {
            display: block;
            cursor: pointer;
            padding: 0;
            border: none;
            margin: 0;
            outline: none;
            height: 36px; /* Default height */
        }

        .canvas-button canvas {
            width: 100%;
            height: 100%;
            transition: none; /* No CSS transitions as drawing is handled by JS */
        }

        /* Disabled state for canvas buttons */
        .canvas-button:disabled {
            cursor: not-allowed;
            opacity: 0.6; /* Visually indicate disabled state */
        }

        /* Custom scrollbar styling */
        .custom-scrollbar {
            position: absolute; /* Position relative to .article-body-wrapper */
            right: 0;
            top: 0;
            bottom: 0;
            flex-shrink: 0;
            padding: 0 4px; /* Padding around the scrollbar thumb */
            cursor: grab; /* Cursor for dragging */
            z-index: 2;
        }

        /* Footer containing action buttons */
        .article-footer {
            display: flex;
            justify-content: center; /* Center buttons horizontally */
            align-items: center;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px; /* Fixed height for the footer */
            padding: 0;
            box-sizing: border-box;
        }

        /* Styling for back and accept buttons */
        .back-button, .accept-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px; /* Space between text and icon (though icons only in this version) */
        }

        /* Styles for the rules content within the form */
        .scrollable-rules-wrapper {
            overflow-y: auto;
            scrollbar-width: none; /* For Firefox */
            -webkit-overflow-scrolling: touch; /* For iOS Safari */
        }
        .scrollable-rules-wrapper::-webkit-scrollbar {
            display: none; /* For Chrome, Safari, Edge */
        }
        .rules-content-canvas {
            display: block;
            height: auto;
        }
