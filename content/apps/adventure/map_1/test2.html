        class UIComponent {
            constructor() {
                this.element = null;
            }

            createElement(tag, className, innerHTML = '') {
                const el = document.createElement(tag);
                if (className) el.className = className;
                if (innerHTML) el.innerHTML = innerHTML;
                return el;
            }
        }

        class TopScreen extends UIComponent {
            constructor(appInstance) {
                super();
                this.app = appInstance;
                this.element = this.createElement('div', 'top-screen');

                this.articleImageElement = this.createElement('img', 'article-image');
                this.element.appendChild(this.articleImageElement);

                this.threeDCanvas = this.createElement('canvas', 'three-d-canvas');
                this.threeDCanvas.id = 'myCanvas';
                this.threeDCanvas.width = 400;
                this.threeDCanvas.height = 240;
                this.element.appendChild(this.threeDCanvas);
            }

            showArticleImage(imageUrl) {
                this.articleImageElement.src = imageUrl;
                this.articleImageElement.style.opacity = '1';
                this.articleImageElement.style.display = 'block';
                this.threeDCanvas.style.display = 'none';
            }

            showThreeDScene() {
                this.articleImageElement.style.display = 'none';
                this.threeDCanvas.style.display = 'block';
            }
        }

        class BottomScreen extends UIComponent {
            constructor({
                onShare,
                onCloseArticle,
                onAcceptArticle,
                sounds,
                sprites,
                appInstance
            }) {
                super();
                this.app = appInstance;
                this.element = this.createElement('div', 'bottom-screen');

                this.onShare = onShare;
                this.onCloseArticle = onCloseArticle;
                this.onAcceptArticle = onAcceptArticle;
                this.sounds = sounds;
                this.sprites = sprites;

                this.articleView = this.createElement('div', 'article-view view');
                this.acceptedView = this.createElement('div', 'accepted-view view');

                this.scrollableCanvasWrapper = this.createElement('div', 'scrollable-canvas-wrapper');
                this.htmlOverlay = this.createElement('div', 'article-html-overlay');
                this.scrollableCanvasWrapper.appendChild(this.htmlOverlay);

                this.element.appendChild(this.articleView);
                this.element.appendChild(this.acceptedView);
            }

            async drawArticleContent(text) {
                this.app.hyperlinks = [];
                this.app.checkboxes = [];

                if (this._articleClickListener) {
                    this.articleContentCanvas.removeEventListener('click', this._articleClickListener);
                }
                this._articleClickListener = (e) => this.handleArticleCanvasClick(e);
                this.articleContentCanvas.addEventListener('click', this._articleClickListener);

                this.htmlOverlay.innerHTML = '';

                const contentBlocks = this.app._parseArticleContent(text || "");
                await this.app.imageManager.loadImagesFromBlocks(contentBlocks);

                const ctx = this.articleContentCanvas.getContext('2d');
                const containerRect = this.scrollableCanvasWrapper.getBoundingClientRect();
                const horizontalPadding = 10;
                const verticalPadding = 10;
                const drawAreaWidth = this.app.articleContentTextWidth - (horizontalPadding * 2);

                let totalMeasuredHeight = verticalPadding;
                for (const block of contentBlocks) {
                    totalMeasuredHeight += this.app._measureBlockHeight(ctx, block, drawAreaWidth) + (this.app.cssVars.blockSpacing || 10);
                }
                totalMeasuredHeight += verticalPadding;

                this.articleContentCanvas.width = containerRect.width;
                this.articleContentCanvas.height = Math.max(this.scrollableCanvasWrapper.clientHeight, totalMeasuredHeight);
                this.articleContentCanvas.style.height = `${this.articleContentCanvas.height}px`;

                ctx.clearRect(0, 0, this.articleContentCanvas.width, this.articleContentCanvas.height);

                ctx.fillStyle = '#FDFDFD';
                ctx.fillRect(0, 0, this.articleContentCanvas.width, this.articleContentCanvas.height);

                let currentY = verticalPadding;
                ctx.textBaseline = 'top';
                for (const block of contentBlocks) {
                    const blockHeight = this.app._drawFormattedBlock(ctx, this.htmlOverlay, block, horizontalPadding, currentY, drawAreaWidth);
                    currentY += blockHeight + (this.app.cssVars.blockSpacing || 10);
                }

                this.articleScrollbar.update();
                this.updateAcceptButtonState();
            }

            setView(mode, data = {}) {
                if (this.articleView) this.articleView.classList.remove('active');
                if (this.acceptedView) this.acceptedView.classList.remove('active');

                this.app.messageCanvas.style.display = 'none';

                if (mode === 'article') {
                    if (this.articleView) {
                        this.articleView.classList.add('active');
                        this.renderArticleView(data.article);
                    }
                } else if (mode === 'accepted') {
                    if (this.acceptedView) {
                        this.acceptedView.classList.add('active');
                        this.renderAcceptedView();
                    }
                }
            }

            _createCanvasButton({
                text, sprite, width, height, textColor = 'black', textBaseline = 'middle',
                textAlign = 'center', font = '16px "Rodin", sans-serif', onClick, className = 'canvas-button',
                backgroundColor, activeBackgroundColor, borderRadius = 6, pulseColor = null,
                shadowOffset = { x: 0, y: 2, blur: 4, color: 'rgba(0,0,0,0.2)' },
                border = { width: 1, color: 'black' } // Added border property
            }) {
                const button = this.createElement('button', className);
                const canvas = this.createElement('canvas');
                button.appendChild(canvas);
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = false;

                let pulseStartTime = 0;
                let isPulsing = false;
                let animationFrameId = null;
                let isHovered = false;
                let isPressed = false;

                const finalTextColor = textColor;

                button.updateText = (newText) => {
                    text = newText;
                    draw();
                };

                const startPulse = () => {
                    isPulsing = true;
                    pulseStartTime = performance.now();
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    animationFrameId = requestAnimationFrame(animatePulse);
                };

                const animatePulse = (currentTime) => {
                    if (!isPulsing) return;
                    const elapsed = currentTime - pulseStartTime;
                    const duration = 500;
                    const progress = elapsed / duration;
                    if (progress < 1) {
                        draw(progress);
                        animationFrameId = requestAnimationFrame(animatePulse);
                    } else {
                        isPulsing = false;
                        animationFrameId = null;
                        draw();
                    }
                };

                const draw = (pulseProgress = 0) => {
                    ctx.clearRect(0, 0, width, height);
                    const isActive = button.classList.contains('active');
                    const isDisabled = button.disabled;

                    let currentBgColor;
                    let currentShadowOffset = { ...shadowOffset };

                    if (isDisabled) {
                        currentBgColor = '#d1d5db';
                        currentShadowOffset = { x: 0, y: 0, blur: 0, color: 'transparent' };
                    } else if (isPressed) {
                        currentBgColor = activeBackgroundColor || this.app.cssVars['--ds-accent-blue-dark'];
                        currentShadowOffset = { x: 0, y: 0, blur: 0, color: 'transparent' };
                    } else if (isActive) {
                        currentBgColor = activeBackgroundColor || this.app.cssVars['--ds-accent-blue'];
                    } else if (isHovered && !className.includes('share-button')) {
                        currentBgColor = this.app.cssVars['--ds-interactive-hover'];
                    } else {
                        currentBgColor = this.app.cssVars['--ds-interactive-bg'];
                    }

                    if (className.includes('back-button')) {
                        if (isDisabled) currentBgColor = 'rgba(128, 128, 128, 0.5)';
                        else currentBgColor = isPressed ? '#A72B38' : (isActive ? '#A72B38' : '#DC3545');
                    } else if (className.includes('accept-button')) {
                        if (isDisabled) currentBgColor = 'rgba(128, 128, 128, 0.5)';
                        else currentBgColor = isPressed ? '#1F7A34' : (isActive ? '#1F7A34' : '#28A745');
                    } else if (className.includes('exit-button') || className.includes('rules-button')) { // Added rules-button
                        if (isDisabled) currentBgColor = 'rgba(128, 128, 128, 0.5)';
                        else currentBgColor = isPressed ? this.app.cssVars['--ds-accent-blue-dark'] : (isActive ? this.app.cssVars['--ds-accent-blue-dark'] : this.app.cssVars['--ds-accent-blue']);
                    } else if (className.includes('share-button')) {
                        currentBgColor = 'rgba(0,0,0,0)'; // Always transparent background for share button
                        activeBackgroundColor = 'rgba(0,0,0,0)';
                        pulseColor = null;
                        borderRadius = 0; // No rounded corners for just the icon
                    }


                    ctx.save();
                    ctx.shadowColor = currentShadowOffset.color;
                    ctx.shadowBlur = currentShadowOffset.blur;
                    ctx.shadowOffsetX = currentShadowOffset.x;
                    ctx.shadowOffsetY = currentShadowOffset.y;

                    if (!(currentBgColor.startsWith('rgba') && currentBgColor.endsWith(',0)'))) {
                        ctx.fillStyle = currentBgColor;
                        ctx.beginPath();
                        const radii = Array.isArray(borderRadius) ? {
                            topLeft: borderRadius[0],
                            topRight: borderRadius[1],
                            bottomRight: borderRadius[2],
                            bottomLeft: borderRadius[3]
                        } : {
                            topLeft: borderRadius,
                            topRight: borderRadius,
                            bottomRight: borderRadius,
                            bottomLeft: borderRadius
                        };
                        ctx.roundRect(0, 0, width, height, radii);
                        ctx.fill();
                    }
                    ctx.restore();

                    // Draw highlight gradient
                    ctx.save();
                    ctx.beginPath();
                    const highlightRadii = Array.isArray(borderRadius) ? {
                        topLeft: borderRadius[0],
                        topRight: borderRadius[1],
                        bottomRight: borderRadius[2],
                        bottomLeft: borderRadius[3]
                    } : {
                        topLeft: borderRadius,
                        topRight: borderRadius,
                        bottomRight: borderRadius,
                        bottomLeft: borderRadius
                    };
                    ctx.roundRect(0, 0, width, height, highlightRadii);
                    ctx.clip();
                    const highlightGradient = ctx.createLinearGradient(0, 0, 0, height);
                    highlightGradient.addColorStop(0, `rgba(255, 255, 255, 0.15)`);
                    highlightGradient.addColorStop(1, `rgba(255, 255, 255, 0)`);
                    ctx.fillStyle = highlightGradient;
                    ctx.fillRect(0, 0, width, height);
                    ctx.restore();

                    // Draw subtle inner shadow gradient
                    ctx.save();
                    ctx.beginPath();
                    const shadowRadii = Array.isArray(borderRadius) ? {
                        topLeft: borderRadius[0],
                        topRight: borderRadius[1],
                        bottomRight: borderRadius[2],
                        bottomLeft: borderRadius[3]
                    } : {
                        topLeft: borderRadius,
                        topRight: borderRadius,
                        bottomRight: borderRadius,
                        bottomLeft: borderRadius
                    };
                    ctx.roundRect(0, 0, width, height, shadowRadii);
                    ctx.clip();
                    const shadowGradient = ctx.createLinearGradient(0, 0, 0, height);
                    shadowGradient.addColorStop(0, `rgba(0, 0, 0, 0)`);
                    shadowGradient.addColorStop(1, `rgba(0, 0, 0, 0.1)`);
                    ctx.fillStyle = shadowGradient;
                    ctx.fillRect(0, 0, width, height);
                    ctx.restore();

                    if (className.includes('share-button') && isHovered && !isDisabled) {
                        ctx.shadowColor = this.app.cssVars['--ds-accent-blue'];
                        ctx.shadowBlur = 15;
                    } else {
                        ctx.shadowColor = 'transparent';
                        ctx.shadowBlur = 0;
                        ctx.shadowOffsetX = 0;
                        ctx.shadowOffsetY = 0;
                    }

                    if (isPulsing && pulseColor && !isDisabled) {
                        const radius = pulseProgress * (Math.min(width, height) / 2 * 1.5);
                        const opacity = 0.5 * (1 - pulseProgress);
                        const r = parseInt(pulseColor.slice(1, 3), 16);
                        const g = parseInt(pulseColor.slice(3, 5), 16);
                        const b = parseInt(pulseColor.slice(5, 7), 16);
                        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${opacity})`;
                        ctx.beginPath();
                        ctx.arc(width / 2, height / 2, radius, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    if (sprite) {
                        const spriteSize = className.includes('share-button') ? 24 : 20; // Use full size for share icon
                        if (sprite.complete && sprite.naturalWidth !== 0) {
                            ctx.drawImage(sprite, (width - spriteSize) / 2, (height - spriteSize) / 2, spriteSize, spriteSize);
                        } else {
                            console.warn(`Sprite for button is not loaded or broken: ${sprite.src}`);
                        }
                    }
                    if (text) {
                        this.app._drawTextOnCanvas(ctx, text, width / 2, height / 2, font, finalTextColor, textAlign, textBaseline);
                    }

                    // Draw button outline (border)
                    if (border && border.width > 0 && border.color) {
                        ctx.strokeStyle = border.color;
                        ctx.lineWidth = border.width;
                        ctx.beginPath();
                        const outlineRadii = Array.isArray(borderRadius) ? {
                            topLeft: borderRadius[0],
                            topRight: borderRadius[1],
                            bottomRight: borderRadius[2],
                            bottomLeft: borderRadius[3]
                        } : {
                            topLeft: borderRadius,
                            topRight: borderRadius,
                            bottomRight: borderRadius,
                            bottomLeft: borderRadius
                        };
                        ctx.roundRect(0, 0, width, height, outlineRadii);
                        ctx.stroke();
                    }

                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                };

                const observer = new MutationObserver((mutationsList) => {
                    for (const mutation of mutationsList) {
                        if (mutation.type === 'attributes' && (mutation.attributeName === 'class' || mutation.attributeName === 'disabled')) {
                            draw();
                        }
                    }
                });
                observer.observe(button, { attributes: true });

                button.addEventListener('mouseenter', () => {
                    if (button.disabled) return;
                    isHovered = true;
                    this.app.sounds.hover.play();
                    draw();
                });
                button.addEventListener('mouseleave', () => {
                    isHovered = false;
                    isPressed = false;
                    draw();
                });
                button.addEventListener('mousedown', () => {
                    if (button.disabled) return;
                    isPressed = true;
                    draw();
                });
                button.addEventListener('mouseup', () => {
                    if (button.disabled) return;
                    isPressed = false;
                    draw();
                });

                if (onClick) {
                    button.addEventListener('click', (e) => {
                        if (button.disabled) return;
                        if (pulseColor) startPulse();
                        onClick(e);
                    });
                }
                if (sprite && !sprite.complete) sprite.onload = draw;
                else draw();
                return button;
            }

            handleArticleCanvasClick(e) {
                const canvas = this.articleContentCanvas;
                const rect = canvas.getBoundingClientRect();
                const scrollOffset = this.scrollableCanvasWrapper.scrollTop;
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top + scrollOffset;

                const clickedLink = this.app.hyperlinks.find(link => {
                    return x >= link.rect.x && x <= link.rect.x + link.rect.width && y >= link.rect.y && y <= link.rect.y + link.rect.height;
                });

                if (clickedLink) {

        class Scrollbar {
            constructor(scrollableContainer, appInstance) {
                this.container = scrollableContainer;
                this.app = appInstance;
                this.element = document.createElement('canvas');
                this.element.className = 'custom-scrollbar';
                this.ctx = this.element.getContext('2d');
                this.ctx.imageSmoothingEnabled = false;
                this.isDragging = false;
                this.startY = 0;
                this.startScrollTop = 0;
                this.lastScrollTop = this.container.scrollTop;
                this.scrollSoundTimeout = null;

                this.element.addEventListener('mousedown', this.onThumbMouseDown.bind(this));
                document.addEventListener('mousemove', this.onThumbMouseMove.bind(this));
                document.addEventListener('mouseup', this.onThumbMouseUp.bind(this));

                this.element.addEventListener('touchstart', this.onThumbTouchStart.bind(this), { passive: false });
                document.addEventListener('touchmove', this.onThumbTouchMove.bind(this), { passive: false });
                document.addEventListener('touchend', this.onThumbTouchEnd.bind(this));

                this.container.addEventListener('scroll', () => this.update());
                window.addEventListener('resize', () => this.update());

                const observer = new MutationObserver(() => this.update());
                observer.observe(this.container, { childList: true, subtree: true, characterData: true, attributes: true });

                this.update();
            }

            onThumbMouseDown(e) {
                this.isDragging = true;
                this.startY = e.clientY;
                this.startScrollTop = this.container.scrollTop;
                this.element.style.cursor = 'grabbing';
            }

            onThumbMouseMove(e) {
                if (!this.isDragging) return;
                e.preventDefault();
                const dy = e.clientY - this.startY;
                const scrollRatio = this.container.scrollHeight / this.container.clientHeight;
                this.container.scrollTop = this.startScrollTop + (dy * scrollRatio);
            }

            onThumbMouseUp() {
                this.isDragging = false;
                this.element.style.cursor = 'grab';
            }

            onThumbTouchStart(e) {
                this.isDragging = true;
                this.startY = e.touches[0].clientY;
                this.startScrollTop = this.container.scrollTop;
                this.element.style.cursor = 'grabbing';
                e.preventDefault();
            }

            onThumbTouchMove(e) {
                if (!this.isDragging) return;
                e.preventDefault();
                const dy = e.touches[0].clientY - this.startY;
                const scrollRatio = this.container.scrollHeight / this.container.clientHeight;
                this.container.scrollTop = this.startScrollTop + (dy * scrollRatio);
            }

            onThumbTouchEnd() {
                this.isDragging = false;
                this.element.style.cursor = 'grab';
            }

            drawScrollbar(viewHeight, contentHeight, thumbHeight, thumbY) {
                const canvas = this.element;
                const ctx = this.ctx;
                const trackWidth = 8;
                const thumbWidth = 6;
                const borderRadius = 3;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(canvas.width - trackWidth, 0, trackWidth, canvas.height);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                const thumbX = canvas.width - trackWidth + (trackWidth - thumbWidth) / 2;

                ctx.moveTo(thumbX + borderRadius, thumbY);
                ctx.lineTo(thumbX + thumbWidth - borderRadius, thumbY);
                ctx.arcTo(thumbX + thumbWidth, thumbY, thumbX + thumbWidth, thumbY + borderRadius, borderRadius);
                ctx.lineTo(thumbX + thumbWidth, thumbY + thumbHeight - borderRadius);
                ctx.arcTo(thumbX + thumbWidth, thumbY + thumbHeight, thumbX + thumbWidth - borderRadius, thumbY + thumbHeight, borderRadius);
                ctx.lineTo(thumbX + borderRadius, thumbY + thumbHeight);
                ctx.arcTo(thumbX, thumbY + thumbHeight, thumbX, thumbY + thumbHeight - borderRadius, borderRadius);
                ctx.lineTo(thumbX, thumbY + borderRadius);
                ctx.arcTo(thumbX, thumbY, thumbX + borderRadius, thumbY, borderRadius);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                requestAnimationFrame(() => {
                    const viewHeight = this.container.clientHeight;
                    const contentHeight = this.container.scrollHeight;
                    this.element.height = viewHeight;
                    this.element.width = 14;
                    this.element.style.visibility = contentHeight > viewHeight ? 'visible' : 'hidden';

                    this.element.style.position = 'absolute';
                    this.element.style.top = '0px';
                    this.element.style.bottom = '0px';
                    this.element.style.right = '0px';

                    const thumbHeight = Math.max(20, viewHeight * (viewHeight / contentHeight));
                    const scrollPercentage = contentHeight > viewHeight ? this.container.scrollTop / (contentHeight - viewHeight) : 0;
                    const thumbY = scrollPercentage * (viewHeight - thumbHeight);

                    const newScrollTop = this.container.scrollTop;
                    if (this.app && this.app.sounds.scroll && this.lastScrollTop !== undefined && newScrollTop !== this.lastScrollTop) {
                        if (!this.scrollSoundTimeout) {
                            this.scrollSoundTimeout = setTimeout(() => {
                                this.scrollSoundTimeout = null;
                            }, 100);
                        }
                    }
                    this.lastScrollTop = newScrollTop;

                    this.drawScrollbar(viewHeight, contentHeight, thumbHeight, thumbY);
                });
            }
        }

        class TextCanvasMeasurer {
            constructor() {
                if (!TextCanvasMeasurer.instance) {
                    this._canvas = document.createElement('canvas');
                    this._ctx = this._canvas.getContext('2d');
                    this._ctx.imageSmoothingEnabled = false;
                    TextCanvasMeasurer.instance = this;
                }
                return TextCanvasMeasurer.instance;
            }

            measureText(text, font) {
                this._ctx.font = font;
                return this._ctx.measureText(text);
            }

            estimateWrappedTextHeight(text, font, maxWidth, lineSpacingFactor = 1.0) {
                this._ctx.font = font;
                const tempMetrics = this._ctx.measureText('M');
                const actualLineHeight = (tempMetrics.actualBoundingBoxAscent || 0) + (tempMetrics.actualBoundingBoxDescent || 0);

                if (maxWidth === Infinity) {
                    return actualLineHeight * lineSpacingFactor;
                }

                const words = text.split(' ');
                let line = '';
                let totalHeight = 0;
                for (let n = 0; n < words.length; n++) {
                    let testLine = line + (n > 0 ? ' ' : '') + words[n];
                    let metrics = this._ctx.measureText(testLine);
                    let testWidth = metrics.width;

                    if (testWidth > maxWidth && line.length > 0) {
                        totalHeight += actualLineHeight * lineSpacingFactor;
                        line = words[n];
                    } else {
                        line = testLine;
                    }
                }
                totalHeight += actualLineHeight * lineSpacingFactor;
                return totalHeight;
            }
        }

        class ImageManager {
            constructor() {
                this.cache = new Map();
            }

            loadImage(url) {
                if (this.cache.has(url)) {
                    return Promise.resolve(this.cache.get(url));
                }
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => {
                        this.cache.set(url, img);
                        resolve(img);
                    };
                    img.onerror = () => {
                        console.error(`Failed to load image: ${url}`);
                        this.cache.set(url, null);
                        resolve(null);
                    };
                    img.src = url;
                });
            }

            getImage(url) {
                return this.cache.get(url) || null;
            }

            async loadImagesFromBlocks(blocks) {
                const mediaUrls = new Set();
                blocks.forEach(block => {
                    if (block.type === 'image') {
                        mediaUrls.add(block.url);
                    } else if (block.type === 'embed' && block.service === 'youtube') {
                        mediaUrls.add(`https://img.youtube.com/vi/${block.id}/0.jpg`);
                    }
                });
                const promises = Array.from(mediaUrls).map(url => this.loadImage(url));
                await Promise.all(promises);
            }
        }

                Howler.mute(this.audioSettings.mute);
                const sfxVolume = 1.0 * this.audioSettings.volumeMultiplier.sfx;
                const musicVolume = 0.2 * this.audioSettings.volumeMultiplier.music;

                if (this.sounds.hover) this.sounds.hover.volume(1.0 * sfxVolume);
                if (this.sounds.shareConfirm) this.sounds.shareConfirm.volume(0.8 * sfxVolume);
                if (this.sounds.appLaunch) this.sounds.appLaunch.volume(0.7 * sfxVolume);
                if (this.sounds.appExit) this.sounds.appExit.volume(0.7 * sfxVolume);

                if (this.sounds.inputFocus) this.sounds.inputFocus.volume(0.7 * sfxVolume);
                if (this.sounds.inputBlur) this.sounds.inputBlur.volume(0.7 * sfxVolume);

                if (this.sounds.music) this.sounds.music.volume(musicVolume);

            _parseInlineFormatting(text) {
                const tokens = [];
                const regex = /(?<image>!\[[^\]]*?\]\([^)]+?\))|(?<link>\[[^\]]*?\]\([^)]+?\)|\<a\s+href="[^"]+"\>[^<]+\<\/a\>)|(?<youtube>@\[youtube\]\([^)]+?\))|(?<bold>\*\*.*?\*\*)|(?<italic>\*.*?\*)|(?<underline>__.*?__)|(?<strike>~~.*?~~)|(?<sup>\^.*?\^)|(?<sub>~.*?~)|(?<color>\{color:(#[0-9a-fA-F]{6}|[a-zA-Z]+)\|.*?\})/g;

                let lastIndex = 0;
                let match;
                while ((match = regex.exec(text)) !== null) {
                    if (match.index > lastIndex) {
                        tokens.push({ text: text.substring(lastIndex, match.index), style: {} });
                    }

                    const groups = match.groups;
                    let token;

                    if (groups.bold) token = { text: groups.bold.slice(2, -2), style: { bold: true } };
                    else if (groups.italic) token = { text: groups.italic.slice(1, -1), style: { italic: true } };
                    else if (groups.underline) token = { text: groups.underline.slice(2, -2), style: { underline: true } };
                    else if (groups.strike) token = { text: groups.strike.slice(2, -2), style: { strikethrough: true } };
                    else if (groups.sup) token = { text: groups.sup.slice(1, -1), style: { script: 'super' } };
                    else if (groups.sub) token = { text: groups.sub.slice(1, -1), style: { script: 'sub' } };
                    else if (groups.color) {
                        const colorContent = groups.color.slice(7, -1);
                        const separatorIndex = colorContent.indexOf('|');
                        if (separatorIndex !== -1) {
                            const color = colorContent.substring(0, separatorIndex);
                            const content = colorContent.substring(separatorIndex + 1);
                            token = { text: content, style: { color } };
                        }
                    } else if (groups.youtube) {
                        const [, videoId] = /@\[youtube\]\((.*?)\)/.exec(groups.youtube) || [];
                        if (videoId) token = { text: '', style: { youtube: videoId } };
                    } else if (groups.image) {
                        const [, alt, url] = /!\[(.*?)\]\((.*?)\)/.exec(groups.image) || [];
                        if (url) token = { text: '', style: { image: url, alt } };
                    } else if (groups.link) {
                        const [, text, url] = /\[(.*?)\]\((.*?)\)/.exec(groups.link) || [];
                        if (text) token = { text, style: { link: true, url } };
                    }
                    if (token) tokens.push(token);
                    lastIndex = regex.lastIndex;
                }
                if (lastIndex < text.length) {
                    tokens.push({ text: text.substring(lastIndex), style: {} });
                }
                return tokens;
            }

            _renderInlineFormattedText(ctx, tokens, x, y, baseFont, baseColor, maxWidth, lineSpacingFactor, measureOnly = false) {
                ctx.save();
                let currentX = x;
                let currentY = y;
                const baseFontSize = parseInt(baseFont);
                const fontFamily = baseFont.substring(baseFont.indexOf('px') + 3).trim();
                const measurer = new TextCanvasMeasurer();
                const fontMetrics = measurer.measureText("M", baseFont);
                const baseLineHeight = (fontMetrics.actualBoundingBoxAscent || baseFontSize) + (fontMetrics.actualBoundingBoxDescent || 0);
                const lineHeight = baseLineHeight * lineSpacingFactor;
                let totalHeight = (tokens.length > 0 && tokens.some(t => t.text || t.style.image || t.style.youtube)) ? lineHeight : 0;
                const links = [];
                ctx.textBaseline = 'top';

                const applyStyle = (style) => {
                    let fontStyle = style.italic ? 'italic ' : '';
                    fontStyle += style.bold ? 'bold ' : '';
                    let fontSize = baseFontSize;
                    let yOffset = 0;

                    if (style.script) {
                        fontSize = Math.floor(baseFontSize * 0.8);
                        yOffset = style.script === 'super' ? -fontSize * 0.4 : (baseFontSize - fontSize) * 0.7;
                    }
                    ctx.font = `${fontStyle}${fontSize}px ${fontFamily}`;
                    ctx.fillStyle = style.color || (style.link ? this.cssVars['--ds-accent-blue'] : baseColor);
                    return yOffset;
                };

                for (const token of tokens) {
                    const mediaUrl = token.style.image || (token.style.youtube ? `https://img.youtube.com/vi/${token.style.youtube}/0.jpg` : null);

                    if (mediaUrl) {
                        const img = this.imageManager.getImage(mediaUrl);
                        if (img && img.complete) {
                            const aspectRatio = img.height / img.width;
                            const drawWidth = Math.min(img.width, maxWidth);
                            const drawHeight = drawWidth * aspectRatio;

                            if (currentX > x) {
                                currentX = x;
                                currentY += lineHeight;
                                totalHeight += lineHeight;
                            }

                            if (!measureOnly) {
                                ctx.drawImage(img, x, y, drawWidth, drawHeight);
                                if (token.style.youtube) {
                                    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                                    ctx.beginPath();
                                    ctx.arc(x + drawWidth / 2, y + drawHeight / 2, 30, 0, Math.PI * 2);
                                    ctx.fill();
                                    ctx.fillStyle = 'white';
                                    ctx.beginPath();
                                    ctx.moveTo(x + drawWidth / 2 - 10, y + drawHeight / 2 - 15);
                                    ctx.lineTo(x + drawWidth / 2 + 15, y + drawHeight / 2);
                                    ctx.lineTo(x + drawWidth / 2 - 10, y + drawHeight / 2 + 15);
                                    ctx.closePath();
                                    ctx.fill();
                                    links.push({
                                        rect: { x: x, y: y, width: drawWidth, height: drawHeight },
                                        url: `youtube:${token.style.youtube}`
                                    });
                                } else if (token.style.image) {
                                    links.push({
                                        rect: { x: x, y: y, width: drawWidth, height: drawHeight },
                                        url: token.style.image
                                    });
                                }
                            }
                            currentY += drawHeight;
                            totalHeight += drawHeight - lineHeight;
                        }
                        continue;
                    }

                    const words = token.text.split(/(\s+)/);
                    for (const word of words) {
                        if (word === '') continue;
                        const yOffset = applyStyle(token.style);
                        const wordWidth = ctx.measureText(word).width;

                        if (currentX > x && currentX + wordWidth > x + maxWidth && word.trim() !== '') {
                            currentX = x;
                            currentY += lineHeight;
                            totalHeight += lineHeight;
                        }

                        if (!measureOnly) {
                            if (token.style.bold) {
                                ctx.lineWidth = 1;
                                ctx.strokeStyle = ctx.fillStyle;
                                ctx.strokeText(word, currentX, currentY + yOffset);
                            }
                            ctx.fillText(word, currentX, currentY + yOffset);

                            const textY = currentY + yOffset;
                            const wordTrimmedWidth = ctx.measureText(word.trim()).width;

                            if (token.style.underline || token.style.link) {
                                ctx.fillRect(currentX, textY + baseFontSize * 1.1, wordTrimmedWidth, 1);
                            }
                            if (token.style.strikethrough) {
                                ctx.fillRect(currentX, textY + baseFontSize * 0.6, wordTrimmedWidth, 1);
                            }
                            if (token.style.link) {
                                links.push({
                                    rect: { x: currentX, y: currentY, width: wordTrimmedWidth, height: lineHeight },
                                    url: token.style.url
                                });
                            }
                        }
                        currentX += wordWidth;
                    }
                }
                ctx.restore();
                return { height: totalHeight, links };
            }

            _estimateTextHeight(font, text = '', maxWidth = Infinity, lineSpacingFactorToUse = this.lineSpacingFactor) {
                const measurer = new TextCanvasMeasurer();
                return measurer.estimateWrappedTextHeight(text, font, maxWidth, lineSpacingFactorToUse);
            }

            _drawTextOnCanvas(ctx, text, x, y, font, color, textAlign = 'left', textBaseline = 'alphabetic', maxWidth = Infinity, lineSpacingFactorToUse = this.lineSpacingFactor) {
                if (!ctx) {
                    console.error("Canvas rendering context is null. Cannot draw text.");
                    return 0;
                }
                ctx.save();
                ctx.font = font;
                ctx.fillStyle = color !== undefined && color !== null ? color : 'black';
                ctx.textAlign = textAlign;
                ctx.textBaseline = textBaseline;

                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.font = font;
                const tempMetrics = tempCtx.measureText('M');
                const actualLineHeight = (tempMetrics.actualBoundingBoxAscent || 0) + (tempMetrics.actualBoundingBoxDescent || 0);

                if (maxWidth === Infinity) {
                    ctx.fillText(text, x, y);
                    ctx.restore();
                    return actualLineHeight * lineSpacingFactorToUse;
                } else {
                    const words = text.split(' ');
                    let line = '';
                    let currentY = y;
                    let totalHeightUsed = 0;

                    for (let n = 0; n < words.length; n++) {
                        let testLine = line + (n > 0 ? ' ' : '') + words[n];
                        let metrics = ctx.measureText(testLine);
                        let testWidth = metrics.width;

                        if (testWidth > maxWidth && line.length > 0) {
                            ctx.fillText(line, x, currentY);
                            totalHeightUsed += actualLineHeight * lineSpacingFactorToUse;
                            currentY += actualLineHeight * lineSpacingFactorToUse;
                            line = words[n];
                        } else {
                            line = testLine;
                        }
                    }
                    ctx.fillText(line, x, currentY);
                    totalHeightUsed += actualLineHeight * lineSpacingFactorToUse;
                    ctx.restore();
                    return totalHeightUsed;
                }
            }

            _parseArticleContent(content) {
                const blocks = [];
                const lines = content.split('\n');
                let inList = false;
                let currentListType = null;
                let currentListIndent = 0;

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trimEnd();

                    if (line.startsWith('# ')) {
                        blocks.push({ type: 'heading', level: 1, text: line.substring(2).trim() });
                        inList = false;
                        continue;
                    }
                    if (line === '---') {
                        blocks.push({ type: 'hr' });
                        inList = false;
                        continue;
                    }
                    const unorderedMatch = line.match(/^(-|\*)\s+(.*)/);
                    if (unorderedMatch) {
                        const indent = line.indexOf(unorderedMatch[0]);
                        const listItemText = unorderedMatch[2].trim();
                        if (!inList || currentListType !== 'unordered' || indent !== currentListIndent) {
                            blocks.push({ type: 'list', listType: 'unordered', items: [{ text: listItemText, indent: indent }] });
                            inList = true;
                            currentListType = 'unordered';
                            currentListIndent = indent;
                        } else {
                            blocks[blocks.length - 1].items.push({ text: listItemText, indent: indent });
                        }
                        continue;
                    }

                    const orderedMatch = line.match(/^(\d+)\.\s+(.*)/);
                    if (orderedMatch) {
                        const indent = line.indexOf(orderedMatch[0]);
                        const listItemText = orderedMatch[2].trim();
                        if (!inList || currentListType !== 'ordered' || indent !== currentListIndent) {
                            blocks.push({ type: 'list', listType: 'ordered', items: [{ text: listItemText, indent: indent }] });
                            inList = true;
                            currentListType = 'ordered';
                            currentListIndent = indent;
                        } else {
                            blocks[blocks.length - 1].items.push({ text: listItemText, indent: indent });
                        }
                        continue;
                    }

                    const imageMatch = line.match(/^!\[(.*?)\]\((.*?)\)$/);
                    if (imageMatch) {
                        blocks.push({ type: 'image', alt: imageMatch[1], url: imageMatch[2] });
                        inList = false;
                        continue;
                    }

                    const youtubeMatch = line.match(/^@\[youtube\]\((.*?)\)$/);
                    if (youtubeMatch) {
                        blocks.push({ type: 'embed', service: 'youtube', id: youtubeMatch[1] });
                        inList = false;
                        continue;
                    }

                    if (line.startsWith('|') && lines[i + 1] && lines[i + 1].startsWith('|')) {
                        const headerLine = line;
                        const table = { type: 'table', headers: [], rows: [] };

                        table.headers = headerLine.split('|').map(h => h.trim()).filter(h => h !== '');

                        i++;

                        while (i + 1 < lines.length && lines[i + 1].startsWith('|')) {
                            i++;
                            const rowLine = lines[i];
                            const row = rowLine.split('|').map(c => c.trim()).filter(c => c !== '');
                            table.rows.push(row);
                        }
                        blocks.push(table);
                        inList = false;
                        continue;
                    }

                    if (line) {
                        blocks.push({ type: 'paragraph', text: line });
                        inList = false;
                    } else if (inList) {
                        inList = false;
                        currentListType = null;
                        currentListIndent = 0;
                    }
                }
                return blocks;
            }

            _measureBlockHeight(ctx, block, maxWidth) {
                const baseFont = '14px "Rodin", sans-serif';
                const headingFont = 'bold 18px "Rodin", sans-serif';
                const measurer = new TextCanvasMeasurer();

                switch (block.type) {
                    case 'paragraph':
                        const tokens = this._parseInlineFormatting(block.text);
                        return this._renderInlineFormattedText(ctx, tokens, 0, 0, baseFont, 'black', maxWidth, this.lineSpacingFactor, true).height;
                    case 'heading':
                        return measurer.estimateWrappedTextHeight(block.text, headingFont, maxWidth, 1.2);
                    case 'hr':
                        return 2;
                    case 'list':
                        let listHeight = 0;
                        const listItemIndent = 20;
                        for (const item of block.items) {
                            const itemTextWidth = maxWidth - listItemIndent;
                            listHeight += measurer.estimateWrappedTextHeight(item.text, baseFont, itemTextWidth, this.lineSpacingFactor);
                        }
                        return listHeight;
                    case 'image':
                        const img = this.imageManager.getImage(block.url);
                        if (img && img.complete) {
                            const aspectRatio = img.height / img.width;
                            return maxWidth * aspectRatio;
                        }
                        return 0;
                    case 'embed':
                        return maxWidth * (9 / 16);
                    case 'table':
                        let tableHeight = 0;
                        const cellPadding = 5;
                        const columnWidth = maxWidth / block.headers.length;

                        let headerRowHeight = 0;
                        block.headers.forEach(header => {
                            const headerTokens = this._parseInlineFormatting(header);
                            const headerResult = this._renderInlineFormattedText(ctx, headerTokens, 0, 0, 'bold 14px "Rodin", sans-serif', 'black', columnWidth - cellPadding * 2, 1.2, true);
                            headerRowHeight = Math.max(headerRowHeight, headerResult.height);
                        });
                        tableHeight += headerRowHeight + cellPadding * 2;

                        block.rows.forEach(row => {
                            let maxRowHeight = 0;
                            row.forEach(cell => {
                                const cellTokens = this._parseInlineFormatting(cell);
                                const cellResult = this._renderInlineFormattedText(ctx, cellTokens, 0, 0, baseFont, 'black', columnWidth - cellPadding * 2, 1.2, true);
                                maxRowHeight = Math.max(maxRowHeight, cellResult.height);
                            });
                            tableHeight += maxRowHeight + cellPadding * 2;
                        });
                        return tableHeight;
                    default:
                        return 0;
                }
            }

            _drawFormattedBlock(ctx, htmlOverlay, block, x, y, maxWidth) {
                const baseFont = '14px "Rodin", sans-serif';
                const headingFont = 'bold 18px "Rodin", sans-serif';
                let blockHeight = 0;

                switch (block.type) {
                    case 'paragraph':
                        const paragraphTokens = this._parseInlineFormatting(block.text);
                        const paragraphResult = this._renderInlineFormattedText(ctx, paragraphTokens, x, y, baseFont, 'black', maxWidth, this.lineSpacingFactor);
                        blockHeight = paragraphResult.height;
                        this.hyperlinks.push(...paragraphResult.links);
                        break;
                    case 'heading':
                        blockHeight = this._drawTextOnCanvas(ctx, block.text, x, y, headingFont, 'black', 'left', 'top', maxWidth, 1.2);
                        break;
                    case 'hr':
                        ctx.strokeStyle = '#cccccc';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(x, y + 1);
                        ctx.lineTo(x + maxWidth, y + 1);
                        ctx.stroke();
                        blockHeight = 2;
                        break;
                    case 'list':
                        let currentListItemY = y;
                        const listItemIndent = 20;
                        block.items.forEach((item, index) => {
                            const itemX = x + item.indent;
                            const itemTextWidth = maxWidth - item.indent;
                            let bulletOrNumber = '';
                            if (block.listType === 'unordered') bulletOrNumber = 'â€¢ ';
                            else bulletOrNumber = `${index + 1}. `;

                            ctx.font = baseFont;
                            ctx.fillStyle = 'black';
                            ctx.textAlign = 'left';
                            ctx.textBaseline = 'top';
                            ctx.fillText(bulletOrNumber, itemX, currentListItemY);

                            const itemTextTokens = this._parseInlineFormatting(item.text);
                            const itemTextResult = this._renderInlineFormattedText(ctx, itemTextTokens, itemX + ctx.measureText(bulletOrNumber).width, currentListItemY, baseFont, 'black', itemTextWidth, this.lineSpacingFactor);
                            currentListItemY += itemTextResult.height;
                            blockHeight += itemTextResult.height;
                            this.hyperlinks.push(...itemTextResult.links);
                        });
                        break;
                    case 'image':
                        const img = this.imageManager.getImage(block.url);
                        if (img && img.complete) {
                            const aspectRatio = img.height / img.width;
                            const drawWidth = maxWidth;
                            const drawHeight = drawWidth * aspectRatio;
                            ctx.drawImage(img, x, y, drawWidth, drawHeight);
                            blockHeight = drawHeight;
                            this.hyperlinks.push({ rect: { x: x, y: y, width: drawWidth, height: drawHeight }, url: block.url });
                        }
                        break;
                    case 'embed':
                        const iframe = document.createElement('iframe');
                        iframe.src = `https://www.youtube.com/embed/${block.id}?autoplay=0&controls=1`;
                        iframe.width = maxWidth;
                        iframe.height = maxWidth * (9 / 16);
                        iframe.style.position = 'absolute';
                        iframe.style.left = `${x}px`;
                        iframe.style.top = `${y}px`;
                        iframe.style.width = `${maxWidth}px`;
                        iframe.style.height = `${maxWidth * (9 / 16)}px`;
                        iframe.style.border = 'none';
                        iframe.setAttribute('allowfullscreen', '');
                        iframe.setAttribute('frameborder', '0');
                        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
                        htmlOverlay.appendChild(iframe);
                        blockHeight = iframe.height;

                        this.hyperlinks.push({
                            rect: { x: x, y: y, width: maxWidth, height: blockHeight },
                            url: `youtube:${block.id}`
                        });
                        break;
                    case 'table':
                        let currentTableY = y;
                        const cellPadding = 5;
                        const columnWidth = maxWidth / block.headers.length;

                        ctx.font = 'bold 14px "Rodin", sans-serif';
                        ctx.fillStyle = 'black';
                        ctx.textBaseline = 'top';
                        let headerRowHeight = 0;
                        block.headers.forEach((header, colIndex) => {
                            const headerTokens = this._parseInlineFormatting(header);
                            const headerResult = this._renderInlineFormattedText(ctx, headerTokens, x + colIndex * columnWidth + cellPadding, currentTableY + cellPadding, 'bold 14px "Rodin", sans-serif', 'black', columnWidth - cellPadding * 2, 1.2);
                            headerRowHeight = Math.max(headerRowHeight, headerResult.height);
                            this.hyperlinks.push(...headerResult.links);
                        });
                        currentTableY += headerRowHeight + cellPadding * 2;
                        blockHeight += headerRowHeight + cellPadding * 2;

                        ctx.strokeStyle = '#cccccc';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(x, currentTableY - 0.5);
                        ctx.lineTo(x + maxWidth, currentTableY - 0.5);
                        ctx.stroke();

                        block.rows.forEach(row => {
                            let rowHeight = 0;
                            row.forEach((cell, colIndex) => {
                                const cellTokens = this._parseInlineFormatting(cell);
                                const cellResult = this._renderInlineFormattedText(ctx, cellTokens, x + colIndex * columnWidth + cellPadding, currentTableY + cellPadding, baseFont, 'black', columnWidth - cellPadding * 2, 1.2);
                                rowHeight = Math.max(rowHeight, cellResult.height);
                                this.hyperlinks.push(...cellResult.links);
                            });
                            currentTableY += rowHeight + cellPadding * 2;
                            blockHeight += rowHeight + cellPadding * 2;

                            ctx.beginPath();
                            ctx.moveTo(x, currentTableY - 0.5);
                            ctx.lineTo(x + maxWidth, currentTableY - 0.5);
                            ctx.stroke();
                        });

                        for (let i = 0; i <= block.headers.length; i++) {
                            ctx.beginPath();
                            ctx.moveTo(x + i * columnWidth + 0.5, y);
                            ctx.lineTo(x + i * columnWidth + 0.5, currentTableY);
                            ctx.stroke();
                        }
                        break;
                }
                return blockHeight;
            }

            _showAppError(message) {
                const ctx = this.messageCtx;
                const canvas = this.messageCanvas;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 4;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.beginPath();
                ctx.roundRect(0, 0, canvas.width, canvas.height, 8);
                ctx.fill();
                ctx.restore();

                this._drawTextOnCanvas(ctx, message, canvas.width / 2, canvas.height / 2, '16px "Rodin", sans-serif', 'red', 'center', 'middle');
                this.messageCanvas.style.display = 'block';
                clearTimeout(this.errorTimer);
                this.errorTimer = setTimeout(() => {
                    this.messageCanvas.style.display = 'none';
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }, 5000);
            }

            async start() {
                this.injectStyles();
                this.loadTranslations();
                await document.fonts.load('1px "Rodin"', ' ');
                await document.fonts.ready;
                this.loadAudioSettings();
                this._initializeSounds();
                this._applyAudioSettings();

                const spritePromises = [];
                const loadSprite = (name, src) => {
                    return new Promise(resolve => {
                        const img = new Image();
                        img.onload = () => { this.sprites[name] = img; resolve(); };
                        img.onerror = () => {
                            console.error(`Failed to load sprite: ${src}`);
                            this.sprites[name] = null;
                            resolve();
                        };
                        img.src = src;
                    });
                };

                spritePromises.push(loadSprite('share', `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='black'%3E%3Cpath d='M18 16.08c-.76 0-1.44.3-1.96.78l-7.44-4.46c.06-.2.1-.4.1-.6s-.04-.4-.1-.6l7.44-4.46c.52.48 1.2.78 1.96.78 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .2.04.4.1.6L7.54 9.18c-.52-.48-1.2-.78-1.96-.78-1.66 0-3 1.34-3 3s1.34 3 3 3c.76 0 1.44-.3 1.96-.78l7.44 4.46c-.06.2-.1.4-.1.6 0 1.66 1.34 3 3 3s3-1.34 3-3-1.34-3-3-3z'/%3E%3C/svg%3E`));
                spritePromises.push(loadSprite('backArrow', `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cpath d='M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z'/%3E%3C/svg%3E`));
                spritePromises.push(loadSprite('checkmark', `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cpath d='M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z'/%3E%3C/svg%3E`));

                await Promise.all(spritePromises);

                this.topScreen = new TopScreen(this);
                this.bottomScreen = new BottomScreen({
                    onShare: () => this.handleShare(),
                    onCloseArticle: (isExit) => this.handleCloseArticle(isExit),
                    onAcceptArticle: () => this.showAcceptedView(),
                    sounds: this.sounds,
                    sprites: this.sprites,
                    appInstance: this
                });

                this.root.appendChild(this.topScreen.element);
                this.root.appendChild(this.bottomScreen.element);

                this.threeDSceneManager = new ThreeDSceneManager('myCanvas', this);
                this.threeDSceneManager.init();

                this.selectedArticle = { ...hardcodedArticle, read: false };

                setTimeout(() => {
                    this.topScreen.showArticleImage(this.selectedArticle.image);
                    this.bottomScreen.setView('article', { article: this.selectedArticle });

                    if (!this.selectedArticle.read) this.selectedArticle.read = true;

                    if (this.sounds.appLaunch) this.sounds.appLaunch.play();

                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'app-ready' }, '*');
                    } else {
                        console.warn('Not running in an iframe, cannot post message to parent.');
                    }
                }, 0);
            }

            handleCloseArticle(isExit = false) {
                if (this.threeDSceneManager) this.threeDSceneManager.dispose();

                this.bottomScreen.articleView.innerHTML = '';
                this.bottomScreen.htmlOverlay.innerHTML = '';
                this.topScreen.articleImageElement.src = '';

                this.messageCanvas.style.display = 'none';

                if (isExit) {
                    if (this.sounds.appExit) this.sounds.appExit.play();
                    this.topScreen.showArticleImage(this.selectedArticle.image);
                    this.bottomScreen.setView('article', { article: this.selectedArticle });
                }
            }

            handleShare() {
                if (!this.selectedArticle) return;
                if (this.sounds.shareConfirm) this.sounds.shareConfirm.play();

                try {
                    const url = `${window.location.origin}/contest/${this.selectedArticle.slug}`;
                    const tempInput = document.createElement('textarea');
                    tempInput.value = url;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempInput);
                    console.log(this.t('linkCopied'), url);
                } catch (e) {
                    console.error('Clipboard copy failed:', e);
                }
            }

            showAcceptedView() {
                this.bottomScreen.setView('accepted');
                this.topScreen.showThreeDScene();

                if (this.audioSettings.backgroundAudio && this.sounds.music) {
                    if (!this.sounds.music.playing()) {
                        this.sounds.music.play();
                        this.sounds.music.fade(0, 0.2 * this.audioSettings.volumeMultiplier.music, 3000);
                    }
                }
            }
