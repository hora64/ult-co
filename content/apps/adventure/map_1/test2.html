        document.addEventListener('DOMContentLoaded', () => {
            const app = new AnnouncementsApp('app-root');
            app.start();
        });
        class ThreeDSceneManager {
            constructor(canvasId, appInstance) {
                this.app = appInstance;
                this.canvas = document.getElementById(canvasId);
                if (!this.canvas) {
                    console.error(`3D Canvas element with ID '${canvasId}' not found!`);
                    return;
                }

                this.renderer = null;
                this.scene = null;
                this.camera = null;
                this.loadedModels = [];
                this.mainFFLMaterial = null;
                this.activeMixer = null;
                this.activeActions = [];
                this.currentLoopMode = THREE.LoopOnce;
                this.clock = new THREE.Clock();
                this.animationFrameId = null;

                this.cameraPositions = {
                    default: {
                        position: new THREE.Vector3(12, 10.5, -1.5),
                        lookAt: new THREE.Vector3(5, 10.5, -1.5)
                    }
                };

                this.loadModel = this.loadModel.bind(this);
                this.setupBlobShadowForModel = this.setupBlobShadowForModel.bind(this);
                this.convertMaterials = this.convertMaterials.bind(this);
                this.animationLoop = this.animationLoop.bind(this);
                this.setCameraPosition = this.setCameraPosition.bind(this);
            }

            init() {
                if (!this.canvas) return;

                this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, alpha: true });
                this.renderer.setSize(this.canvas.width, this.canvas.height, false);

                this.scene = new THREE.Scene();

                const focalLength = 35;
                const sensorHeight = 24;
                const fov = 2 * Math.atan((sensorHeight / 2) / focalLength) * (180 / Math.PI);

                this.camera = new THREE.PerspectiveCamera(fov, this.canvas.width / this.canvas.height, 0.1, 1000);
                this.setCameraPosition('default');

                this.scene.add(new THREE.AmbientLight(0xffffff, 0.8));
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
                dirLight.position.set(5, 10, 7.5);
                this.scene.add(dirLight);
                const pointLight = new THREE.PointLight(0xffffff, 15);
                this.camera.add(pointLight);
                this.scene.add(this.camera);

                const planeGeometry = new THREE.PlaneGeometry(20, 20);
                const planeMaterial = new THREE.MeshStandardMaterial({ color: 0xcccccc, side: THREE.DoubleSide });
                const plane = new THREE.Mesh(planeGeometry, planeMaterial);
                plane.rotation.x = -Math.PI / 2;
                this.scene.add(plane);

                this.loadModel('models/flag.glb', 'display', {
                    position: { x: 0, y: 0, z: 0 },
                    scale: 2.0,
                    shadow: {}
                });

                this.renderer.setAnimationLoop(() => this.animationLoop());
            }

            dispose() {
                if (this.animationFrameId) {
                    this.renderer.setAnimationLoop(null);
                    this.animationFrameId = null;
                }

                if (this.scene) {
                    this.scene.traverse((object) => {
                        if (object.isMesh) {
                            if (object.geometry) object.geometry.dispose();
                            if (object.material) {
                                if (Array.isArray(object.material)) {
                                    object.material.forEach(material => material.dispose());
                                } else {
                                    object.material.dispose();
                                }
                            }
                        }
                    });
                    this.scene.clear();
                    this.scene = null;
                }

                if (this.renderer) {
                    this.renderer.dispose();
                    this.renderer = null;
                }

                this.loadedModels = [];
                this.mainFFLMaterial = null;
                this.activeMixer = null;
                this.activeActions = [];
                console.log("Three.js scene disposed.");
            }

            setCameraPosition(positionKey) {
                const pos = this.cameraPositions[positionKey];
                if (pos && this.camera) {
                    this.camera.position.copy(pos.position);
                    this.camera.lookAt(pos.lookAt);
                    this.camera.updateProjectionMatrix();
                } else {
                    console.warn(`Camera position key '${positionKey}' not found or camera not initialized.`);
                }
            }

            loadModel(modelPath, id, options = {}) {
                const loader = new GLTFLoader();
                loader.load(modelPath, async (gltf) => {
                    const modelObject = gltf.scene;
                    const gltfTextures = await gltf.parser.getDependencies('texture');
                    console.log(`Loaded ${modelPath}`);

                    if (options.position) modelObject.position.set(options.position.x || 0, options.position.y || 0, options.position.z || 0);
                    if (options.scale) {
                        if (typeof options.scale === 'number') modelObject.scale.set(options.scale, options.scale, options.scale);
                        else modelObject.scale.set(options.scale.x || 1, options.scale.y || 1, options.scale.z || 1);
                    }
                    if (options.rotation) modelObject.rotation.set(options.rotation.x || 0, options.rotation.y || 0, options.rotation.z || 0);

                    const existingIndex = this.loadedModels.findIndex(item => item.id === id);
                    if (existingIndex !== -1) {
                        this.scene.remove(this.loadedModels[existingIndex].model);
                        if (this.loadedModels[existingIndex].shadow) this.loadedModels[existingIndex].shadow.dispose();
                        if (this.loadedModels[existingIndex].mixer) this.loadedModels[existingIndex].mixer.uncacheRoot(this.loadedModels[existingIndex].model);
                        this.loadedModels.splice(existingIndex, 1);
                        console.log(`Replaced model with ID '${id}'`);
                    } else {
                        console.log(`Added model with ID '${id}'`);
                    }

                    let mixer = null;
                    let actions = [];
                    if (gltf.animations && gltf.animations.length) {
                        mixer = new THREE.AnimationMixer(modelObject);
                        gltf.animations.forEach((clip) => {
                            const action = mixer.clipAction(clip);
                            action.setLoop(this.currentLoopMode, this.currentLoopMode === THREE.LoopOnce ? 1 : Infinity);
                            action.clampWhenFinished = (this.currentLoopMode === THREE.LoopOnce);
                            actions.push(action);
                        });
                        this.activeMixer = mixer;
                        this.activeActions = actions;
                        console.log(`Found ${gltf.animations.length} animations.`);
                    } else {
                        this.activeMixer = null;
                        this.activeActions = [];
                        console.log("No animations found for this model.");
                    }

                    if (id === 'display') {
                        this.convertMaterials(modelObject, gltfTextures);
                        modelObject.traverse((child) => {
                            if (child.isMesh && child.material instanceof FFLShaderMaterial) {
                                this.mainFFLMaterial = child.material;
                            } else if (child.isMesh && Array.isArray(child.material)) {
                                const fflMat = child.material.find(mat => mat instanceof FFLShaderMaterial);
                                if (fflMat) this.mainFFLMaterial = fflMat;
                            }
                        });
                        if (!this.mainFFLMaterial) {
                            console.warn("No FFLShaderMaterial found on the main model after conversion.");
                        } else {
                            this.mainFFLMaterial.emblemScale = 2.0;
                            console.log('Emblem scale set to fixed value of 2.0.');
                            this.mainFFLMaterial.brightness = 0.7;
                            console.log('Main FFLMaterial brightness set to 0.7.');

                            this.mainFFLMaterial.map2 = new THREE.TextureLoader().load('https://placehold.co/64x64/000000/FFFFFF?text=Default');
                        }
                    } else {
                        modelObject.traverse((child) => {
                            if (child.isMesh && child.material) {
                                const oldMaterials = Array.isArray(child.material) ? child.material : [child.material];
                                child.material = oldMaterials.map(mat => {
                                    return new THREE.MeshStandardMaterial({
                                        color: mat.color, map: mat.map, transparent: mat.transparent,
                                        opacity: mat.opacity, side: mat.side
                                    });
                                });
                                if (!Array.isArray(child.material)) child.material = child.material[0];
                            }
                        });
                    }

                    const newModelEntry = {
                        id, model: modelObject, textures: gltfTextures,
                        path: modelPath, mixer, actions
                    };
                    this.loadedModels.push(newModelEntry);

                    this.scene.add(modelObject);

                    if (options.shadow) this.setupBlobShadowForModel(modelObject, id, options.shadow);
                }, undefined, (err) => {
                    console.error(`Failed to load ${modelPath}`, err);
                    this.app._showAppError(`Failed to load model: ${err.message}. Please try another file.`);
                });
            }

            setupBlobShadowForModel(modelObject, id, shadowOptions = {}) {
                if (!modelObject) return;
                const modelEntry = this.loadedModels.find(entry => entry.id === id);
                if (!modelEntry) return;

                if (modelEntry.shadow) modelEntry.shadow.dispose();

                const box = new THREE.Box3().setFromObject(modelObject);
                const size = box.getSize(new THREE.Vector3());
                const modelBaseSize = Math.max(size.x, size.z);
                const modelHeight = size.y;

                const effectiveShadowRadius = (shadowOptions.radius ?? 0.05) * modelBaseSize;
                const effectiveShadowPlaneSize = (shadowOptions.shadowSize ?? 1.5) * modelBaseSize;
                const effectiveFadeDistance = (shadowOptions.fadeDistance ?? 1) * modelHeight;

                const shadowInstance = createBlobShadow(modelObject, this.scene, {
                    color: shadowOptions.color || 0x000000,
                    opacity: shadowOptions.opacity || 0.5,
                    shadowRadius: effectiveShadowRadius,
                    falloff: shadowOptions.falloff || 1.0,
                    shadowPlaneSize: effectiveShadowPlaneSize
                });

                modelEntry.shadow = shadowInstance;
            }

            convertMaterials(model, gltfTextures = []) {
                if (!model) return;

                let convertedCount = 0;
                let textureIndex = 0;

                model.traverse((child) => {
                    if (child.isMesh && child.material) {
                        const oldMaterials = Array.isArray(child.material) ? child.material : [child.material];
                        const newMaterials = oldMaterials.map((oldMat) => {
                            let usedTexture = oldMat.map || (gltfTextures.length > 0 ? gltfTextures[textureIndex % gltfTextures.length] : null);
                            textureIndex++;

                            if (typeof FFLShaderMaterial === 'undefined') {
                                console.error("FFLShaderMaterial is not defined. Make sure FFLShaderMaterial.js is loaded correctly.");
                                return oldMat;
                            }

                            const shaderMat = new FFLShaderMaterial({
                                map: usedTexture || null, color: new THREE.Color(0xAAAAAA),
                                opacity: oldMat.opacity ?? 1.0, lightEnable: true,
                                modulateMode: usedTexture ? 1 : 0,
                                transparent: oldMat.transparent || false, side: oldMat.side || THREE.FrontSide
                            });

                            shaderMat.brightness = FFLShaderMaterial.defaultBrightness;
                            shaderMat.gamma = FFLShaderMaterial.defaultGamma;
                            shaderMat.ambientIntensity = FFLShaderMaterial.defaultAmbientIntensity;
                            shaderMat.diffuseIntensity = FFLShaderMaterial.defaultDiffuseIntensity;
                            shaderMat.uniforms.u_rim_power.value = FFLShaderMaterial.defaultRimPower;

                            if (usedTexture) {
                                shaderMat.map = usedTexture;
                                shaderMat.map.needsUpdate = true;
                                shaderMat.defines = shaderMat.defines || {};
                                shaderMat.defines.USE_MAP = '';
                            }

                            convertedCount++;
                            return shaderMat;
                        });
                        child.material = Array.isArray(child.material) ? newMaterials : newMaterials[0];
                    }
                });
                console.log(`Converted ${convertedCount} materials to FFLShaderMaterial for model.`);
            }

            animationLoop() {
                const delta = this.clock.getDelta();
                const elapsedTime = this.clock.getElapsedTime();

                this.loadedModels.forEach(modelEntry => {
                    if (modelEntry.shadow) modelEntry.shadow.update();
                });

                if (this.activeMixer) this.activeMixer.update(delta);

                if (this.mainFFLMaterial) this.mainFFLMaterial.time = elapsedTime;

                this.renderer.render(this.scene, this.camera);
            }
        }

    </script>
