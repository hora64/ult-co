        /**
         * A base class for creating UI components. Provides a helper for creating DOM elements.
         */
        class UIComponent {
            constructor() {
                this.element = null;
            }

            /**
             * Creates a new DOM element with specified tag, class, and inner HTML.
             * @param {string} tag - The HTML tag name (e.g., 'div', 'button').
             * @param {string} className - The CSS class name(s) to apply.
             * @param {string} [innerHTML=''] - The inner HTML content of the element.
             * @returns {HTMLElement} The created DOM element.
             */
            createElement(tag, className, innerHTML = '') {
                const el = document.createElement(tag);
                if (className) el.className = className;
                if (innerHTML) el.innerHTML = innerHTML;
                return el;
            }
        }

        /**
         * Manages the top screen of the app, which displays the product image or the 3D scene.
         */
        class TopScreen extends UIComponent {
            /**
             * @param {UltStoreApp} appInstance - The main app instance.
             */
            constructor(appInstance) {
                super();
                this.app = appInstance;
                this.element = this.createElement('div', 'top-screen');

                this.productImageElement = this.createElement('img', 'product-image');
                this.element.appendChild(this.productImageElement);

                // Three.js canvas
                this.threeDCanvas = this.createElement('canvas', 'three-d-canvas');
                this.threeDCanvas.id = 'myCanvas'; // Match ID used in ThreeDSceneManager
                this.threeDCanvas.width = 400;
                this.threeDCanvas.height = 240;
                this.element.appendChild(this.threeDCanvas);

                // Canvases for product title and meta (moved here)
                this.productNameCanvas = this.createElement('canvas', 'top-screen-product-name');
                this.productNameCanvas.width = 300; // Adjusted width for top screen
                this.productNameCanvas.height = 48;
                this.element.appendChild(this.productNameCanvas);

                this.productPriceCanvas = this.createElement('canvas', 'top-screen-product-price');
                this.productPriceCanvas.width = 300; // Adjusted width for top screen
                this.productPriceCanvas.height = 20;
                this.element.appendChild(this.productPriceCanvas);

                this.productMetaCanvas = this.createElement('canvas', 'top-screen-product-meta');
                this.productMetaCanvas.width = 300; // Adjusted width for top screen
                this.productMetaCanvas.height = 20;
                this.element.appendChild(this.productMetaCanvas);

                // Initially hide these canvases
                this.productNameCanvas.style.display = 'none';
                this.productPriceCanvas.style.display = 'none';
                this.productMetaCanvas.style.display = 'none';
            }

            /**
             * Displays the product image on the top screen.
             * @param {string} imageUrl - The URL of the image to display.
             */
            showProductImage(imageUrl) {
                this.productImageElement.src = imageUrl;
                this.productImageElement.style.opacity = '1';
                this.productImageElement.style.display = 'block';
                this.threeDCanvas.style.display = 'none'; // Hide 3D canvas
                this.productNameCanvas.style.display = 'none'; // Hide product name
                this.productPriceCanvas.style.display = 'none'; // Hide product price
                this.productMetaCanvas.style.display = 'none'; // Hide product meta
            }

            /**
             * Shows the 3D scene on the top screen.
             */
            showThreeDScene() {
                this.productImageElement.style.display = 'none'; // Hide product image
                this.threeDCanvas.style.display = 'block'; // Show 3D canvas
                this.productNameCanvas.style.display = 'none'; // Hide product name
                this.productPriceCanvas.style.display = 'none'; // Hide product price
                this.productMetaCanvas.style.display = 'none'; // Hide product meta
            }

            /**
             * Draws product name on the top screen canvas.
             * @param {string} name - The product name.
             * @param {string} font - The font style.
             * @param {string} color - The text color.
             */
            drawProductName(name, font, color) {
                const ctx = this.productNameCanvas.getContext('2d');
                ctx.clearRect(0, 0, this.productNameCanvas.width, this.productNameCanvas.height);
                const maxNameWidth = this.productNameCanvas.width - 20; // Add some padding
                let measuredNameHeight = this.app._estimateTextHeight(font, name, maxNameWidth, 1.2);
                let textY = (this.productNameCanvas.height - measuredNameHeight) / 2;
                this.app._drawTextOnCanvas(ctx, name, 10, textY, font, color, 'left', 'top', maxNameWidth, 1.2);
                this.productNameCanvas.style.display = 'block';
            }

            /**
             * Draws product price on the top screen canvas.
             * @param {string} price - The product price.
             * @param {string} font - The font style.
             * @param {string} color - The text color.
             */
            drawProductPrice(price, font, color) {
                const ctx = this.productPriceCanvas.getContext('2d');
                ctx.clearRect(0, 0, this.productPriceCanvas.width, this.productPriceCanvas.height);
                this.app._drawTextOnCanvas(ctx, price, 10, this.productPriceCanvas.height / 2, font, color, 'left', 'middle');
                this.productPriceCanvas.style.display = 'block';
            }

            /**
             * Draws product meta (author) on the top screen canvas.
             * @param {string} metaText - The meta text.
             * @param {string} font - The font style.
             * @param {string} color - The text color.
             */
            drawProductMeta(metaText, font, color) {
                const ctx = this.productMetaCanvas.getContext('2d');
                ctx.clearRect(0, 0, this.productMetaCanvas.width, this.productMetaCanvas.height);
                this.app._drawTextOnCanvas(ctx, metaText, 10, this.productMetaCanvas.height / 2, font, color, 'left', 'middle');
                this.productMetaCanvas.style.display = 'block';
            }
        }

        /**
         * Implements a custom scrollbar for a given scrollable container.
         * Renders the scrollbar visually on a canvas and handles drag interactions.
         */
        class Scrollbar extends UIComponent {
            /**
             * @param {HTMLElement} scrollableContainer - The DOM element to attach the scrollbar to.
             * @param {UltStoreApp} appInstance - The main app instance for sound playback.
             */
            constructor(scrollableContainer, appInstance) {
                super();
                this.container = scrollableContainer;
                this.app = appInstance;
                this.element = document.createElement('canvas');
                this.element.className = 'custom-scrollbar';
                this.ctx = this.element.getContext('2d');
                this.ctx.imageSmoothingEnabled = false; // For crisp lines
                this.isDragging = false;
                this.startY = 0;
                this.startScrollTop = 0;
                this.lastScrollTop = this.container.scrollTop; // Track last scroll position for sound
                this.scrollSoundTimeout = null; // Debounce for scroll sound

                // Mouse event listeners for desktop dragging
                this.element.addEventListener('mousedown', this.onThumbMouseDown.bind(this));
                document.addEventListener('mousemove', this.onThumbMouseMove.bind(this));
                document.addEventListener('mouseup', this.onThumbMouseUp.bind(this));

                // Touch event listeners for mobile dragging
                this.element.addEventListener('touchstart', this.onThumbTouchStart.bind(this), { passive: false });
                document.addEventListener('touchmove', this.onThumbTouchMove.bind(this), { passive: false });
                document.addEventListener('touchend', this.onThumbTouchEnd.bind(this));

                // Listen for container's scroll events to update scrollbar position
                this.container.addEventListener('scroll', () => this.update());
                // Listen for window resize to adjust scrollbar dimensions
                window.addEventListener('resize', () => this.update());

                // Observe changes in the container's children or attributes to update scrollbar
                const observer = new MutationObserver(() => this.update());
                observer.observe(this.container, { childList: true, subtree: true, characterData: true, attributes: true });

                this.update(); // Initial update to draw the scrollbar
            }

            /**
             * Handles mouse down event on the scrollbar thumb.
             * Initiates dragging.
             * @param {MouseEvent} e - The mouse event.
             */
            onThumbMouseDown(e) {
                this.isDragging = true;
                this.startY = e.clientY;
                this.startScrollTop = this.container.scrollTop;
                this.element.style.cursor = 'grabbing';
            }

            /**
             * Handles mouse move event while dragging the scrollbar thumb.
             * Updates the container's scroll position.
             * @param {MouseEvent} e - The mouse event.
             */
            onThumbMouseMove(e) {
                if (!this.isDragging) return;
                e.preventDefault(); // Prevent default browser scrolling
                const dy = e.clientY - this.startY;
                const scrollRatio = this.container.scrollHeight / this.container.clientHeight;
                this.container.scrollTop = this.startScrollTop + (dy * scrollRatio);
            }

            /**
             * Handles mouse up event, ending the scrollbar dragging.
             */
            onThumbMouseUp() {
                this.isDragging = false;
                this.element.style.cursor = 'grab';
            }

            /**
             * Handles touch start event on the scrollbar thumb.
             * Initiates dragging for touch devices.
             * @param {TouchEvent} e - The touch event.
             * @returns {void}
             */
            onThumbTouchStart(e) {
                this.isDragging = true;
                this.startY = e.touches[0].clientY;
                this.startScrollTop = this.container.scrollTop;
                this.element.style.cursor = 'grabbing';
                e.preventDefault(); // Prevent default browser scrolling
            }

            /**
             * Handles touch move event while dragging the scrollbar thumb on touch devices.
             * Updates the container's scroll position.
             * @param {TouchEvent} e - The touch event.
             * @returns {void}
             */
            onThumbTouchMove(e) {
                if (!this.isDragging) return;
                e.preventDefault(); // Prevent default browser scrolling
                const dy = e.touches[0].clientY - this.startY;
                const scrollRatio = this.container.scrollHeight / this.container.clientHeight;
                this.container.scrollTop = this.startScrollTop + (dy * scrollRatio);
            }

            /**
             * Handles touch end event, ending the scrollbar dragging for touch devices.
             */
            onThumbTouchEnd() {
                this.isDragging = false;
                this.element.style.cursor = 'grab';
            }

            /**
             * Draws the scrollbar track and thumb on the canvas.
             * @param {number} viewHeight - The visible height of the scrollable area.
             * @param {number} contentHeight - The total scrollable height of the content.
             * @param {number} thumbHeight - The calculated height of the scrollbar thumb.
             * @param {number} thumbY - The Y position of the scrollbar thumb.
             */
            drawScrollbar(viewHeight, contentHeight, thumbHeight, thumbY) {
                const canvas = this.element;
                const ctx = this.ctx;
                const trackWidth = 8; // Width of the scrollbar track
                const thumbWidth = 6; // Width of the scrollbar thumb
                const borderRadius = 3; // Border radius for the thumb

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw scrollbar track
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(canvas.width - trackWidth, 0, trackWidth, canvas.height);

                // Draw scrollbar thumb
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                const thumbX = canvas.width - trackWidth + (trackWidth - thumbWidth) / 2;

                // Draw rounded rectangle for the thumb using arcTo for smooth corners
                ctx.moveTo(thumbX + borderRadius, thumbY);
                ctx.lineTo(thumbX + thumbWidth - borderRadius, thumbY);
                ctx.arcTo(thumbX + thumbWidth, thumbY, thumbX + thumbWidth, thumbY + borderRadius, borderRadius);
                ctx.lineTo(thumbX + thumbWidth, thumbY + thumbHeight - borderRadius);
                ctx.arcTo(thumbX + thumbWidth, thumbY + thumbHeight, thumbX + thumbWidth - borderRadius, thumbY + thumbHeight, borderRadius);
                ctx.lineTo(thumbX + borderRadius, thumbY + thumbHeight);
                ctx.arcTo(thumbX, thumbY + thumbHeight, thumbX, thumbY + thumbHeight - borderRadius, borderRadius);
                ctx.lineTo(thumbX, thumbY + borderRadius);
                ctx.arcTo(thumbX, thumbY, thumbX + borderRadius, thumbY, borderRadius);
                ctx.closePath();
                ctx.fill();
            }

            /**
             * Updates the scrollbar's position and visibility based on the container's scroll state.
             * Plays a scroll sound with debouncing.
             */
            update() {
                requestAnimationFrame(() => {
                    const viewHeight = this.container.clientHeight;
                    const contentHeight = this.container.scrollHeight;
                    this.element.height = viewHeight;
                    this.element.width = 14; // Fixed width for the scrollbar canvas
                    // Hide scrollbar if content is not scrollable
                    this.element.style.visibility = contentHeight > viewHeight ? 'visible' : 'hidden';

                    // Position the scrollbar canvas correctly within its parent
                    this.element.style.position = 'absolute';
                    this.element.style.top = '0px';
                    this.element.style.bottom = '0px';
                    this.element.style.right = '0px';

                    // Calculate thumb height and position
                    const thumbHeight = Math.max(20, viewHeight * (viewHeight / contentHeight));
                    const scrollPercentage = contentHeight > viewHeight ? this.container.scrollTop / (contentHeight - viewHeight) : 0;
                    const thumbY = scrollPercentage * (viewHeight - thumbHeight);

                    // Play scroll sound if scrolling and not currently debounced
                    const newScrollTop = this.container.scrollTop;
                    if (this.app && this.app.sounds.scroll && this.lastScrollTop !== undefined && newScrollTop !== this.lastScrollTop) {
                        if (!this.scrollSoundTimeout) {
                            // this.app.sounds.scroll.play(); // Commented out as the sound asset is missing
                            this.scrollSoundTimeout = setTimeout(() => {
                                this.scrollSoundTimeout = null;
                            }, 100); // Debounce for 100ms
                        }
                    }
                    this.lastScrollTop = newScrollTop;

                    this.drawScrollbar(viewHeight, contentHeight, thumbHeight, thumbY);
                });
            }
        }

        /**
         * Helper class to measure text width and height on a temporary canvas context.
         */
        class TextCanvasMeasurer {
            constructor() {
                if (!TextCanvasMeasurer.instance) {
                    this._canvas = document.createElement('canvas');
                    this._ctx = this._canvas.getContext('2d');
                    this._ctx.imageSmoothingEnabled = false; // Disable anti-aliasing for accurate pixel measurements
                    TextCanvasMeasurer.instance = this;
                }
                return TextCanvasMeasurer.instance;
            }

            /**
             * Measures the width of a given text with a specific font.
             * @param {string} text - The text to measure.
             * @param {string} font - The font style string (e.g., '14px "Rodin", sans-serif').
             * @returns {TextMetrics} The TextMetrics object.
             */
            measureText(text, font) {
                this._ctx.font = font;
                return this._ctx.measureText(text);
            }

            /**
             * Estimates the total height required to wrap text within a given maximum width.
             * @param {string} text - The text to measure.
             * @param {string} font - The font style string.
             * @param {number} maxWidth - The maximum width for text wrapping. Use Infinity for no wrapping.
             * @param {number} [lineSpacingFactor=1.0] - Multiplier for line height.
             * @returns {number} The estimated total height in pixels.
             */
            estimateWrappedTextHeight(text, font, maxWidth, lineSpacingFactor = 1.0) {
                this._ctx.font = font;
                const tempMetrics = this._ctx.measureText('M'); // Measure a single character to get approximate line height
                const actualLineHeight = (tempMetrics.actualBoundingBoxAscent || 0) + (tempMetrics.actualBoundingBoxDescent || 0);

                if (maxWidth === Infinity) {
                    return actualLineHeight * lineSpacingFactor;
                }

                const words = text.split(' ');
                let line = '';
                let totalHeight = 0;
                for (let n = 0; n < words.length; n++) {
                    let testLine = line + (n > 0 ? ' ' : '') + words[n];
                    let metrics = this._ctx.measureText(testLine);
                    let testWidth = metrics.width;

                    if (testWidth > maxWidth && line.length > 0) {
                        totalHeight += actualLineHeight * lineSpacingFactor;
                        line = words[n];
                    } else {
                        line = testLine;
                    }
                }
                totalHeight += actualLineHeight * lineSpacingFactor; // Add height for the last line
                return totalHeight;
            }
        }

        /**
         * Manages loading and caching of images to prevent redundant fetches.
         */
        class ImageManager {
            constructor() {
                this.cache = new Map(); // Cache to store loaded images
            }

            /**
             * Loads an image and caches it. Returns a Promise that resolves with the Image object.
             * @param {string} url - The URL of the image.
             * @returns {Promise<HTMLImageElement|null>} A promise that resolves with the Image object or null if loading fails.
             */
            loadImage(url) {
                if (this.cache.has(url)) {
                    return Promise.resolve(this.cache.get(url));
                }
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous"; // Required for loading images from other origins onto canvas
                    img.onload = () => {
                        this.cache.set(url, img);
                        resolve(img);
                    };
                    img.onerror = () => {
                        console.error(`Failed to load image: ${url}`);
                        this.cache.set(url, null); // Cache null to avoid retrying failed images
                        resolve(null);
                    };
                    img.src = url;
                });
            }

            /**
             * Retrieves a cached image.
             * @param {string} url - The URL of the image.
             * @returns {HTMLImageElement|null} The cached Image object or null if not found.
             */
            getImage(url) {
                return this.cache.get(url) || null;
            }

            /**
             * Loads all images referenced within a list of content blocks.
             * @param {Array<object>} blocks - An array of parsed content blocks.
             * @returns {Promise<void>} A promise that resolves when all images are attempted to be loaded.
             */
            async loadImagesFromBlocks(blocks) {
                const mediaUrls = new Set();
                blocks.forEach(block => {
                    if (block.type === 'image') {
                        mediaUrls.add(block.url);
                    } else if (block.type === 'embed' && block.service === 'youtube') {
                        // Use YouTube thumbnail for embeds
                        mediaUrls.add(`https://img.youtube.com/vi/${block.id}/0.jpg`);
                    }
                });
                const promises = Array.from(mediaUrls).map(url => this.loadImage(url));
                await Promise.all(promises); // Wait for all images to attempt loading
            }
        }

        /**
         * Manages the display and switching of different pages/views in the application.
         */
        class PageViewManager extends UIComponent {
            /**
             * @param {HTMLElement} rootElement - The main container for all pages.
             * @param {TopScreen} topScreen - The top screen instance to control its visibility.
             */
            constructor(rootElement, topScreen) {
                super();
                this.root = rootElement;
                this.topScreen = topScreen;
                this.pages = new Map();
                this.currentPage = null;

                // Create a container for the pages within the root, below the top screen
                this.pagesContainer = this.createElement('div', 'pages-container');
                this.root.appendChild(this.pagesContainer);
            }

            /**
             * Registers a page component with the manager.
             * @param {string} id - A unique ID for the page.
             * @param {UIComponent} pageInstance - The instance of the page component.
             */
            registerPage(id, pageInstance) {
                this.pages.set(id, pageInstance);
                // All pages are initially hidden
                pageInstance.element.classList.add('view');
                this.pagesContainer.appendChild(pageInstance.element);
            }

            /**
             * Shows a specific page by its ID and hides the currently active page.
             * @param {string} id - The ID of the page to show.
             * @param {object} [data={}] - Data to pass to the page's render method.
             */
            showPage(id, data = {}) {
                const nextPage = this.pages.get(id);
                if (!nextPage) {
                    console.error(`Page with ID '${id}' not found.`);
                    return;
                }

                if (this.currentPage && this.currentPage !== nextPage) {
                    this.currentPage.element.classList.remove('active');
                }

                this.currentPage = nextPage;
                this.currentPage.element.classList.add('active');

                // Render the page with the provided data
                if (typeof this.currentPage.render === 'function') {
                    this.currentPage.render(data);
                }

                // Control TopScreen visibility based on the active page
                if (id === 'product-detail') {
                    this.topScreen.showProductImage(data.product?.image || 'https://placehold.co/400x240/ADD8E6/000000?text=Default+Image');
                    this.topScreen.drawProductName(data.product?.name || '', 'bold 20px "Rodin", sans-serif', 'black');
                    this.topScreen.drawProductPrice(data.product?.price || '', 'bold 16px "Rodin", sans-serif', this.app.cssVars['--ds-accent-blue']);
                    this.topScreen.drawProductMeta(this.app.t('byAuthor', { author: data.product?.author || '' }), '12px "Rodin", sans-serif', this.app.cssVars['--ds-text-subtle']);
                } else if (id === 'purchase-confirmation') {
                    this.topScreen.showThreeDScene();
                } else if (id === 'storefront' || id === 'cart') {
                    // For storefront and cart, show 3D scene
                    this.topScreen.showThreeDScene();
                    // Hide product name/price/meta canvases when not on product detail page
                    this.topScreen.productNameCanvas.style.display = 'none';
                    this.topScreen.productPriceCanvas.style.display = 'none';
                    this.topScreen.productMetaCanvas.style.display = 'none';
                }
            }
        }

            /**
             * Renders the storefront with product cards.
             * @param {object} data - Contains the list of products.
             */
            render(data) {
                this.productsGrid.innerHTML = ''; // Clear previous products
                const products = data.products || [];

                // Re-append scrollbar element as innerHTML clears it
                this.productsGrid.appendChild(this.storefrontScrollbar.element);

                // Update cart button text
                this.cartButton.updateText(this.app.t('viewCart', { count: this.app.cart.length }));

                // Draw header text
                const headerCanvas = this.element.querySelector('.storefront-header-canvas');
                const headerCtx = headerCanvas.getContext('2d');
                headerCtx.clearRect(0, 0, headerCanvas.width, headerCanvas.height);
                this.app._drawTextOnCanvas(headerCtx, this.app.appLabel, headerCanvas.width / 2, headerCanvas.height / 2, 'bold 18px "Rodin", sans-serif', 'black', 'center', 'middle');


                if (products.length === 0) {
                    const noProductsMessage = this.createElement('p', 'text-center text-gray-500 mt-8', 'No products available.');
                    this.productsGrid.appendChild(noProductsMessage);
                    return;
                }

                products.forEach(product => {
                    const productCard = this.app._createCanvasButton({
                        text: `${product.name}\n${product.price}`, // Multi-line text
                        sprite: null, // Image will be drawn separately
                        width: 140, height: 160, textColor: 'black', font: '14px "Rodin", sans-serif',
                        textAlign: 'center', textBaseline: 'bottom',
                        onClick: () => this.onViewProduct(product),
                        className: 'product-card',
                        backgroundColor: '#FFFFFF', activeBackgroundColor: '#F0F0F0',
                        borderRadius: 8,
                        shadowOffset: { x: 0, y: 4, blur: 8, color: 'rgba(0,0,0,0.15)' }
                    });

                    // Custom drawing for product card to include image
                    const cardCanvas = productCard.querySelector('canvas');
                    const cardCtx = cardCanvas.getContext('2d');
                    cardCtx.imageSmoothingEnabled = false;

                    const drawProductCardContent = async () => {
                        cardCtx.clearRect(0, 0, cardCtx.canvas.width, cardCtx.canvas.height);
                        // Draw background and shadow (handled by _createCanvasButton)

                        // Draw product image
                        const img = await this.app.imageManager.loadImage(product.image);
                        if (img && img.complete) {
                            const imgWidth = cardCtx.canvas.width - 20; // 10px padding on each side
                            const imgHeight = imgWidth * (img.height / img.width);
                            cardCtx.drawImage(img, 10, 10, imgWidth, imgHeight);
                        } else {
                            // Fallback if image fails to load
                            cardCtx.fillStyle = '#E0E0E0';
                            cardCtx.fillRect(10, 10, cardCtx.canvas.width - 20, cardCtx.canvas.width * (3/4) - 20); // Placeholder box
                            this.app._drawTextOnCanvas(cardCtx, 'Image N/A', cardCtx.canvas.width / 2, cardCtx.canvas.height / 2 - 20, '12px "Rodin", sans-serif', '#888888', 'center', 'middle');
                        }

                        // Draw product name and price
                        this.app._drawTextOnCanvas(cardCtx, product.name, cardCtx.canvas.width / 2, cardCtx.canvas.height - 40, 'bold 14px "Rodin", sans-serif', 'black', 'center', 'bottom', cardCtx.canvas.width - 20, 1.2);
                        this.app._drawTextOnCanvas(cardCtx, product.price, cardCtx.canvas.width / 2, cardCtx.canvas.height - 15, 'bold 16px "Rodin", sans-serif', this.app.cssVars['--ds-accent-blue'], 'center', 'bottom');
                    };

                    drawProductCardContent();
                    productCard.addEventListener('mouseenter', drawProductCardContent); // Redraw on hover to ensure image is there
                    productCard.addEventListener('mouseleave', drawProductCardContent); // Redraw on hover to ensure image is there

                    this.productsGrid.appendChild(productCard);
                });
                this.storefrontScrollbar.update(); // Update scrollbar after content is rendered
            }
        }

            /**

             * @param {object} data - Contains the product object.
             */
            async render(data) {
                const product = data.product;
                if (!product) return;
                this.currentProduct = product; // Store current product for add to cart button

                // Clear any previous HTML elements from the overlay
                this.htmlOverlay.innerHTML = '';
                this.app.hyperlinks = []; // Clear old links
                this.app.checkboxes = []; // Clear old checkboxes

                // Remove previous click listener to prevent multiple bindings
                if (this._productClickListener) {
                    this.productContentCanvas.removeEventListener('click', this._productClickListener);
                }
                // Add a new click listener for interactive elements on the canvas
                this._productClickListener = this.handleProductCanvasClick.bind(this); // Ensure 'this' context is correct
                this.productContentCanvas.addEventListener('click', this._productClickListener);

                // Draw header background (still needed for visual separation)
                const headerBackgroundCanvas = this.element.querySelector('.header-background-canvas');
                const headerBackgroundCtx = headerBackgroundCanvas.getContext('2d');
                headerBackgroundCtx.clearRect(0, 0, headerBackgroundCanvas.width, headerBackgroundCanvas.height);
                headerBackgroundCtx.fillStyle = '#E8D8C0'; // Solid color
                headerBackgroundCtx.save();
                headerBackgroundCtx.shadowColor = 'rgba(0,0,0,0.1)';
                headerBackgroundCtx.shadowBlur = 5;
                headerBackgroundCtx.shadowOffsetX = 0;
                headerBackgroundCtx.shadowOffsetY = 2;
                headerBackgroundCtx.beginPath();
                headerBackgroundCtx.roundRect(0, 0, headerBackgroundCanvas.width, headerBackgroundCanvas.height, {
                    topLeft: 0, topRight: 0, bottomRight: 6, bottomLeft: 6
                });
                headerBackgroundCtx.fill();
                headerBackgroundCtx.restore();
                headerBackgroundCtx.strokeStyle = '#cccccc';
                headerBackgroundCtx.lineWidth = 1;
                headerBackgroundCtx.beginPath();
                headerBackgroundCtx.moveTo(0, headerBackgroundCanvas.height - 0.5);
                headerBackgroundCtx.lineTo(headerBackgroundCanvas.width, headerBackgroundCanvas.height - 0.5);
                headerBackgroundCtx.stroke();

                // Product name and meta are now drawn on TopScreen, not here.
                // This section is removed from ProductDetailPage render.

                // Draw product content
                await this.drawProductContent(product.content);
            }

            /**
             * Draws the product content onto the canvas, applying all formatting.
             * @param {string} text - The raw markdown-like text content of the product description.
             */
            async drawProductContent(text) {
                this.app.hyperlinks = []; // Clear existing hyperlinks and checkboxes before redrawing
                this.app.checkboxes = [];

                // Clear existing HTML overlay content
                this.htmlOverlay.innerHTML = '';

                // Parse the product content into structured blocks
                const contentBlocks = this.app._parseProductContent(text || "");
                // Preload all images found in the content blocks
                await this.app.imageManager.loadImagesFromBlocks(contentBlocks);

                const ctx = this.productContentCanvas.getContext('2d');
                const containerRect = this.scrollableCanvasWrapper.getBoundingClientRect();
                const horizontalPadding = 10; // Padding for the product content
                const verticalPadding = 10; // Padding for the product content
                const drawAreaWidth = this.app.productContentTextWidth - (horizontalPadding * 2); // Adjust draw area for padding

                // Calculate total height needed for the content
                let totalMeasuredHeight = verticalPadding; // Start with top padding
                for (const block of contentBlocks) {
                    totalMeasuredHeight += this.app._measureBlockHeight(ctx, block, drawAreaWidth) + (this.app.cssVars.blockSpacing || 10);
                }
                totalMeasuredHeight += verticalPadding; // Add bottom padding

                // Set canvas dimensions
                this.productContentCanvas.width = containerRect.width;
                this.productContentCanvas.height = Math.max(this.scrollableCanvasWrapper.clientHeight, totalMeasuredHeight);
                this.productContentCanvas.style.height = `${this.productContentCanvas.height}px`; // Apply height to CSS for scrolling

                // Clear the canvas
                ctx.clearRect(0, 0, this.productContentCanvas.width, this.productContentCanvas.height);

                // Draw the smooth background on the canvas
                ctx.fillStyle = '#FDFDFD'; // Solid white background
                ctx.fillRect(0, 0, this.productContentCanvas.width, this.productContentCanvas.height);

                // Draw each content block
                let currentY = verticalPadding; // Start drawing content after top padding
                ctx.textBaseline = 'top'; // Ensure text baseline is consistent
                for (const block of contentBlocks) {
                    const blockHeight = this.app._drawFormattedBlock(ctx, this.htmlOverlay, block, horizontalPadding, currentY, drawAreaWidth);
                    currentY += blockHeight + (this.app.cssVars.blockSpacing || 10);
                }

                // Update the custom scrollbar
                this.productScrollbar.update();
            }

            /**
             * Handles clicks on the product content canvas, specifically for hyperlinks.
             * @param {MouseEvent} e - The click event.
             */
            handleProductCanvasClick(e) {
                const canvas = this.productContentCanvas;
                const rect = canvas.getBoundingClientRect();
                const scrollOffset = this.scrollableCanvasWrapper.scrollTop;
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top + scrollOffset;

                // Find if a link was clicked
                const clickedLink = this.app.hyperlinks.find(link => {
                    return x >= link.rect.x && x <= link.rect.x + link.rect.width && y >= link.rect.y && y <= link.rect.y + link.rect.height;
                });

                if (clickedLink) {
                    const url = clickedLink.url;
                    // Handle YouTube video links by opening them in a new window
                    if (url.startsWith('youtube:')) {
                        const videoId = url.substring(8);
                        window.parent.postMessage({ type: 'open-url', url: `https://www.youtube.com/watch?v=${videoId}` }, '*');
                    } else {
                        // For other links, open the URL in a new window
                        window.parent.postMessage({ type: 'open-url', url: url }, '*');
                    }
                }
            }
        }

                this.firstShareDone = false; // Flag to trigger sparkle effect only once
                this.productContentTextWidth = 256; // Max width for product content text
                this.lineSpacingFactor = 1.5; // Line spacing for general product text

                this.dsContainerWidth = 320; // Fixed width of the bottom screen
                this.dsContainerHeight = 240; // Fixed height of the bottom screen

                // No explicit .bind(this) calls needed here for methods defined directly in the class,
                // as they are automatically bound to the instance when called via `this.methodName()`.
                // Only bind if passing as a callback where `this` context might be lost.
            }
            _drawTextOnCanvas(ctx, text, x, y, font, color, textAlign = 'left', textBaseline = 'alphabetic', maxWidth = Infinity, lineSpacingFactorToUse = this.lineSpacingFactor) {
                // Add null check for ctx
                if (!ctx) {
                    console.error("Canvas rendering context is null. Cannot draw text.");
                    return 0; // Return 0 height if context is unavailable
                }
                ctx.save();
                ctx.font = font;
                // Defensive check for color before setting fillStyle
                ctx.fillStyle = color !== undefined && color !== null ? color : 'black';
                ctx.textAlign = textAlign;
                ctx.textBaseline = textBaseline;
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.font = font;
                const tempMetrics = tempCtx.measureText('M');
                const actualLineHeight = (tempMetrics.actualBoundingBoxAscent || 0) + (tempMetrics.actualBoundingBoxDescent || 0);
                if (maxWidth === Infinity) {
                    ctx.fillText(text, x, y);
                    ctx.restore();
                    return actualLineHeight * lineSpacingFactorToUse;
                } else {
                    const words = text.split(' ');
                    let line = '';
                    let currentY = y;
                    let totalHeightUsed = 0;
                    for (let n = 0; n < words.length; n++) {
                        let testLine = line + (n > 0 ? ' ' : '') + words[n];
                        let metrics = ctx.measureText(testLine);
                        let testWidth = metrics.width;
                        if (testWidth > maxWidth && line.length > 0) {
                            ctx.fillText(line, x, currentY);
                            totalHeightUsed += actualLineHeight * lineSpacingFactorToUse;
                            currentY += actualLineHeight * lineSpacingFactorToUse;
                            line = words[n];
                        } else {
                            line = testLine;
                        }
                    }
                    ctx.fillText(line, x, currentY);
                    totalHeightUsed += actualLineHeight * lineSpacingFactorToUse;
                    ctx.restore();
                    return totalHeightUsed;
                }
            }
 
            /**
             * Creates a canvas-rendered button with custom styling and effects.
             * Moved to UltStoreApp for reusability.
             * @param {object} options - Button creation options.
             * @param {string} [options.text] - Text to display on the button.
             * @param {HTMLImageElement} [options.sprite] - Image sprite to display on the button.
             * @param {number} options.width - Width of the button canvas.
             * @param {number} options.height - Height of the button canvas.
             * @param {string} [options.textColor='black'] - Color of the button text.
             * @param {CanvasTextBaseline} [options.textBaseline='middle'] - Text baseline for rendering.
             * @param {CanvasTextAlign} [options.textAlign='center'] - Text alignment for rendering.
             * @param {string} [options.font='16px "Rodin', sans-serif'] - Font style for the text.
             * @param {function} [options.onClick] - Click event handler.
             * @param {string} [options.className='canvas-button'] - CSS class for the button element.
             * @param {string} [options.backgroundColor] - Base background color.
             * @param {string} [options.activeBackgroundColor] - Background color when active/pressed.
             * @param {number|number[]} [options.borderRadius=6] - Border radius (can be single value or array for each corner).
             * @param {string} [options.pulseColor=null] - Color for the pulse effect on click.
             * @param {object} [options.shadowOffset] - Shadow properties.
             * @returns {HTMLButtonElement} The created button element.
             */
            _createCanvasButton({
                text, sprite, width, height, textColor = 'black', textBaseline = 'middle',
                textAlign = 'center', font = '16px "Rodin", sans-serif', onClick, className = 'canvas-button',
                backgroundColor, activeBackgroundColor, borderRadius = 6, pulseColor = null,
                shadowOffset = { x: 0, y: 2, blur: 4, color: 'rgba(0,0,0,0.2)' }
            }) {
                const button = this.createElement('button', className);
                const canvas = this.createElement('canvas');
                button.appendChild(canvas);
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = false; // Disable anti-aliasing for pixel-perfect rendering

                const appInstanceRef = this; // Capture 'this' (UltStoreApp instance) for use in nested functions

                let pulseStartTime = 0;
                let isPulsing = false;
                let animationFrameId = null;
                let isHovered = false;
                let isPressed = false; // State for pressed effect

                const finalTextColor = textColor;

                // Method to update button text dynamically
                button.updateText = (newText) => {
                    text = newText;
                    draw();
                };

                // Starts the pulse animation
                const startPulse = () => {
                    isPulsing = true;
                    pulseStartTime = performance.now();
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    animationFrameId = requestAnimationFrame(animatePulse);
                };

                // Animation loop for the pulse effect
                const animatePulse = (currentTime) => {
                    if (!isPulsing) return;
                    const elapsed = currentTime - pulseStartTime;
                    const duration = 500; // Pulse animation duration
                    const progress = elapsed / duration;
                    if (progress < 1) {
                        draw(progress); // Redraw with current pulse progress
                        animationFrameId = requestAnimationFrame(animatePulse);
                    } else {
                        isPulsing = false;
                        animationFrameId = null;
                        draw(); // Final redraw without pulse
                    }
                };

                // Main drawing function for the button canvas
                const draw = (pulseProgress = 0) => {
                    ctx.clearRect(0, 0, width, height);
                    const isActive = button.classList.contains('active');
                    const isDisabled = button.disabled;

                    let currentBgColor;
                    let currentShadowOffset = { ...shadowOffset };

                    // Determine background color based on button state
                    if (isDisabled) {
                        currentBgColor = '#d1d5db'; // Tailwind gray-300
                        currentShadowOffset = { x: 0, y: 0, blur: 0, color: 'transparent' }; // No shadow when disabled
                    } else if (isPressed) {
                        currentBgColor = activeBackgroundColor || appInstanceRef.cssVars['--ds-accent-blue-dark']; // Darker for pressed
                        currentShadowOffset = { x: 0, y: 0, blur: 0, color: 'transparent' }; // No shadow when pressed
                    } else if (isActive) {
                        currentBgColor = activeBackgroundColor || appInstanceRef.cssVars['--ds-accent-blue'];
                    } else if (isHovered && !className.includes('share-button') && !className.includes('exit-button') && !className.includes('back-to-store-button') && !className.includes('add-to-cart-button') && !className.includes('checkout-button')) { // Exclude specific buttons from default hover
                        currentBgColor = appInstanceRef.cssVars['--ds-interactive-hover']; // Hover color for general buttons
                    } else {
                        // Default background colors
                        currentBgColor = backgroundColor || appInstanceRef.cssVars['--ds-interactive-bg'];
                    }

                    // Apply specific background colors for back and add-to-cart/checkout buttons
                    if (className.includes('back-button')) {
                        if (isDisabled) currentBgColor = 'rgba(128, 128, 128, 0.5)';
                        else currentBgColor = isPressed ? appInstanceRef.cssVars['--ds-accent-red'] : (isActive ? appInstanceRef.cssVars['--ds-accent-red'] : appInstanceRef.cssVars['--ds-accent-red']); // Red tones
                    } else if (className.includes('add-to-cart-button') || className.includes('checkout-button') || className.includes('back-to-store-button')) {
                        if (isDisabled) currentBgColor = 'rgba(128, 128, 128, 0.5)';
                        else currentBgColor = isPressed ? appInstanceRef.cssVars['--ds-accent-blue-dark'] : (isActive ? appInstanceRef.cssVars['--ds-accent-blue'] : appInstanceRef.cssVars['--ds-accent-blue']); // Green tones
                    } else if (className.includes('cart-button')) {
                        if (isDisabled) currentBgColor = 'rgba(128, 128, 128, 0.5)';
                        else currentBgColor = isPressed ? '#FDD835' : (isActive ? '#FDD835' : '#FFEB3B'); // Yellow tones
                    } else if (className.includes('exit-button')) {
                        if (isDisabled) currentBgColor = 'rgba(128, 128, 128, 0.5)';
                        else currentBgColor = isPressed ? appInstanceRef.cssVars['--ds-accent-red'] : (isActive ? appInstanceRef.cssVars['--ds-accent-red'] : appInstanceRef.cssVars['--ds-accent-red']); // Red tones for exit
                    } else if (className.includes('share-button')) { // Ensure share button is transparent
                        currentBgColor = 'transparent';
                    }


                    // Draw button background with shadow
                    ctx.save();
                    ctx.shadowColor = currentShadowOffset.color;
                    ctx.shadowBlur = currentShadowOffset.blur;
                    ctx.shadowOffsetX = currentShadowOffset.x;
                    ctx.shadowOffsetY = currentShadowOffset.y;

                    if (!(currentBgColor.startsWith('rgba') && currentBgColor.endsWith(',0)'))) {
                        ctx.fillStyle = currentBgColor;
                        ctx.beginPath();
                        // Handle borderRadius array for ctx.roundRect (top-left, top-right, bottom-right, bottom-left)
                        const radii = Array.isArray(borderRadius) ? {
                            topLeft: borderRadius[0], topRight: borderRadius[1],
                            bottomRight: borderRadius[2], bottomLeft: borderRadius[3]
                        } : borderRadius;
                        ctx.roundRect(0, 0, width, height, radii);
                        ctx.fill();
                    }
                    ctx.restore();

                    // Draw highlight gradient
                    ctx.save();
                    ctx.beginPath();
                    const highlightRadii = Array.isArray(borderRadius) ? {
                        topLeft: borderRadius[0], topRight: borderRadius[1],
                        bottomRight: borderRadius[2], bottomLeft: borderRadius[3]
                    } : borderRadius;
                    ctx.roundRect(0, 0, width, height, highlightRadii);
                    ctx.clip(); // Clip to the rounded rectangle shape
                    const highlightGradient = ctx.createLinearGradient(0, 0, 0, height);
                    highlightGradient.addColorStop(0, `rgba(255, 255, 255, 0.15)`);
                    highlightGradient.addColorStop(1, `rgba(255, 255, 255, 0)`);
                    ctx.fillStyle = highlightGradient;
                    ctx.fillRect(0, 0, width, height);
                    ctx.restore();

                    // Draw subtle inner shadow gradient
                    ctx.save();
                    ctx.beginPath();
                    const shadowRadii = Array.isArray(borderRadius) ? {
                        topLeft: borderRadius[0], topRight: borderRadius[1],
                        bottomRight: borderRadius[2], bottomLeft: borderRadius[3]
                    } : borderRadius;
                    ctx.roundRect(0, 0, width, height, shadowRadii);
                    ctx.clip();
                    const shadowGradient = ctx.createLinearGradient(0, 0, 0, height);
                    shadowGradient.addColorStop(0, `rgba(0, 0, 0, 0)`);
                    shadowGradient.addColorStop(1, `rgba(0, 0, 0, 0.1)`);
                    ctx.fillStyle = shadowGradient;
                    ctx.fillRect(0, 0, width, height);
                    ctx.restore();

                    // Apply glow effect for share button on hover
                    if (className.includes('share-button') && isHovered && !isDisabled) {
                        ctx.shadowColor = 'rgba(13, 110, 253, 0.8)';
                        ctx.shadowBlur = 15;
                    } else {
                        ctx.shadowColor = 'transparent';
                        ctx.shadowBlur = 0;
                        ctx.shadowOffsetX = 0;
                        ctx.shadowOffsetY = 0;
                    }

                    // Draw pulse effect
                    if (isPulsing && pulseColor && !isDisabled) {
                        const radius = pulseProgress * (Math.min(width, height) / 2 * 1.5);
                        const opacity = 0.5 * (1 - pulseProgress);
                        const r = parseInt(pulseColor.slice(1, 3), 16);
                        const g = parseInt(pulseColor.slice(3, 5), 16);
                        const b = parseInt(pulseColor.slice(5, 7), 16);
                        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${opacity})`;
                        ctx.beginPath();
                        ctx.arc(width / 2, height / 2, radius, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Draw sprite (icon)
                    if (sprite) {
                        const spriteSize = 20; // Fixed size for sprite
                        // Only draw if the sprite is loaded and not in a broken state
                        if (sprite.complete && sprite.naturalWidth !== 0) {
                            ctx.drawImage(sprite, (width - spriteSize) / 2, (height - spriteSize) / 2, spriteSize, spriteSize);
                        } else {
                            console.warn(`Sprite for button is not loaded or broken: ${sprite.src}`);
                        }
                    }
                    // Draw text
                    if (text) {
                        // Handle multi-line text for product cards
                        const lines = text.split('\n');
                        const lineHeight = parseInt(font) * 1.2; // Approximate line height
                        let currentTextY = (height / 2) - (lines.length - 1) * lineHeight / 2; // Adjust starting Y for centering multi-line

                        lines.forEach(line => {
                            // Use the captured appInstanceRef
                            appInstanceRef._drawTextOnCanvas(ctx, line, width / 2, currentTextY, font, finalTextColor, textAlign, textBaseline);
                            currentTextY += lineHeight;
                        });
                    }
                    // Reset shadow properties after drawing button content
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                };

                // Observe changes in button class or disabled attribute to trigger redraw
                const observer = new MutationObserver((mutationsList) => {
                    for (const mutation of mutationsList) {
                        if (mutation.type === 'attributes' && (mutation.attributeName === 'class' || mutation.attributeName === 'disabled')) {
                            draw();
                        }
                    }
                });
                observer.observe(button, { attributes: true });

                // Event listeners for hover and press effects
                button.addEventListener('mouseenter', () => {
                    if (button.disabled) return;
                    isHovered = true;
                    this.app.sounds.hover.play(); // Play hover sound
                    draw();
                });
                button.addEventListener('mouseleave', () => {
                    isHovered = false;
                    isPressed = false; // Ensure pressed state is reset if mouse leaves while pressed
                    draw();
                });
                button.addEventListener('mousedown', () => {
                    if (button.disabled) return;
                    isPressed = true;
                    this.app.sounds.appLaunch.play(); // Play click sound on mousedown
                    draw();
                });
                button.addEventListener('mouseup', () => {
                    if (button.disabled) return;
                    isPressed = false;
                    draw();
                });

                // Click event listener
                if (onClick) {
                    button.addEventListener('click', (e) => {
                        if (button.disabled) return;
                        if (pulseColor) startPulse(); // Start pulse animation if defined
                        onClick(e);
                    });
                }
                // Redraw button once sprite is loaded or immediately if already loaded
                if (sprite && !sprite.complete) sprite.onload = draw;
                else draw();
                return button;
            }

            /**
             * Translates a given key using the loaded translation data.
             * Supports nested keys (e.g., 'footer.exit') and replacements.
             * @param {string} key - The translation key.
             * @param {object} [replacements={}] - An object of placeholders and their values.
             * @returns {string} The translated string.
             */
            t(key, replacements = {}) {
                const keys = key.split('.');
                let value = this.translations;
                for (const k of keys) value = value ? value[k] : undefined;
                let str = value || key; // Fallback to key if translation not found
                for (const placeholder in replacements) str = str.replace(`{${placeholder}}`, replacements[placeholder]);
                return str;
            }

            /**
             * Loads translation data based on the current language setting.
             * Defaults to 'en-US' if the specified language data is not found or parsing fails.
             */
            loadTranslations() {
                try {
                    const langData = languageData[this.language] || languageData['en-US'];
                    this.translations = JSON.parse(langData);
                } catch (e) {
                    console.error("Failed to load or parse translations:", e);
                    // Fallback to English if parsing fails
                    this.translations = JSON.parse(languageData['en-US']);
                }
            }

            /**
             * Loads audio settings from localStorage.
             */
            loadAudioSettings() {
                try {
                    const storedSettings = localStorage.getItem('audioSettings');
                    if (storedSettings) {
                        const parsedSettings = JSON.parse(storedSettings);
                        this.audioSettings = { ...this.audioSettings, ...parsedSettings };
                    }
                } catch (e) {
                    console.error('Failed to load audio settings from localStorage:', e);
                }
            }

            /**
             * Saves current audio settings to localStorage.
             */
            saveAudioSettings() {
                try {
                    localStorage.setItem('audioSettings', JSON.stringify(this.audioSettings));
                } catch (e) {
                    console.error('Failed to save audio settings to localStorage:', e);
                }
            }

            /**

             */
            _initializeSounds() {
                const sfxVolume = 1.0 * this.audioSettings.volumeMultiplier.sfx;
                const musicVolume = 0.2 * this.audioSettings.volumeMultiplier.music;
                this.sounds = {

                    shareConfirm: new Howl({ src: ['assets/sfx/Start_2.wav'], volume: 0.8 * sfxVolume }),
                    appLaunch: new Howl({ src: ['assets/sfx/Change_Tab_Open.wav'], volume: 0.7 * sfxVolume }),
                    appExit: new Howl({ src: ['assets/sfx/Change_Tab_Close.wav'], volume: 0.7 * sfxVolume }),
                    typing: new Howl({
                        src: ['assets/sfx/tap1.wav', 'assets/sfx/tap2.wav', 'assets/sfx/tap3.wav'],
                        sprite: { s1: [0, 100], s2: [100, 100], s3: [200, 100] },
                        volume: 0.5 * sfxVolume
                    }),
                    inputFocus: new Howl({ src: ['assets/sfx/focus.wav'], volume: 0.7 * sfxVolume }),
                    inputBlur: new Howl({ src: ['assets/sfx/blur.wav'], volume: 0.7 * sfxVolume }),
