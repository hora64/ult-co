<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltShop</title>
    
    <!-- Theme Variables -->
    <link rel="stylesheet" href="/content/apps/ultshop/config/themeVars.css">
    
    <!-- Preload font FIRST -->
    <link rel="preload" href="/content/common/fonts/FOT-RodinNTLG Pro DB.otf" as="font" type="font/otf" crossorigin>
    
    <style>
        @font-face {
            font-family: "Rodin";
            src: url("/content/common/fonts/FOT-RodinNTLG Pro DB.otf") format("opentype");
            font-display: block;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Rodin", sans-serif;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #ds-container {
            width: var(--ultshop-width);
            height: var(--ultshop-height);
            background: #000;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #top-screen {
            width: var(--ultshop-top-screen-width);
            height: var(--ultshop-top-screen-height);
            position: relative;
            overflow: hidden;
            background: var(--ultshop-top-screen-gradient);
        }

        #bottom-screen {
            width: var(--ultshop-bottom-screen-width);
            height: var(--ultshop-bottom-screen-height);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Canvas rendering */
        canvas {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Page containers */
        .page-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .page-container.active {
            display: flex;
            flex-direction: column;
        }

        /* Background canvas */
        .bottom-screen-background {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* Product list with pagination */
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 45px 10px 45px;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        /* Canvas product card wrapper */
        .product-card-wrapper {
            cursor: pointer;
        }

        .product-card-wrapper canvas {
            display: block;
        }

        /* Header styles - canvas background replaces CSS */
        .page-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            z-index: 10;
        }

        /* Canvas button wrapper */
        .canvas-button-wrapper {
            display: inline-block;
        }

        .canvas-button-wrapper button {
            all: unset;
            cursor: pointer;
            display: block;
        }

        /* Product detail styles */
        .product-detail {
            padding: 60px 10px 50px;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .product-detail canvas {
            display: block;
            margin-bottom: 10px;
        }

        /* Cart styles */
        .cart-list {
            flex: 1;
            padding: 50px 10px 50px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            position: relative;
            z-index: 1;
        }

        .cart-item-wrapper {
            display: block;
        }

        .cart-item-wrapper canvas {
            display: block;
        }

        .cart-empty-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-total-wrapper {
            position: absolute;
            bottom: 50px;
            right: 10px;
            z-index: 2;
        }

        .cart-total-wrapper canvas {
            display: block;
        }

        /* Success page styles */
        .success-message {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .success-message canvas {
            display: block;
            margin: 10px auto;
        }

        /* Pagination - canvas background replaces CSS */
        .pagination-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* Scrollbar wrapper */
        .scrollbar-wrapper {
            position: absolute;
            right: 5px;
            top: 45px;
            bottom: 50px;
            z-index: 15;
        }
    </style>
</head>
<body>
    <div id="ds-container">
        <div id="top-screen"></div>
        <div id="bottom-screen"></div>
    </div>

    <!-- Import Map for Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
            "GLTFLoader": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/loaders/GLTFLoader.js",
            "Tween": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/libs/tween.module.min.js"
        }
    }
    </script>

    <script>
        // Preload font before loading any scripts
        (async function() {
            try {
                const font = new FontFace('Rodin', 'url("/content/common/fonts/FOT-RodinNTLG Pro DB.otf")');
                await font.load();
                document.fonts.add(font);
                console.log('[UltShop] Font preloaded in HTML');
            } catch (error) {
                console.warn('[UltShop] Font preload failed in HTML:', error);
            }
            
            // Load app module after font is ready
            const { UltShopApp } = await import('/content/apps/ultshop/assets/js/UltShopApp.js');
            const app = new UltShopApp();
            await app.init();
            window.ultShopApp = app;
        })();
    </script>
</body>
</html>
